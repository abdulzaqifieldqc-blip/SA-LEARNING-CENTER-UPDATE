<script id="global-app-search-v1">
(function(){
  var overlay,input,results,meta;
  function escHtml(v){return typeof esc==='function'?esc(v):String(v??'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function flatStrings(value,out,path,seen){
    if(value==null)return;
    if(typeof value==='string' || typeof value==='number' || typeof value==='boolean'){
      var t=String(value).trim(); if(t.length>=2) out.push({text:t,path:path||''}); return;
    }
    if(typeof value!=='object')return;
    if(seen.indexOf(value)>=0)return; seen.push(value);
    if(Array.isArray(value)){for(var i=0;i<value.length;i++)flatStrings(value[i],out,path+'['+i+']',seen);return;}
    Object.keys(value).forEach(function(k){
      if(k==='id' || k==='icon' || k==='image' || k==='photo' || k==='password' || k==='token')return;
      flatStrings(value[k],out,path?path+'.'+k:k,seen);
    });
  }
  function makeIndex(){
    var items=[], seenText={};
    function add(title,snippet,type,action,key){
      title=String(title||'').trim();snippet=String(snippet||'').replace(/\\s+/g,' ').trim();
      var text=(title+' '+snippet).trim(); if(!text)return;
      var k=(key||text).toLowerCase(); if(seenText[k])return; seenText[k]=1;
      items.push({title:title||'Hasil pencarian',snippet:snippet,type:type||'Konten aplikasi',action:action||null,key:k});
    }
    if(window.DB && Array.isArray(DB.modules)){
      DB.modules.forEach(function(m){
        var vals=[];flatStrings(m,vals,'',[]);
        var body=vals.map(function(x){return x.text}).filter(function(x){return x.length>1}).join(' ');
        add(m.title||m.name||'Materi',body.slice(0,500),'Materi Pembelajaran',function(){openModule(String(m.id),false)},'module:'+m.id);
      });
    }
    // Explicitly index the Welcome header so it is always searchable, even when rendered dynamically.
    var welcomeHeader=document.querySelector('.welcomeCopy h1');
    var welcomeSub=document.querySelector('.welcomeCopy p');
    if(welcomeHeader){add(welcomeHeader.textContent||'',welcomeSub?welcomeSub.textContent:'','Welcome / Dashboard',null,'welcome:header');}

    // Search current application UI text as well, excluding the search dialog itself.
    document.querySelectorAll('body *').forEach(function(el){
      if(el.closest('#globalSearchOverlay'))return;
      if(el.children.length>0)return;
      var t=(el.textContent||'').replace(/\\s+/g,' ').trim();
      if(t.length>=3 && t.length<=300) add(t,'','Teks di aplikasi',null,'ui:'+t.toLowerCase());
    });
    return items;
  }
  function render(q){
    var all=makeIndex(),needle=String(q||'').toLowerCase().trim();
    if(!needle){meta.textContent='Cari teks, materi, informasi, kuis, dan konten lainnya.';results.innerHTML='<div class="globalSearchEmpty"><b>Mulai mencari</b>Ketik kata atau kalimat yang ingin ditemukan.</div>';return;}
    var words=needle.split(/\\s+/).filter(Boolean);
    var ranked=all.map(function(x){
      var hay=(x.title+' '+x.snippet).toLowerCase(),score=0;
      if(hay.indexOf(needle)>=0)score+=30;
      words.forEach(function(w){if(hay.indexOf(w)>=0)score+=5});
      if(x.title.toLowerCase().indexOf(needle)>=0)score+=20;
      return {x:x,score:score};
    }).filter(function(x){return x.score>0}).sort(function(a,b){return b.score-a.score}).slice(0,40).map(function(x){return x.x});
    meta.textContent=ranked.length+' hasil ditemukan';
    if(!ranked.length){results.innerHTML='<div class="globalSearchEmpty"><b>Tidak ditemukan</b>Coba kata kunci lain yang ada di aplikasi.</div>';return;}
    results.innerHTML=ranked.map(function(x){
      var icon='<svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 0-3 3V4z"></path><path d="M8 8h7M8 12h7"></path></svg>';
      return '<button type="button" class="globalSearchResult" '+(x.action?'data-action="1"':'')+'><span class="globalSearchResultIcon">'+icon+'</span><span class="globalSearchResultBody"><strong class="globalSearchResultTitle">'+escHtml(x.title)+'</strong><small class="globalSearchResultType">'+escHtml(x.type)+'</small>'+(x.snippet?'<span class="globalSearchSnippet">'+escHtml(x.snippet.slice(0,240))+'</span>':'')+'</span></button>';
    }).join('');
    Array.from(results.querySelectorAll('.globalSearchResult')).forEach(function(btn,i){if(ranked[i].action)btn.onclick=function(){closeGlobalSearch();setTimeout(ranked[i].action,80)}});
  }
  window.openGlobalSearch=function(){
    overlay=document.getElementById('globalSearchOverlay');input=document.getElementById('globalSearchInput');results=document.getElementById('globalSearchResults');meta=document.getElementById('globalSearchMeta');
    if(!overlay)return;overlay.classList.add('show');document.body.style.overflow='hidden';setTimeout(function(){input&&input.focus()},50);render(input?input.value:'');
  };
  window.closeGlobalSearch=function(){if(!overlay)overlay=document.getElementById('globalSearchOverlay');if(overlay)overlay.classList.remove('show');document.body.style.overflow='';};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeGlobalSearch();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openGlobalSearch();}});
  document.addEventListener('input',function(e){if(e.target&&e.target.id==='globalSearchInput')render(e.target.value);});
})();
</script>










<script id="android-back-v19-two-press-exit">
(function(){
  if(window.__saAndroidBackV19) return;
  window.__saAndroidBackV19 = true;

  var suppressPush=false;
  var homeBackArmed=false;
  var exiting=false;

  function clone(v){
    try{return JSON.parse(JSON.stringify(v));}catch(e){return v;}
  }
  function snapshot(){
    var st=window.state||{};
    return {
      __saAppView:true,
      screen:st.screen||"home",
      moduleId:st.module&&st.module.id?String(st.module.id):null,
      slide:Number.isFinite(Number(st.slide))?Number(st.slide):0,
      quizIndex:Number.isFinite(Number(st.quizIndex))?Number(st.quizIndex):0,
      quizScore:Number.isFinite(Number(st.quizScore))?Number(st.quizScore):0,
      quizAnswers:clone(Array.isArray(st.quizAnswers)?st.quizAnswers:[]),
      quizChoices:clone(Array.isArray(st.quizChoices)?st.quizChoices:[]),
      isRemedial:!!st.isRemedial
    };
  }
  function sig(s){
    return [s.screen,s.moduleId,s.slide,s.quizIndex,s.quizScore,JSON.stringify(s.quizAnswers||[]),JSON.stringify(s.quizChoices||[]),s.isRemedial].join("|");
  }
  function restore(s){
    if(!s||!s.__saAppView||!window.state)return false;
    suppressPush=true;
    try{
      state.screen=s.screen||"home";
      state.slide=Number(s.slide)||0;
      state.quizIndex=Number(s.quizIndex)||0;
      state.quizScore=Number(s.quizScore)||0;
      state.quizAnswers=clone(s.quizAnswers||[]);
      state.quizChoices=clone(s.quizChoices||[]);
      state.isRemedial=!!s.isRemedial;
      state.module=(s.moduleId&&window.DB&&Array.isArray(DB.modules))?
        (DB.modules.find(function(m){return String(m.id)===String(s.moduleId);})||null):null;
      if(typeof renderAndScrollTop==='function')renderAndScrollTop();
      else if(typeof render==='function')render();
      return true;
    }catch(e){console.error("SA Back restore error:",e);return false;}
    finally{suppressPush=false;}
  }
  function toast(msg){
    try{
      var id="saAndroidBackGuardToast",old=document.getElementById(id);
      if(old)old.remove();
      var n=document.createElement("div");n.id=id;n.textContent=msg;
      n.style.cssText="position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:999999;max-width:calc(100vw - 32px);padding:12px 16px;border-radius:14px;background:#18243a;color:#fff;font:600 13px/1.4 system-ui,sans-serif;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.22);pointer-events:none";
      document.body.appendChild(n);setTimeout(function(){n.remove()},1400);
    }catch(e){}
  }

  // One sentinel + one Home entry. Inside the app, Back restores exactly one
  // previous view. At Home: first Back arms exit; second Back is allowed to
  // reach the Android/WebView boundary.
  try{
    history.replaceState({__saRootSentinel:true},"",location.href);
    history.pushState(snapshot(),"",location.href);
  }catch(e){}

  var originalRender=window.render;
  if(typeof originalRender==='function'){
    window.render=function(){
      var before=sig(snapshot());
      var result=originalRender.apply(this,arguments);
      var after=sig(snapshot());
      if(!suppressPush && before!==after){
        try{history.pushState(snapshot(),"",location.href);}catch(e){}
        // Navigating away from Home resets the two-press exit sequence.
        if(state.screen!=="home")homeBackArmed=false;
      }
      return result;
    };
  }

  window.addEventListener("popstate",function(ev){
    if(exiting)return;

    if(ev.state&&ev.state.__saAppView){
      restore(ev.state);
      homeBackArmed=false;
      return;
    }

    if(ev.state&&ev.state.__saRootSentinel){
      if(window.state&&state.screen!=="home"){
        // Back from a child screen -> Home. This is the normal single Back.
        suppressPush=true;
        state.screen="home";state.module=null;state.slide=0;state.quizIndex=0;
        try{if(typeof render==='function')render();}finally{suppressPush=false;}
        homeBackArmed=false;
        return;
      }

      // At Home: first press does not exit. Second press is allowed through.
      if(!homeBackArmed){
        homeBackArmed=true;
        toast("Tekan Back sekali lagi untuk keluar dari aplikasi");
        try{history.pushState({__saHomeExitArmed:true},"",location.href);}catch(e){}
        return;
      }

      exiting=true;
      // Remove the guard entry, then hand control back to the WebView/Android.
      try{history.back();}catch(e){}
      setTimeout(function(){
        try{if(window.Android&&typeof window.Android.closeApp==='function')window.Android.closeApp();}
        catch(e){}
        try{if(window.close)window.close();}catch(e){}
      },80);
      return;
    }

    // The armed Home entry is intentionally a second-level exit boundary.
    if(ev.state&&ev.state.__saHomeExitArmed){
      if(homeBackArmed){
        exiting=true;
        try{history.back();}catch(e){}
        setTimeout(function(){
          try{if(window.Android&&typeof window.Android.closeApp==='function')window.Android.closeApp();}catch(e){}
          try{if(window.close)window.close();}catch(e){}
        },80);
      }
    }
  },false);
})();
</script>

<script id="saEgressOptimizationV1">
(function(){
  "use strict";
  if(window.__SA_EGRESS_OPT_V1__) return;
  window.__SA_EGRESS_OPT_V1__=true;

  function install(){
    const sb=window.SA_SUPABASE;
    if(!sb || typeof sb.request!=="function" || sb.request.__egressOptV1) return;
    const original=sb.request;
    const cache=new Map();

    const ttlFor=function(path){
      if(/^\/rest\/v1\/sa_sync_materials(?:\?|$)/.test(path)) return 30000;
      if(/^\/rest\/v1\/sa_sync_login_activity(?:\?|$)/.test(path)) return 15000;
      if(/^\/rest\/v1\/sa_users(?:\?|$)/.test(path)) return 15000;
      if(/^\/rest\/v1\/dashboard_notifications(?:\?|$)/.test(path)) return 30000;
      if(/^\/rest\/v1\/sa_sync_progress(?:\?|$)/.test(path)) return 15000;
      if(/^\/rest\/v1\/sa_sync_performance(?:\?|$)/.test(path)) return 15000;
      return 0;
    };

    const invalidate=function(path){
      const table=(String(path).match(/^\/rest\/v1\/([^?\/]+)/)||[])[1];
      if(!table) return;
      for(const key of cache.keys()){
        if(key.startsWith("/rest/v1/"+table+"?") || key==="/rest/v1/"+table) cache.delete(key);
      }
    };

    const wrapped=async function(path, options){
      const method=String(options?.method||"GET").toUpperCase();
      const key=String(path||"");
      if(method!=="GET"){
        invalidate(key);
        return original.apply(this, arguments);
      }
      const ttl=ttlFor(key);
      if(!ttl) return original.apply(this, arguments);

      const now=Date.now();
      const hit=cache.get(key);
      if(hit && (now-hit.at)<ttl) return hit.data;

      const data=await original.apply(this, arguments);
      cache.set(key,{at:Date.now(),data:data});
      return data;
    };
    wrapped.__egressOptV1=true;
    wrapped.clearCache=function(){cache.clear()};
    sb.request=wrapped;
  }

  if(window.SA_SUPABASE) install();
  else setTimeout(install,0);
  window.addEventListener("load",install,{once:true});
})();
</script>

    ['Risiko yang Ditanggung', `Risiko yang terjadi:\n• Meninggal dunia.\n• Cacat tetap total.\n• Rawat inap akibat penyakit atau kecelakaan.`],
    ['Manfaat Rawat Inap', `• 1–14 hari → 1x cicilan bulanan.\n• 15–30 hari → 2x cicilan bulanan.\n• 31–90 hari → 3x cicilan bulanan.\n\nKetentuan lain yang tercantum dalam materi:\n• Usia yang dilindungi: 18–60 tahun.\n• Nilai pembiayaan: Rp1 juta–Rp30 juta.\n• Masa tunggu: 3 hari sejak polis aktif sesuai ketentuan materi.\n• Tidak dilakukan pemeriksaan kesehatan; pelanggan menyetujui pernyataan kesehatan.`],
    ['Cara Menawarkan AkuJaga', `Gunakan alur KUAT:\n\nK — Kenali Profil pelanggan.\nU — Ungkapkan potensi masalah/risiko.\nA — Ajukan solusi dengan AkuJaga.\nT — Tangani keberatan pelanggan.\n\nAkuJaga bersifat pilihan, bukan wajib. Setelah pelanggan memahami manfaat dan setuju, lakukan closing.`],
    ['Manfaat AkuJaga untuk Pelanggan & SA', `Untuk Pelanggan:\n• Perlindungan dari risiko tidak mampu membayar.\n• Perlindungan cacat tetap hingga kematian.\n• Mengurangi kekhawatiran terhadap denda/penalti.\n• Memberikan ketenangan.\n\nUntuk SA:\n• Mengurangi risiko gagal bayar.\n• Meningkatkan kepuasan dan peluang repeat order.\n• Menambah GMV.\n• Kesempatan reward trip.\n• Insentif 4% dari premi.\n• Tambahan Rp300.000 jika penetrasi minimum 130% dan transaksi minimum 25.`],
    ['Hal yang Wajib Diperhatikan SA', `• Jelaskan produk dan manfaatnya dengan benar.\n• AkuJaga bersifat pilihan, bukan wajib.\n• Jangan memasukkan perlindungan tanpa persetujuan pelanggan.\n• Jangan melakukan mis-selling.\n• Setelah pembayaran, lakukan proses upload foto IMEI/invoice sesuai ketentuan.\n• Jangan memberikan barang sebelum proses verifikasi selesai.\n\nKlaim: pelanggan mengajukan klaim → dokumen diperiksa → verifikasi asuransi → validasi → hasil klaim → pembayaran jika disetujui.\n\nRefund mengikuti ketentuan pembatalan dan diajukan melalui CS Akulaku. Refund tidak dapat dilakukan jika pelanggan sudah mengajukan klaim ke Cermati.`]
  ]);

  setSlides('akusiaga', [
    ['Apa Itu AkuSiaga?', `AkuSiaga (Home Content Protection) adalah perlindungan tambahan yang memberikan santunan atas risiko kehilangan atau kerusakan barang isi rumah, sekaligus perlindungan kecelakaan diri dan santunan tempat tinggal sementara.\n\nPerlindungan selama 12 bulan.\n\nDengan harga premi Rp. 299.000,-.`],
    ['Apa Saja yang Dilindungi?', `Perlindungan isi rumah:\n• Huru-hara & kerusuhan.\n• Pencurian/kebongkaran.\n• Kebakaran & sambaran petir.\n• Bencana alam.\n\nPerlindungan tambahan:\n• Kecelakaan diri.\n• Santunan tempat tinggal sementara.`],
    ['Biaya & Manfaat', `• Premi: Rp299.000.\n• Perlindungan: 12 bulan.\n• Biaya proteksi otomatis masuk dalam cicilan pelanggan.\n• Berlaku untuk semua komoditi.\n• Perlindungan isi rumah hingga Rp35 juta sesuai tipe barang.\n• Kecelakaan diri hingga Rp35 juta sesuai limit pelanggan.\n• Santunan tempat tinggal sementara sesuai tagihan, maksimal Rp2,5 juta.`],
    ['Jenis Barang yang Dilindungi', `Tipe A — penggantian Rp1 juta/barang:\n• Televisi, kulkas, mesin cuci, AC, microwave/oven listrik, kompor listrik, CCTV, PlayStation, Xbox Controller, Nintendo Switch, kursi pijat listrik, sofa, kasur, lemari, treadmill listrik.\n\nTipe B — penggantian Rp500 ribu/barang:\n• Meja, kipas angin, kompor gas, radio tape.\n\nTipe C — penggantian Rp300 ribu/barang:\n• Hair dryer, dispenser air listrik, vacuum cleaner, rice cooker, alat pijat listrik.\n\nMudah diingat: A = Rp1 Juta | B = Rp500 Ribu | C = Rp300 Ribu.`],
    ['Klaim & Hal yang Wajib Diingat', `Klaim dapat diajukan untuk:\n• Perlindungan isi rumah.\n• Kecelakaan pribadi.\n• Kompensasi tempat tinggal sementara.\n\nAlur klaim:\nLaporkan → Upload dokumen → Review → Pembayaran.\n\nPenting:\n• Pelaporan maksimal 14 hari kalender sejak risiko terjadi.\n• Review maksimal 7 hari kerja setelah dokumen lengkap.\n• Pembayaran maksimal 3 hari kerja setelah klaim disetujui.\n• Klaim dapat diajukan berulang dan dapat mengajukan 2 tipe klaim sekaligus selama limit masih tersedia.\n\nJangan melakukan misselling: jelaskan manfaat dan biaya dengan jelas, pastikan pelanggan memahami sebelum menyetujui, dan jangan memasukkan VAS tanpa sepengetahuan pelanggan.`],
    ['Cara Menawarkan AkuSiaga', `Jelaskan manfaat, bukan hanya nama produk.\n\nContoh:\n“Kak, pembiayaan ini bisa ditambahkan perlindungan AkuSiaga untuk melindungi isi rumah dari risiko seperti kebakaran, pencurian, dan bencana alam. Ada juga perlindungan kecelakaan diri dan santunan tempat tinggal sementara.”\n\nWajib dijelaskan kepada pelanggan:\n1. Informasi perlindungan.\n2. Biaya tambahan.\n3. Manfaat perlindungan.\n4. Lama perlindungan.\n\nPastikan pelanggan memahami dan menyetujui perlindungan yang dipilih.`]
  ]);

  setSlides('home-service', [
    ['Apa Itu Home Service?', `Home Service adalah proses transaksi di luar toko >500m dari toko (selain toko pameran).\n\nHome Service membantu proses transaksi COD di luar toko dengan tetap mengikuti ketentuan dokumentasi dan pelaporan.`],
    ['Ketentuan & Larangan', `Ketentuan utama:\n• Hanya berlaku untuk toko yang difasilitasi oleh SA.\n• Wajib lapor kepada ASL jika ada transaksi COD dan share live location.\n• Wajib bertemu dengan pelanggan saat transaksi untuk scan barcode.\n• Setelah transaksi berhasil dan barang diterima user, SA wajib mendokumentasikan foto SA + user + produk dalam 1 frame.\n• Wajib mengisi G-Form.\n\nTidak diperbolehkan:\n• Pihak mitra/toko yang tidak difasilitasi SA.\n• Manipulasi data/foto.\n• Tidak ada konfirmasi ke atasan/ASL.\n• Sharing barcode.\n• Membawa barang toko tanpa didampingi orang toko.\n• SA menerima uang DP (jika ada).\n• Tidak membuat laporan di G-Form.`],
    ['Alur Transaksi Home Service', `1. Adanya permintaan COD menggunakan Akulaku.\n2. SA Akulaku bersama pihak toko datang menemui pelanggan dengan membawa barang yang akan dibeli.\n3. Melakukan transaksi yang dibantu oleh SA Akulaku.\n\nJika ditolak: pihak toko membawa kembali barangnya.\n\nJika disetujui:\n• Pihak toko menyerahkan barang kepada user.\n• SA melakukan swafoto bersama user beserta barang yang sudah diserahkan.\n• SA membuat laporan pada G-Form.`],
    ['Standar Foto, G-Form & Deviasi', `Foto harus jelas dan tidak blur. Gunakan GPS Camera supaya terlihat titik koordinat lokasi. Wajah user dan SA harus terlihat jelas. Tidak menggunakan masker.\n\nTidak diperbolehkan foto tanpa GPS Camera, wajah tidak jelas/terpotong/ditutup emoji, user tidak sesuai, tidak ada foto user/SA, hanya foto produk, user tidak memegang barang dan box, atau foto direkayasa/diedit.\n\nG-Form membutuhkan data SA, merchant/toko, ASL, identitas pelanggan, tanggal dan alamat COD, Order ID/No Pembayaran Diterima, spesifikasi produk, serta foto sesuai ketentuan.\n\nUntuk barang keluarga, barang harus diperuntukkan bagi keluarga dalam 1 KK yang sama dengan user dan menggunakan G-Form KK sesuai ketentuan.`]
  ]);

  setSlides('repayment-reminder', [
    ['Apa Itu Repayment Reminder?', `Repayment Reminder adalah pengingat kepada pelanggan mengenai kewajiban pembayaran cicilan agar pelanggan mengetahui waktu pembayaran, cara pembayaran, dan konsekuensi keterlambatan.`],
    ['Mengapa SA Wajib Mengingatkan Pembayaran?', `• Agar SA tidak terkena potongan.\n• Supaya pelanggan masih bisa mengajukan kembali.\n• Supaya hasil scoring BI checking bagus.\n• Supaya pelanggan tidak kesulitan jika mengambil pembiayaan lain.`],
    ['Konsekuensi & Aturan Follow-up', `Konsekuensi yang perlu dijelaskan sesuai materi:\n• Denda keterlambatan.\n• Penagihan oleh tim Collection Akulaku.\n• Catatan kredit pelanggan di BI/OJK menjadi buruk dan sulit mendapat pembiayaan dari Akulaku.\n• Konsekuensi legal yang dapat berlanjut ke ranah hukum.\n\nFollow-up:\n• Hanya melalui telepon/WA/SMS — tidak boleh kunjungan langsung ke rumah.\n• Pukul 08.00–20.00 waktu setempat, Senin–Sabtu.\n• Tidak menghubungi pada hari Minggu.\n• Pelanggan yang sama maksimal 3x dalam sehari.\n• Gunakan bahasa yang sopan.\n• Tanyakan PTP (Promise to Pay) / Tanggal Janji Bayar.`],
    ['Tahapan Menghubungi Pelanggan', `1. Beri salam & perkenalan diri.\n2. Konfirmasi pelanggan.\n3. Minta waktu.\n4. Ingatkan pembayaran, denda, dan cara bayar.\n5. Tanyakan janji bayar.\n6. Penutup.`],
    ['Bukti Follow-up yang Wajib Diunggah', `Setelah SA menghubungi atau melakukan chat dengan pelanggan:\n\n• WAJIB upload bukti percakapan / WhatsApp sebagai bukti follow-up.\n• Bukti harus menunjukkan bahwa SA sudah menghubungi pelanggan terkait pembayaran.\n• Upload bukti setelah follow-up dilakukan.`]
  ]);

  setSlides('skema-benefit', [
    ['Apa Itu Skema Benefit & Insentif?', `Skema Benefit & Insentif menjelaskan komponen benefit, target, coefficient, bonus, dan potongan yang tercantum dalam materi SA.`],
    ['Daily Fee', `Jawa: Rp130.000 per hari.\nOuter Jawa: Rp120.000 per hari.\n\nMulai 1 Agustus: Daily fee dibayarkan penuh, tanpa harus capai 100Juta.\n\nKetentuan:\n• Tambahan Rp250.000 jika total kehadiran =>26 hari, min Ach 85% dan task ticket 100%.\n• Potongan 25 ribu jika terlambat: 25,000 x 3 = 75,000.\n• Terlambat >3x tambahan potongan 300ribu.\n• Contoh terlambat 4x: 25,000 x 4 + 300,000 = 400,000.\n\nInsentif dibayarkan bersama daily fee di bulan berjalan.`],
    ['Target Berdasarkan Vintage', `M0: 30 Juta\nM1: 40 Juta\nM2: 60 Juta\nM3: 90 Juta\nM3+: 120 Juta\n\nTarget digunakan untuk evaluasi SA setiap bulan dan dihitung dalam Sales Coefficient SA M0–M6. Ketentuan evaluasi dan deviasi mengikuti materi yang berlaku.`],
    ['Allowance', `• Perlindungan kecelakaan kerja: didapatkan setelah 1 bulan bergabung.\n• Tunjangan kesehatan: Rp200.000 per bulan untuk SA M12+.\n• Annual Bonus SA M12+: Rp1.000.000 setiap 6 bulan, dengan syarat pencapaian >85% selama 6 bulan terakhir.`],
    ['Insentif Coefficient & Sales Coefficient', `Incentive = GMV x IC x SC.\n\nGMV | IC VAS | IC non VAS\n<60,000,000 | 1.0% | 0.3%\n60,000,000 - 120,000,000 | 1.2% | 0.36%\n120,000,000 - 200,000,000 | 1.7% | 0.6%\n>200,000,000 | 2.1% | 1.05%\n\nSales Coefficient:\n<60% | 0\n60 - <85% | 0.6\n85 - <100% | 0.8\n100 - <130% | 1\n>=130% | 1.1`],
    ['Extra Bonus', `Untuk SA yang capai minimal 150JT Successful GMV:\n• 150–200jt: Rp500.000\n• 200–<250jt: Rp750.000\n• >=250jt: Rp1.000.000`],
    ['Potongan Risk & Quality Deduction', `RISK DEDUCTION: 150% dari insentif per kontrak dari pelanggan terlambat bayar >30 hari hingga cicilan ke-3.\n\nContoh: transaksi 10jt dengan asumsi insentif koefisien SA 1% → 10jt x 1% x 1.5 = 150,000.\n\nQUALITY DEDUCTION / ZERO BONUS dapat berlaku sesuai ketentuan materi, termasuk kesalahan penginputan data (human error, wrong store name, wrong price, IMEI, Photo, Invoice).\n\nBonus tidak dibayarkan jika SA resign di tengah bulan atau dibawah 15 hari sebelum resign date.`]
  ]);

  setSlides('akutipper', [
    ['Apa Itu AkuTipper?', `AkuTipper adalah insentif tambahan untuk SA/MDO di dalam aplikasi Akulaku.\n\nTerdapat 3 produk:\n• Pinjaman.\n• Dana Cicil.\n• Pembiayaan di Toko.`],
    ['Produk & Urutan Binding', `Produk yang harus ditawarkan terlebih dahulu ketika binding pelanggan dengan AkuTipper:\n\n➡️ Pinjaman\n\nJika pelanggan tertarik mengajukan Pinjaman & Pembiayaan di Toko, proses terlebih dahulu:\n➡️ Pembiayaan di Toko\n\nAlasan: jika SA memproses pinjaman terlebih dahulu, dikhawatirkan limit pembiayaan offline pelanggan tidak dapat digunakan.`],
    ['Proses Binding AkuTipper', `1. SA buka aplikasi Akulaku → menu Akun AkuTipper (atau klik search: AkuTipper).\n2. Ke halaman Pinjaman → klik “Promosikan sekarang”.\n3. Copy link → paste ke UC Browser.\n4. Masukkan nomor telepon pelanggan → pilih partisipasi.\n5. Pelanggan mendapatkan limit pinjaman.\n6. SA pilih “Rekening Penerima” → tap-tap layar / masuk ke halaman pilihan bank.`],
    ['Bonus SA / MDO', `Jika proses binding berhasil:\n• Pelanggan baru berhasil mendapatkan limit → Rp30.000.\n• Pelanggan baru berhasil mengajukan Pinjaman / Dana Cicil → Rp50.000.`],
    ['Bonus AkuTipper & Contoh', `Untuk AkuTipper (bukan SA/MDO):\n• Pelanggan berhasil mengajukan Pembiayaan di Toko → Rp60.000.\n\nJika Pinjaman & Pembiayaan di Toko berhasil:\nRp140.000 = Rp30.000 + Rp50.000 + Rp60.000.`]
  ]);

  setSlides('asuransi-kecelakaan', [
    ['Apa Itu Asuransi Kecelakaan?', `Asuransi Kecelakaan untuk SA memberikan perlindungan ketika SA mengalami kecelakaan yang termasuk dalam ketentuan perlindungan.\n\nSistem klaim menggunakan reimbursement, sehingga biaya yang memenuhi ketentuan dapat diajukan melalui alur pelaporan yang sudah ditetapkan.`],
    ['Manfaat & Risiko yang Ditanggung', `Manfaat utama:\n• Kematian akibat kecelakaan: dasar uang pertanggungan per individu IDR 10.000.000.\n• Cacat tetap: maksimal 100% dari Uang Pertanggungan Kematian Akibat Kecelakaan.\n• Biaya pengobatan: maksimal IDR 1.000.000 tiap kecelakaan.\n\nPerluasan manfaat:\n• Biaya pemakaman: IDR 2.500.000.\n• Santunan patah tulang ringan dan lainnya: IDR 5.000.000.\n• Perluasan rehabilitasi dan mobilitas: IDR 5.000.000.\n• Santunan rawat inap akibat kecelakaan: IDR 500.000 per hari, maksimal 7 hari.\n• Biaya transportasi: IDR 1.000.000.\n\nRisiko yang ditanggung adalah kecelakaan yang memenuhi ketentuan penggunaan sepeda motor.`],
    ['Alur Pelaporan & Dokumen', `1. SA atau keluarga memberitahukan kejadian kepada ASM/RSM.\n2. ASM/RSM menginformasikan kejadian kepada Tim Ops.\n3. Tim Ops menginformasikan kepada pihak asuransi melalui email maksimal 30 hari sejak kejadian.\n\nDokumen:\n• Foto KTP.\n• Kronologis kejadian.\n• Foto kejadian/luka.\n\nDokumen fisik/asli harus diserahkan ke kantor sebelum 180 hari sejak kejadian.`]
  ]);

  setSlides('cara-menjual-cicilan', [
    ['Apa Tujuan Materi Ini?', `Panduan praktis SA Akulaku menawarkan cicilan dari mengenali kebutuhan pelanggan sampai closing, kemudian melakukan follow-up dan menawarkan perlindungan yang relevan.`],
    ['Kenali Kebutuhan Pelanggan', `Sebelum menawarkan cicilan, pahami dulu:\n• Barang apa yang ingin dibeli?\n• Berapa budget pelanggan?\n• Apakah pelanggan ingin cicilan?\n• Berapa kemampuan pembayaran per bulan?\n• Apakah pelanggan membutuhkan tenor tertentu?\n\nTujuan: cari tahu kebutuhan pelanggan, bukan langsung menawarkan produk.`],
    ['Tawarkan Solusi Cicilan', `Setelah mengetahui kebutuhan, tawarkan cicilan Akulaku sebagai solusi.\n\nJelaskan sesuai kondisi pelanggan:\n• Pilihan tenor.\n• Perkiraan cicilan.\n• DP jika ada.\n• Biaya yang relevan.\n• Ketentuan pembiayaan.\n\nJangan memberikan informasi yang tidak sesuai dengan sistem.`],
    ['Gali Ketertarikan & Tangani Keraguan', `Pertanyaan sederhana:\n• “Kakak lebih nyaman cicilan berapa bulan?”\n• “Kalau cicilannya di kisaran segini, apakah sesuai dengan budget Kakak?”\n\nJika pelanggan ragu, cari tahu alasannya: cicilan terlalu besar, tenor kurang sesuai, masih ingin berpikir, khawatir dengan biaya, atau belum memahami pembayaran.\n\nGunakan pola: Dengarkan → Jelaskan → Berikan pilihan → Konfirmasi kembali.`],
    ['Pastikan Pelanggan Memahami Sebelum Closing', `Pastikan pelanggan memahami:\n• Harga barang.\n• DP jika ada.\n• Tenor.\n• Besaran cicilan.\n• Biaya yang berlaku.\n• Cara pembayaran.\n• Kewajiban membayar tepat waktu.\n\nSetelah pelanggan paham dan setuju, lanjutkan proses pengajuan.`],
    ['Setelah Cicilan Berhasil', `Jangan berhenti setelah transaksi.\n\nSA dapat menawarkan perlindungan yang relevan sesuai kebutuhan barang pelanggan:\n📱 Gadget → Gadget Protection\n🏠 Barang rumah → AkuSiaga\n💳 Perlindungan cicilan → AkuJaga\n\nSetelah pelanggan memiliki cicilan, lakukan juga pengingat pembayaran sesuai ketentuan.\n\nIntinya:\nKenali kebutuhan → Tawarkan cicilan → Gali kemampuan → Tangani keraguan → Pastikan pelanggan paham → Closing → Tawarkan perlindungan yang relevan → Follow-up pembayaran.`]
  ]);

<script id="saMateriKuisSeparatePagesV1">
(function(){

  const escPage=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

      <label class="saHubSearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="saAllMaterialSearch" type="search" placeholder="Cari materi..." autocomplete="off"></label>

    scrollPageTop();
  };
  window.renderAllQuizzesPage=function(){
    const root=document.getElementById('app')||document.getElementById('root');if(!root)return;
    const mods=learningMods().filter(m=>quizFor(m.id).length),p=progress();

    scrollPageTop();
  };
  window.saLearningHubBack=function(){state.screen='home';state.module=null;render();setTimeout(scrollPageTop,0);};
  // Override the existing scroll-only Materi/Kuis navigation with actual pages.
  window.dashboardNav=function(btn,section){
    document.querySelectorAll('aside nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');

    if(section==='quiz'){state.screen='quiz-hub';state.module=null;render();return;}
    if(section==='activity'){try{openActivities()}catch(e){};return;}
    if(section==='runrate'){openRunrateFromSidebar(null);return;}

    if(section==='achievement'){const el=document.getElementById('achievementSection');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return;}
    if(section==='advanced'){const el=document.getElementById('phAdvancedCenterSection');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return;}
    if(section==='updates'){const el=document.getElementById('phToolsSection');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return;}

  };

<script id="sa-material-single-page-v17">
(function(){
  if(window.__saMaterialSinglePageV17) return;
  window.__saMaterialSinglePageV17 = true;
  const oldRenderLesson = window.renderLesson;

  function escV17(v){
    if(typeof esc === 'function') return esc(v);
    return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function renderTextV17(text){
    let lines=String(text||'').replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean),out=[],table=[];
    const flushTable=()=>{
      if(!table.length)return;
      const rows=table.map(r=>r.split('|').map(x=>x.trim()));
      const head=rows.shift()||[];
      out.push('<div class="materialTableWrap"><table class="materialTable"><thead><tr>'+head.map(x=>'<th>'+escV17(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+escV17(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');
      table=[];
    };
    lines.forEach(line=>{
      const imageMatch=line.match(/^\[\[SA_IMAGE\|([^\]]+)\]\]$/);
      if(imageMatch && /^data:image\//i.test(imageMatch[1])){
        flushTable();
        out.push('<div class="materialImage"><img src="'+escV17(imageMatch[1])+'" alt="Gambar materi"></div>');
        return;
      }
      if(line.includes('|')){table.push(line);return;}
      flushTable();
      if(/^#{2,3}\s+/.test(line)) out.push('<div class="materialSubhead">'+escV17(line.replace(/^#{2,3}\s+/,''))+'</div>');
      else if(/^[-•]\s*/.test(line)) out.push('<div class="materialBullet"><span>•</span><div>'+escV17(line.replace(/^[-•]\s*/,''))+'</div></div>');
      else if(/^[A-Z][A-Z\s&]+$/.test(line) && line.length>3) out.push('<div class="materialSubhead">'+escV17(line)+'</div>');
      else out.push('<div class="materialParagraph">'+escV17(line)+'</div>');
    });
    flushTable();
    return out.join('');
  }

  window.renderLesson = function(){
    const m=state.module;
    if(!m){ if(oldRenderLesson) return oldRenderLesson(); return; }
    // Tool pages such as Simulasi Cicilan keep their specialized renderer.
    if(m.tool){ if(oldRenderLesson) return oldRenderLesson(); return; }

    const p=progress();
    const completed=!!p.passed?.[m.id];
    const slides=Array.isArray(m.slides)?m.slides:[];
    const id=String(m.id||'').toLowerCase();

    let sections='';
    slides.forEach((s,index)=>{
      const title=String(s?.[0]||('Bagian '+(index+1))).replace(/^#{2,3}\s+/,'');
      const raw=String(s?.[1]||'').replace(/\r/g,'');
      let body='';
      if(id==='sa-activities'){
        const photoKey=`sa_activity_photo_${state.user?.id||'SA'}_${m.id}_${index}`;
        const saved=localStorage.getItem(photoKey)||'';
        body='<div class="stepContent">'+renderTextV17(raw)+'</div>'+
          '<div class="activityUpload"><label>📷 Wajib Upload Foto</label><div class="activityFileRow"><input type="file" accept="image/*" onchange="handleActivityPhoto(this,\''+photoKey.replace(/'/g,"\\'")+'\')"></div><div class="activityPhotoStatus">'+(saved?'✅ Foto sudah dipilih.':'Silakan pilih foto dari galeri untuk aktivitas ini.')+'</div><div class="activityPreviewWrap '+(saved?'show':'')+'">'+(saved?'<img class="activityPreview show" src="'+escV17(saved)+'" alt="Preview foto"><button type="button" class="photoDelete photoDeletePreview" aria-label="Hapus foto" onclick="removeActivityPhoto(\''+photoKey.replace(/'/g,"\\'")+'\')">×</button>':'')+'</div></div>';
      }else{
        body='<div class="stepContent">'+renderTextV17(raw)+'</div>';
      }
      sections += '<section class="saSingleMaterialSection" data-material-section="'+index+'">'+
        '<div class="saSingleSectionNo">BAGIAN '+(index+1)+'</div>'+
        '<h2 class="saSingleSectionTitle">'+escV17(title)+'</h2>'+body+
      '</section>';
    });

    root.innerHTML='<div class="stepLesson saSingleMaterialLesson">'+
      '<div class="stepHeader saSingleHeader">'+
        '<div class="stepHeaderTop"><button class="stepBack" onclick="returnToMenu()">Back</button><div class="stepHeaderTitle">'+escV17(m.title)+'</div><button class="stepHome" onclick="homeHere()">Home</button></div>'+
        '<div class="saSingleMeta"><span>Materi Pembelajaran</span><span class="saSingleCount">'+slides.length+' bagian</span></div>'+
        '<div class="stepProgress saSingleProgress"><i id="saSingleProgressBar" style="width:'+(completed?'100':'0')+'%"></i></div>'+
      '</div>'+
      '<div class="stepWrap saSingleWrap">'+
        '<div class="stepCard materialContentCard saSingleContentCard">'+
          '<span class="stepEyebrow">MODUL • '+escV17(m.title)+'</span>'+
          '<h1 class="stepTitle">'+escV17(m.title)+'</h1>'+
          '<p class="saSingleIntro">Seluruh isi materi ditampilkan dalam satu halaman. Baca dari atas sampai selesai.</p>'+
          '<div class="saSingleSections">'+sections+'</div>'+ 
          '<div id="saSingleBottom" class="saSingleComplete">'+(completed?'✅ Materi ini sudah selesai dibaca.':'Selesaikan membaca sampai bagian paling bawah untuk menandai materi selesai.')+'</div>'+
        '</div>'+ 
        '<div class="materialNavigationCard saSingleBottomNav"><button class="btn nextSlideProfessional" type="button" onclick="returnToMenu()"><span>← Kembali ke Daftar Materi</span><span class="nextSlideIcon">↩</span></button></div>'+ 
      '</div>'+nav()+
    '</div>';

    // Mark the material complete only after the learner reaches the bottom.
    const bottom=document.getElementById('saSingleBottom');
    if(bottom && !completed){
      const io=new IntersectionObserver(entries=>{
        if(entries.some(e=>e.isIntersecting)){
          try{
            const pp=progress();
            pp.read=pp.read||{};
            pp.read[m.id]=pp.read[m.id]||{};
            pp.read[m.id].slide=Math.max(0,slides.length-1);
            pp.read[m.id].completed=true;
            saveProgress(pp);
            const bar=document.getElementById('saSingleProgressBar');
            if(bar)bar.style.width='100%';
            bottom.textContent='✅ Materi ini sudah selesai dibaca.';
            io.disconnect();
          }catch(e){console.warn('[SA SINGLE MATERIAL]',e);}
        }
      },{threshold:0.25});
      io.observe(bottom);
    }
  };

  // Re-render immediately if the app is already on a lesson when this patch loads.
  try{ if(window.state?.screen==='lesson' && window.state?.module) window.renderLesson(); }catch(e){}
})();
</script>

    ]
  };

  function renderTextV18(text){
    let lines=String(text||'').replace(/\r/g,'').split('\n');
    let out=[],table=[];
    const flush=()=>{
      if(!table.length)return;
      const rows=table.map(r=>r.split('|').map(x=>x.trim()));
      const head=rows.shift();
      if(head && head.length>1){
        out.push('<div class="materialTableWrap"><table class="materialTable"><thead><tr>'+head.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');
      }else if(head){ out.push('<div class="materialParagraph">'+esc(head.join(' | '))+'</div>'); }
      table=[];
    };
    lines.forEach(raw=>{
      const line=raw.trim();
      if(!line){flush();return;}
      if(/^\[\[SA_IMAGE\|/.test(line)){flush();const m=line.match(/^\[\[SA_IMAGE\|([^\]]+)\]\]$/);if(m&&/^data:image\//i.test(m[1]))out.push('<div class="materialImage"><img src="'+esc(m[1])+'" alt="Gambar materi"></div>');return;}
      if(line.includes('|')){table.push(line);return;}
      flush();
      if(/^#{2,3}\s+/.test(line)) out.push('<div class="materialSubhead">'+esc(line.replace(/^#{2,3}\s+/,''))+'</div>');
      else if(/^[-•]\s*/.test(line)) out.push('<div class="materialBullet"><span>•</span><div>'+esc(line.replace(/^[-•]\s*/,''))+'</div></div>');
      else if(/^[A-Z][A-Z\s&/().-]+$/.test(line) && line.length>3) out.push('<div class="materialSubhead">'+esc(line)+'</div>');
      else out.push('<div class="materialParagraph">'+esc(line)+'</div>');
    });
    flush();
    return out.join('');
  }

  window.renderLesson=function(){
    const m=state.module,p=progress();
    if(!m){goHome();return;}
    const slides=Array.isArray(m.slides)?m.slides:[];
    const titles=titleMap[String(m.id)]||[];
    const saved=Number(p.read?.[m.id]?.slide||0);
    const pct=Math.round(((Math.min(saved,Math.max(0,slides.length-1))+1)/Math.max(1,slides.length))*100);
    const sections=slides.map((s,i)=>{
      const title=titles[i]||String(s?.[0]||'Materi');
      return '<section class="v18MaterialSection" id="material-section-'+i+'">'+
        '<div class="v18SectionNumber">'+String(i+1).padStart(2,'0')+'</div>'+
        '<h2>'+esc(title)+'</h2>'+
        '<div class="v18SectionBody">'+renderTextV18(s?.[1]||'')+'</div>'+
      '</section>';
    }).join('');
    const lastIndex=Math.max(0,slides.length-1);
    root.innerHTML='<div class="v18OnePageLesson">'+
      '<header class="v18LessonHeader">'+
        '<div class="v18TopRow"><button class="v18Back" type="button" onclick="returnToMenu()">← Back</button><div class="v18HeaderTitle">'+esc(m.title)+'</div><button class="v18Home" type="button" onclick="goHome()">Home</button></div>'+
        '<div class="v18Meta"><span>Materi Pembelajaran</span><strong>'+pct+'%</strong></div>'+
        '<div class="v18Progress"><i style="width:'+pct+'%"></i></div>'+
      '</header>'+
      '<main class="v18MaterialWrap">'+
        '<div class="v18Intro"><span>MATERI PEMBELAJARAN</span><h1>'+esc(m.title)+'</h1><p>'+esc(m.desc||'Pelajari seluruh materi berikut secara berurutan.')+'</p></div>'+
        sections+
        '<div class="v18FinishCard"><div><strong>Sudah selesai membaca?</strong><p>Pastikan seluruh bagian materi sudah dipahami sebelum mengerjakan kuis.</p></div><button type="button" onclick="window.saFinishMaterialV18()">✓ Tandai Materi Selesai</button></div>'+ 
      '</main>'+nav()+
    '</div>';
    const wrap=document.querySelector('.v18MaterialWrap');
    if(wrap){
      let done=false;
      const check=()=>{
        if(done)return;
        const nearBottom=window.scrollY+window.innerHeight>=document.documentElement.scrollHeight-80;
        if(nearBottom){ done=true; state.slide=lastIndex; markRead(); const bar=document.querySelector('.v18Progress i');if(bar)bar.style.width='100%';const meta=document.querySelector('.v18Meta strong');if(meta)meta.textContent='100%'; }
      };
      window.addEventListener('scroll',check,{passive:true});
      setTimeout(check,250);
    }
  };

  window.saFinishMaterialV18=function(){
    if(!state.module)return;
    state.slide=Math.max(0,(state.module.slides||[]).length-1);
    markRead();
    const qs=quizFor(state.module.id);
    if(qs.length){startQuiz(false);return;}
    render();
  };

  const style=document.createElement('style');
  style.id='sa-material-one-page-v18-css';
  style.textContent=`
  .v18OnePageLesson{min-height:100vh;background:#f5f7fb;color:#172033;padding-bottom:90px}

  .v18MaterialWrap{max-width:760px;margin:0 auto;padding:24px 18px}.v18Intro{background:#fff;border-radius:26px;padding:24px;margin-bottom:18px;box-shadow:0 8px 28px rgba(20,35,60,.07)}.v18Intro span{font-size:12px;font-weight:900;letter-spacing:1.5px;color:#d21f45}.v18Intro h1{font-size:30px;line-height:1.12;margin:8px 0}.v18Intro p{margin:0;color:#737d8d;line-height:1.55}
  .v18MaterialSection{position:relative;background:#fff;border:1px solid #e7ebf1;border-radius:24px;padding:24px 20px 26px;margin:16px 0;box-shadow:0 7px 24px rgba(20,35,60,.055)}.v18SectionNumber{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:11px;background:#edf3ff;color:#2d63bd;font-weight:900;font-size:12px}.v18MaterialSection h2{font-size:23px;line-height:1.2;margin:13px 0 18px;color:#172033}.v18SectionBody{font-size:16px;line-height:1.65;color:#3d4758}.v18SectionBody .materialParagraph{margin:0 0 11px}.v18SectionBody .materialBullet{display:flex;gap:9px;margin:7px 0}.v18SectionBody .materialBullet span{color:#d21f45;font-weight:900}.v18SectionBody .materialSubhead{font-weight:900;color:#274f87;margin:18px 0 8px}.v18FinishCard{display:flex;gap:16px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#fff,#f7f9ff);border:1px solid #e2e7ef;border-radius:24px;padding:20px;margin-top:18px}.v18FinishCard strong{font-size:17px}.v18FinishCard p{margin:5px 0 0;color:#7b8492;font-size:13px;line-height:1.45}.v18FinishCard button{flex:none;border:0;border-radius:14px;padding:13px 16px;background:linear-gradient(135deg,#2367db,#5a45e8);color:#fff;font-weight:900}.materialTableWrap{overflow:auto;margin:12px 0}.materialTable{width:100%;border-collapse:collapse;font-size:13px}.materialTable th,.materialTable td{border:1px solid #e2e7ef;padding:9px;text-align:left}.materialTable th{background:#f3f6fb}.materialImage img{max-width:100%;border-radius:16px}.v18OnePageLesson .bottomNav{position:fixed}
  @media(max-width:520px){.v18HeaderTitle{font-size:17px}.v18MaterialWrap{padding:18px 14px}.v18Intro h1{font-size:26px}.v18MaterialSection{padding:20px 17px}.v18MaterialSection h2{font-size:21px}.v18FinishCard{display:block}.v18FinishCard button{width:100%;margin-top:14px}}
  `;
  document.head.appendChild(style);
})();
</script>
