   ========================= */
@keyframes saTap{
  0%{transform:scale(1)}
  45%{transform:scale(.96)}
  100%{transform:scale(1)}
}
@keyframes saPageIn{
  0%{opacity:0;transform:translateY(10px) scale(.99)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes saSlideIn{
  0%{opacity:0;transform:translateX(18px)}
  100%{opacity:1;transform:translateX(0)}
}
@keyframes saPulse{
  0%{box-shadow:0 0 0 0 rgba(255,49,88,.28)}
  100%{box-shadow:0 0 0 10px rgba(255,49,88,0)}
}
@keyframes saCheck{
  0%{transform:scale(.75);opacity:.4}
  60%{transform:scale(1.12);opacity:1}
  100%{transform:scale(1)}
}

.sa-tap-motion{animation:saTap .22s ease}

function openSalesRules(){
  setReturnContext("tools");

function getFilteredSalesRules(){
  const q=salesRulesQuery.trim().toLowerCase();
  return SALES_RULES_DATA.filter(x=>{
    const groupOk=salesRulesGroup==="Semua"||x.group===salesRulesGroup;
    const hay=[x.no,x.group,x.rule,...(x.sanctions||[]),...(x.refs||[]),...(x.teams||[])].join(" ").toLowerCase();
    return groupOk && (!q||hay.includes(q));
  });
}
function renderSalesRulesCards(filtered){
  const cards=filtered.map(x=>{
    const sanctions=(x.sanctions||[]).map(s=>`<span class="srChip srSanction">${escRuleText(s)}</span>`).join("");
    const refs=(x.refs||[]).map(s=>`<span class="srChip srRef">${escRuleText(s)}</span>`).join("");
    const teams=(x.teams||[]).map(s=>`<span class="srChip srTeam">${escRuleText(s)}</span>`).join("");
    return `<article class="srCard">
      <div class="srCardTop"><span class="srNo">RULE ${escRuleText(x.no)}</span><span class="srGroup">${escRuleText(x.group||"Umum")}</span></div>
      <div class="srRule">${escRuleText(x.rule).replace(/\\n/g,"<br>")}</div>
      <div class="srMeta">${teams}${sanctions}${refs}</div>
    </article>`;
  }).join("");
  return cards||`<div class="srEmpty">Tidak ada aturan yang cocok dengan pencarianmu.</div>`;
}
function updateSalesRulesResults(){
  const filtered=getFilteredSalesRules();
  const bar=document.querySelector(".srResultBar");
  const list=document.querySelector(".srList");
  if(bar) bar.innerHTML=`<strong>${filtered.length}</strong> aturan ditemukan <span>• Sumber: ID (Ver 3) 2026</span>`;
  if(list) list.innerHTML=renderSalesRulesCards(filtered);
}
function salesRulesSearch(v){
  salesRulesQuery=String(v||"");
  updateSalesRulesResults();
}

window.salesRulesSearch=salesRulesSearch;

function salesRulesFilter(group){
  salesRulesGroup=group||"Semua";
  renderSalesRules();
}
window.salesRulesFilter=salesRulesFilter;

function renderSalesRules(){
  const groups=["Semua",...Array.from(new Set(SALES_RULES_DATA.map(x=>x.group).filter(Boolean)))];
  const q=salesRulesQuery.trim().toLowerCase();
  const filtered=SALES_RULES_DATA.filter(x=>{
    const groupOk=salesRulesGroup==="Semua"||x.group===salesRulesGroup;
    const hay=[x.no,x.group,x.rule,...(x.sanctions||[]),...(x.refs||[])].join(" ").toLowerCase();
    return groupOk && (!q||hay.includes(q));
  });
  const cards=filtered.map(x=>{
    const sanctions=(x.sanctions||[]).map(s=>`<span class="srChip srSanction">${escRuleText(s)}</span>`).join("");
    const refs=(x.refs||[]).map(s=>`<span class="srChip srRef">${escRuleText(s)}</span>`).join("");
    const teams=(x.teams||[]).map(s=>`<span class="srChip srTeam">${escRuleText(s)}</span>`).join("");
    return `<article class="srCard">
      <div class="srCardTop"><span class="srNo">RULE ${escRuleText(x.no)}</span><span class="srGroup">${escRuleText(x.group||"Umum")}</span></div>
      <div class="srRule">${escRuleText(x.rule).replace(/\\n/g,"<br>")}</div>
      <div class="srMeta">${teams}${sanctions}${refs}</div>
    </article>`;
  }).join("");
  const notesHtml=SALES_RULES_NOTES.map((n,i)=>`<div class="srNote"><span>${i+1}</span><div>${escRuleText(n)}</div></div>`).join("");
  root.innerHTML=`<div class="salesRulesPage">
    <div class="srHeader toolPageHeaderCompat">
      <div class="srHeaderMain"><div class="srEyebrow">TOOLS • SOP</div><h1>Sales Rules & SOP</h1><p>Sales Rules — Updated Feb 2026</p></div>
      <button type="button" class="srHome" onclick="goHome()">Home</button>
    </div>
    <div class="srWrap">
      <div class="srNotice">🔎 <b>Cari aturan dengan cepat.</b> Ketik kata seperti <b>terminate</b>, <b>absensi</b>, <b>manipulasi</b>, <b>misselling</b>, atau nama grup.</div>
      <div class="srSearch"><span>⌕</span><input id="salesRulesSearch" value="${escRuleText(salesRulesQuery)}" placeholder="Cari Sales Rules & SOP..." oninput="salesRulesSearch(this.value)"></div>
      <div class="srFilters">${groups.map(g=>`<button class="srFilter ${salesRulesGroup===g?"active":""}" onclick="salesRulesFilter('${escRuleText(g).replace(/'/g,"\\'")}')">${escRuleText(g)}</button>`).join("")}</div>
      <div class="srResultBar"><strong>${filtered.length}</strong> aturan ditemukan <span>• Sumber: ID (Ver 3) 2026</span></div>
      <div class="srList">${cards||`<div class="srEmpty">Tidak ada aturan yang cocok dengan pencarianmu.</div>`}</div>
      <section class="srNotes"><div class="srNotesTitle">Catatan SOP dari file</div>${notesHtml}</section>
      ${toolCompletionFooter("sales-rules")}
    </div>
  </div>${nav()}`;
}

   Konten asli tidak dihapus; setiap slide lama dimasukkan sebagai subbagian.
*/
(function applyStepByStepCurriculum(){
  const excluded=new Set(["sa-activities","m3plus","kalkulator-insentif","sales-rules"]);
  const groups={
    "gadget":[[0,1],[2,3],[4,5]],
    "akujaga":[[0,1],[2,3],[4,5]],
    "akusiaga":[[0,1],[2,3],[4,5]],
    "home-service":[[0,1],[2,3],[4]],
    "repayment-reminder":[[0,1],[2,3],[4]],
    "skema-benefit":[[0,1],[2,3,4],[5,6]],
    "akutipper":[[0,1],[2,3],[4]],
    "asuransi-kecelakaan":[[0],[1],[2]],
    "cara-menjual-cicilan":[[0,1],[2,3],[4,5]]
  };
  const phaseTitles=[
    "1. Pelajari — Dasar & Manfaat",
    "2. Pahami — Ketentuan & Proses",
    "3. Contoh & Penerapan — Yang Perlu Dilakukan SA"
  ];
  function buildPhase(m, indexes, phase){
    const parts=[];
    indexes.forEach(i=>{
      const s=m.slides[i];
      if(!s)return;
      parts.push(`## ${s[0]}\n${String(s[1]||"").trim()}`);
    });
    return [phaseTitles[phase],parts.join("\n\n")];
  }
  DB.modules.forEach(m=>{
    if(excluded.has(m.id) || m.__stepByStep)return;
    const g=groups[m.id];
    if(!g)return;
    const original=m.slides.slice();
    m.slides=g.map((idxs,phase)=>{
      const valid=idxs.filter(i=>i<original.length);
      const temp={slides:original};
      return buildPhase(temp,valid,phase);
    });
    m.__stepByStep=true;
  });
})();

async function hydrateCloudSnapshot(id){
  try{
    if(!id||!window.SA_SUPABASE?.isConfigured?.()||!window.SA_SUPABASE?.request)return false;
    const rows=await window.SA_SUPABASE.request('/rest/v1/chat_messages?select=id,pesan,created_at&id_sa=eq.'+encodeURIComponent(String(id))+'&pesan=like.'+encodeURIComponent('__SA_ACTIVITY_SYNC_V2__%')+'&order=created_at.desc&limit=100',{method:'GET'});
    const prefix='__SA_ACTIVITY_SYNC_V2__';
    const candidates=(Array.isArray(rows)?rows:[]).filter(r=>String(r.pesan||'').startsWith(prefix));
    if(!candidates.length)return false;
    let row=null,rowTs=0;
    for(const r of candidates){try{const x=JSON.parse(String(r.pesan).slice(prefix.length));const ts=Number(x?.updatedAt?new Date(x.updatedAt).getTime():new Date(r.created_at||0).getTime());if(!row||ts>=rowTs){row=r;rowTs=ts}}catch(e){}}
    if(!row)return false;
    const cloud=JSON.parse(String(row.pesan).slice(prefix.length));
    const local=loadProgress();
    const localTs=Number(local.__cloudUpdatedAt||local.__updatedAt||0);
    const cloudTs=Number(cloud.updatedAt?new Date(cloud.updatedAt).getTime():0);
    // Cloud is authoritative when it is at least as new as the local cache.
    // If the local cache is newer (offline work), keep it and immediately queue a cloud push.
    if(cloudTs && localTs>cloudTs){
      setTimeout(()=>window.syncSAActivityToCloud?.(true),0);
      return false;
    }
    const remote={
      read:Object.assign({},local.read||{},cloud.readMap||{}),
      passed:Object.assign({},local.passed||{},cloud.passedMap||{}),
      scores:Object.assign({},local.scores||{},cloud.scores||{}),
      history:Object.assign({},local.history||{},cloud.quizHistory||{}),
      quizSessions:Object.assign({},local.quizSessions||{},cloud.quizSessions||{}),
      __cloudUpdatedAt:cloudTs||Date.now(),
      __updatedAt:cloudTs||Date.now()
    };
    if(cloud.monthlyRecap&&typeof cloud.monthlyRecap==='object'){
      let mr={};try{mr=JSON.parse(localStorage.getItem('sa_dm1_monthly_recap_v1')||'{}')||{}}catch(e){}
      const localMR=mr[String(id)]&&typeof mr[String(id)]==='object'?mr[String(id)]:{};
      const mergedMR=Object.assign({},localMR,cloud.monthlyRecap||{});
      Object.keys(cloud.monthlyRecap||{}).forEach(m=>{mergedMR[m]=Object.assign({},localMR[m]||{},cloud.monthlyRecap[m]||{});});
      mr[String(id)]=mergedMR;try{localStorage.setItem('sa_dm1_monthly_recap_v1',JSON.stringify(mr))}catch(e){}
    }
    if(cloud.runrate&&typeof cloud.runrate==='object'){
      let rr={};try{rr=JSON.parse(localStorage.getItem('dailyGMVTargetData')||'{}')||{}}catch(e){}
      const localRR=rr[String(id)]&&typeof rr[String(id)]==='object'?rr[String(id)]:{}; const merged={};
      const dates=new Set([...Object.keys(localRR),...Object.keys(cloud.runrate)]);
      dates.forEach(d=>{const a=localRR[d],b=cloud.runrate[d];if(!a)merged[d]=b;else if(!b)merged[d]=a;else{const at=Number(a.updatedAt?new Date(a.updatedAt).getTime():0),bt=Number(b.updatedAt?new Date(b.updatedAt).getTime():0);merged[d]=bt>=at?b:a;}});
      rr[String(id)]=merged; localStorage.setItem('dailyGMVTargetData',JSON.stringify(rr));
    }
    localStorage.setItem(key(),JSON.stringify(remote));
    return true;
  }catch(e){console.warn('[SA CLOUD HYDRATE]',e);return false}
}

function syncQuizToAdmin(){
  try{
    if(!state.user||!state.user.id) return;
    const p=loadProgress();
    const scores=p.scores||{}, passed=p.passed||{}, history=p.history||{};
    const results={};
    Object.keys(scores).forEach(k=>{results[k]={score:Number(scores[k])||0,passed:!!passed[k]};});
    const quizCount=Object.keys(results).length;
    const vals=Object.values(scores).map(Number).filter(v=>v>0);
    const avg=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0;
    let activity={};
    try{activity=JSON.parse(localStorage.getItem("sa_login_activity_v2")||"{}")||{};}catch(e){}
    const existing=activity[state.user.id]||{};
    activity[state.user.id]=Object.assign({},existing,{
      id:String(state.user.id),
      name:state.user.name||existing.name||String(state.user.id),
      lastLogin:existing.lastLogin||new Date().toISOString(),
      progress:completedCount?Math.round((completedCount()/DB.modules.length)*100):0,
      score:avg,
      quizCount:quizCount,
      quizResults:results,
      completedModules:Object.keys(passed).filter(k=>passed[k]),
      quizHistory:history,
      scores:Object.fromEntries(Object.keys(scores).map(k=>[k,Number(scores[k])||0])),
      passedMap:Object.fromEntries(Object.keys(passed).map(k=>[k,!!passed[k]])),
      runrate:(()=>{try{const rr=JSON.parse(localStorage.getItem("dailyGMVTargetData")||"{}")||{};return rr[String(state.user.id)]||{}}catch(e){return {}}})(),
      active:true
    });
    localStorage.setItem("sa_login_activity_v2",JSON.stringify(activity));
  }catch(e){}
}
function saveProgress(p){
  try{
    const existing=loadProgress();
    p=p&&typeof p==='object'?p:{};
    p.read=Object.assign({},existing.read||{},p.read||{});
    p.passed=Object.assign({},existing.passed||{},p.passed||{});
    p.scores=Object.assign({},existing.scores||{},p.scores||{});
    const eh=existing.history||{}, nh=p.history||{}, mergedH=Object.assign({},eh);
    Object.keys(nh).forEach(k=>{
      const a=Array.isArray(eh[k])?eh[k]:[], b=Array.isArray(nh[k])?nh[k]:[];
      const seen=new Set(a.map(v=>JSON.stringify(v))); mergedH[k]=a.concat(b.filter(v=>{const z=JSON.stringify(v);if(seen.has(z))return false;seen.add(z);return true;}));
    });
    p.history=mergedH;
    p.__updatedAt=Math.max(Number(existing.__updatedAt)||0,Date.now());
    p.__cloudUpdatedAt=p.__updatedAt;
  }catch(e){}
  localStorage.setItem(key(),JSON.stringify(p));
  syncQuizToAdmin();
  setTimeout(()=>window.syncSAActivityToCloud?.(true),0);
}

function showSavedQuizResult(id){
  const m=DB.modules.find(x=>x.id===id);
  const p=progress();
  if(!m)return;
  const history=(p.history&&p.history[id])||[];
  const last=history.length?history[history.length-1]:null;
  if(!last){alert("Kuis materi ini belum dikerjakan.");return;}
  state.module=m;
  state.lastScore=Number(last.score||0);
  state.currentAnswers=Array.isArray(last.answers)?last.answers:[];
  state.currentCorrect=Number(last.correct||0);
  state.currentWrong=Number(last.wrong||0);
  state.currentIsRemedial=!!last.isRemedial;
  state.screen="results";
  render();
}
function showQuizDetail(){
  if(typeof window.requireRunrateBeforeStudy==="function" && window.requireRunrateBeforeStudy()) return;
  const p=progress();
  const mods=DB.modules.filter(m=>quizFor(m.id).length);
  const rows=mods.map(m=>{
    const score=Number((p.scores||{})[m.id]||0);
    const wrong=(p.wrong||{})[m.id]||[];
    const done=!!((p.passed||{})[m.id]);
    const h=(p.history&&p.history[m.id])||[];
    const attempted=h.length>0 || done || score>0;
    let status=done?`<span class="phStatus done">🟢 Lulus</span>`:attempted?`<span class="phStatus warn">🔴 Perlu ditingkatkan</span>`:`<span class="phStatus todo">⚪ Belum dikerjakan</span>`;
    const scoreText=attempted?`Nilai ${score}/100 • ${wrong.length} soal kurang tepat`:"Belum mengerjakan kuis";
    return `<div class="quizDetailCard">
      <div class="quizDetailHead"><div class="quizDetailTitle">${esc(m.title)}</div>${status}</div>
      <div class="quizDetailMeta">${scoreText}</div>
      ${attempted?`<button type="button" class="quizAction" onclick="showSavedQuizResult('${m.id}')">Lihat Kuis</button>`:""}
      <button type="button" class="quizAction alt" onclick="openModule('${m.id}',false)">Pelajari Lagi</button>
    </div>`;
  }).join("");
  const scored=mods.map(m=>Number((p.scores||{})[m.id]||0)).filter(v=>v>0);
  const avg=scored.length?Math.round(scored.reduce((a,b)=>a+b,0)/scored.length):0;
  const weak=mods.filter(m=>Number((p.scores||{})[m.id]||0)>0 && Number((p.scores||{})[m.id]||0)<80);
  root.innerHTML=`<div style="min-height:100vh;background:#f5f7fb;padding:24px;box-sizing:border-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:8px">
      <button type="button" onclick="goHome()" style="border:0;border-radius:12px;padding:10px 14px;background:#fff">← Kembali</button>
      <b style="font-size:20px">Nilai Pemahaman</b>
      <button type="button" onclick="goHome()" style="border:0;border-radius:12px;padding:10px 14px;background:#fff">Home</button>
    </div>
    <div class="phContinue" style="margin-top:0">
      <div class="phContinueLabel">RINGKASAN PEMAHAMAN</div>
      <div class="phContinueTitle">${avg}% Rata-rata nilai kuis</div>
      <div class="small">${weak.length?`⚠️ ${weak.length} materi perlu dipelajari ulang.`:"✅ Belum ada materi yang perlu ditingkatkan."}</div>
    </div>
    ${rows || '<div style="background:#fff;padding:18px;border-radius:14px">Belum ada kuis.</div>'}
  </div>`;
}

function getWelcomeGreeting(){
  const h=Number(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Jakarta',hour:'numeric',hour12:false}).format(new Date()));
  if(h>=5&&h<11)return 'Good Morning,';
  if(h>=11&&h<15)return 'Good Afternoon,';

  return 'Good Night,';
}

function currentScrollY(){
  try{return Math.max(0,Number(window.scrollY||window.pageYOffset||document.documentElement.scrollTop||document.body.scrollTop||0));}catch(e){return 0;}
}
function scrollPageTop(){
  const topNow=()=>{
    try{
      window.scrollTo(0,0);
      document.documentElement.scrollTop=0;
      document.body.scrollTop=0;
    }catch(e){}
    // Reset every possible internal scroll container too.
    try{
      document.querySelectorAll("*").forEach(el=>{
        if(el.scrollTop>0) el.scrollTop=0;
        if(el.scrollLeft>0) el.scrollLeft=0;
      });
    }catch(e){}
    try{
      const app=document.getElementById("app")||document.getElementById("root");
      if(app){app.scrollTop=0;app.scrollLeft=0;app.scrollTo(0,0);}
    }catch(e){}
  };
  topNow();
  requestAnimationFrame(topNow);
  setTimeout(topNow,0);
  setTimeout(topNow,50);
  setTimeout(topNow,150);
  setTimeout(topNow,300);
}
function scrollPageTo(y){
  const target=Math.max(0,Number(y)||0);
  const go=()=>{
    try{window.scrollTo({top:target,left:0,behavior:"auto"});}catch(e){}
    try{document.documentElement.scrollTop=target;}catch(e){}
    try{document.body.scrollTop=target;}catch(e){}
    try{const app=document.getElementById("app")||document.getElementById("root");if(app&&app.scrollHeight>app.clientHeight)app.scrollTop=target;}catch(e){}
  };
  go();requestAnimationFrame(go);setTimeout(go,30);setTimeout(go,120);
}

function shuffle(arr){
  let a=[...arr];
  for(let i=a.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

<script>
(function(){
  "use strict";
  const STORE="sa_login_activity_v2";
  function saveLogin(id,name){
    id=String(id||"").trim(); name=String(name||"").trim();
    if(!id || id==="ADMIN110597") return;
    try{
      const x=JSON.parse(localStorage.getItem(STORE)||"{}");
      x[id]={id:id,name:name||id,lastLogin:new Date().toISOString(),active:true};
      localStorage.setItem(STORE,JSON.stringify(x));
    }catch(e){}
  }
  function getText(el){
    return el ? String(el.value||el.textContent||"").trim() : "";
  }
  function tryRecord(){
    // Common login input selectors in this app.
    const inputs=[...document.querySelectorAll("input")];
    const vals=inputs.map(x=>getText(x)).filter(Boolean);
    const idEl=inputs.find(x=>/id|employee|nik|user/i.test((x.placeholder||"")+" "+(x.name||"")+" "+(x.id||"")));
    const id=getText(idEl) || vals.find(v=>/^\d{3,}$/.test(v));
    const nameEl=inputs.find(x=>/nama|name/i.test((x.placeholder||"")+" "+(x.name||"")+" "+(x.id||"")));
    const name=getText(nameEl);
    if(id && /^\d{3,}$/.test(id)) saveLogin(id,name);
  }
  // Record immediately when login button is clicked; then retry after app state changes.
  document.addEventListener("click",function(e){
    const b=e.target.closest("button,[role=button]");
    if(!b) return;
    const txt=(b.textContent||"").trim().toLowerCase();
    if(/login|masuk/.test(txt)){
      setTimeout(tryRecord,80);
      setTimeout(tryRecord,500);
      setTimeout(tryRecord,1200);
    }
  },true);

  // If the app stores current user in common globals, record it whenever available.
  setInterval(function(){
    try{
      const candidates=[
        window.currentUser,window.loggedInUser,window.currentUserId,
        window.loggedInUserId,window.userId
      ];
      for(const c of candidates){
        if(typeof c==="object" && c){
          const id=c.id||c.userId||c.employeeId||c.nik;
          const name=c.name||c.userName||c.nama;
          if(id) { saveLogin(id,name); break; }
        } else if(typeof c==="string" && /^\d{3,}$/.test(c)){
          saveLogin(c,window.currentUserName||window.userName||"");
          break;
        }
      }
    }catch(e){}
  },1000);

  window.recordSALogin=saveLogin;
})();
</script>
<script id="savedSALoginLogic">
(function(){
  const KEY="sa_saved_login_v2";

  function readSaved(){
    try{
      const v=JSON.parse(localStorage.getItem(KEY)||"null");
      return v && v.id ? v : null;
    }catch(e){ return null; }
  }

  function writeSaved(id,name){
    try{
      localStorage.setItem(KEY,JSON.stringify({
        id:String(id),
        name:String(name||""),
        savedAt:new Date().toISOString()
      }));
    }catch(e){}
  }

  function clearSaved(){
    try{localStorage.removeItem(KEY);}catch(e){}
  }

  function fillLogin(){
    const saved=readSaved();
    const uid=document.getElementById("uid");
    const pw=document.getElementById("pw");
    const cb=document.getElementById("saveSALogin");
    if(!uid || !pw || !cb) return false;

    if(saved){
      // Only fill if the fields are empty, so manual account switching remains possible.
      if(!uid.value) uid.value=saved.name || "";
      if(!pw.value) pw.value=saved.id || "";
      cb.checked=true;
    }
    return true;
  }

  window.clearSavedSALogin=function(){
    clearSaved();
    const cb=document.getElementById("saveSALogin");
    if(cb) cb.checked=false;
  };

  function bind(){
    const cb=document.getElementById("saveSALogin");
    if(!cb || cb.dataset.bound==="1") return;
    cb.dataset.bound="1";
    cb.addEventListener("change",function(){
      if(!this.checked) clearSaved();
    });
    fillLogin();
  }

  // The login screen is generated dynamically, so observe the DOM.
  const observer=new MutationObserver(function(){
    bind();
    fillLogin();
  });
  observer.observe(document.documentElement,{childList:true,subtree:true});

  document.addEventListener("DOMContentLoaded",function(){
    bind();
    fillLogin();
    setTimeout(fillLogin,200);
    setTimeout(fillLogin,800);
  });

  // Expose a reliable helper used by the actual login function.
  window.saveSALoginChoice=function(){
    const uid=document.getElementById("uid");
    const pw=document.getElementById("pw");
    const cb=document.getElementById("saveSALogin");
    if(cb && cb.checked && uid && pw && pw.value.trim()){
      writeSaved(pw.value.trim(),uid.value.trim());
    }else if(cb && !cb.checked){
      clearSaved();
    }
  };
})();
</script>

<script id="runratePencapaianLogic">

      if(!u)return null;
      const db=JSON.parse(localStorage.getItem("dailyGMVTargetData")||"{}")||{};
      const bySA=db[String(u.id)]||{};

      return bySA[dkey]||null;
    }catch(e){return null}

  function calc(){

    const day=dt.getDate(), days=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();
    const ach=target?acv/target*100:0;

 const d=calc(),el=document.getElementById("runratePencapaianCard");if(!el)return;

 if(el.innerHTML!==html) el.innerHTML=html;

<script id="dashboard-notification-v2-auto-admin">

  const STORE='sa_notification_admin_session_v1';
  let adminToken='', refreshToken='';

  function readSession(){
    try{
      const x=JSON.parse(localStorage.getItem(STORE)||'null');
      if(x&&x.access_token){adminToken=x.access_token;refreshToken=x.refresh_token||'';return true;}
    }catch(e){}
    return false;
  }
  function saveSession(d){
    adminToken=d?.access_token||'';
    refreshToken=d?.refresh_token||'';
    if(adminToken){
      try{localStorage.setItem(STORE,JSON.stringify({
        access_token:adminToken,
        refresh_token:refreshToken,
        saved_at:Date.now()
      }));}catch(e){}
    }
  }
  function clearSession(){
    adminToken='';refreshToken='';
    try{localStorage.removeItem(STORE);}catch(e){}
    updateButton();
  }
  async function refreshSession(){
    if(!refreshToken)return false;
    try{
      const c=window.SA_SUPABASE?.readConfig?window.SA_SUPABASE.readConfig():null;
      if(!c)return false;
      const r=await fetch(c.url+'/auth/v1/token?grant_type=refresh_token',{
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':c.anonKey},
        body:JSON.stringify({refresh_token:refreshToken})
      });
      const d=await r.json();
      if(!r.ok||!d.access_token)throw new Error('Session Admin kedaluwarsa.');
      saveSession(d); return true;
    }catch(e){clearSession();return false;}
  }
  async function ensureAdmin(){
    if(adminToken)return true;
    readSession();
    if(adminToken)return true;
    const ok=await refreshSession();
    if(ok)return true;
    return await this.connectAdmin();
  }
  function updateButton(){
    const b=document.getElementById('adminNotifConnectBtn');
    if(!b)return;

      try{
        const d=await window.SA_SUPABASE.adminAuth(email,password);

    async save(id){

      const msg=(ta?.value||'').trim(); if(!msg){alert('Teks notifikasi wajib diisi.');return;}
      if(!await ensureAdmin.call(this))return;
      try{
        if(id)await window.SA_SUPABASE.updateNotification(id,msg,!!active?.checked,adminToken);

          try{
            if(id)await window.SA_SUPABASE.updateNotification(id,msg,!!active?.checked,adminToken);
            else await window.SA_SUPABASE.createNotification(msg,!!active?.checked,adminToken);
            if(ta)ta.value='';if(active)active.checked=true;document.getElementById('adminNotifEditId').value='';
            document.getElementById('adminNotifStatus').textContent='✅ Notifikasi berhasil disimpan.';

        clearSession();alert(e.message||'Gagal menyimpan notifikasi.');

    async remove(id){
      if(!confirm('Hapus notifikasi ini?'))return;
      if(!await ensureAdmin.call(this))return;
      try{
        await window.SA_SUPABASE.deleteNotification(id,adminToken);
        await this.renderAdmin();await this.load();
      }catch(e){clearSession();alert(e.message||'Gagal menghapus notifikasi.');}
    },
    edit(id){
      const row=(window.__saNotifRows||[]).find(x=>String(x.id)===String(id));if(!row)return;
      document.getElementById('adminNotifEditId').value=row.id;

    async renderAdmin(){

  function injectAdmin(){

    const card=document.createElement('section');card.className='adminNotifCard';
    card.innerHTML=`<div class="adminNotifHead"><div><h3>🔔 Kelola Notifikasi Dashboard</h3><div class="adminNotifSub">Tulis informasi manual yang akan berjalan di bawah dashboard SA.</div></div><button id="adminNotifConnectBtn" type="button" class="adminNotifAction" onclick="SA_NOTIFICATION.connectAdmin()">Hubungkan Admin</button></div><div class="adminNotifForm"><div><textarea id="adminNotifMessage" placeholder="Tulis informasi notifikasi di sini..."></textarea><input id="adminNotifEditId" type="hidden"></div><label class="adminNotifToggle"><input id="adminNotifActive" type="checkbox" checked> Aktif</label><button type="button" class="adminNotifBtn" onclick="SA_NOTIFICATION.save(document.getElementById('adminNotifEditId').value)">Simpan</button></div><div id="adminNotifStatus" class="adminNotifStatus"></div><div id="adminNotifList" class="adminNotifList"></div>`;
    const detail=panel.querySelector('#adminDetail');panel.insertBefore(card,detail||null);
    readSession();updateButton();setTimeout(()=>SA_NOTIFICATION.renderAdmin(),0);
  }
  function injectHome(){
    if(document.getElementById('phNotification'))return;
    /* Support both the legacy dashboard structure and the current SA dashboard. */
    /* Notification must sit below the complete Welcome header,
       not inside the Welcome row beside the greeting. */
    const anchor=document.querySelector('.main > .top')
      || document.querySelector('.top')
      || document.getElementById('journeyPremium')
      || document.getElementById('runratePencapaianCard');
    if(!anchor)return;
    const n=document.createElement('section');
    n.id='phNotification';
    n.className='phNotification';
    n.setAttribute('aria-label','Informasi terbaru dari Admin');
    n.innerHTML='<div class="phNotificationIcon" aria-hidden="true">🔔</div><div class="phNotificationViewport"><div id="phNotificationTrack" class="phNotificationTrack">Memuat informasi terbaru...</div></div>';
    anchor.insertAdjacentElement('afterend',n);
    setTimeout(()=>SA_NOTIFICATION.load(),0);
  }
  const oldHome=window.renderHome;if(typeof oldHome==='function')window.renderHome=function(){const r=oldHome.apply(this,arguments);setTimeout(injectHome,20);return r;};
  const obs=new MutationObserver(()=>{injectAdmin();injectHome();});obs.observe(document.body,{childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded',()=>{injectAdmin();injectHome();});
})();
</script>
<script id="runratePencapaianFinalFix">

    try{return (typeof state!=="undefined"&&state.user)?state.user:null}catch(e){return null}
  }
  function rrToday(){
    const d=new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function rrRaw(v){return String(v||"").replace(/\./g,"").replace(/[^0-9]/g,"")}
  function rrFmt(v){
    const n=rrRaw(v);
    return n?n.replace(/\B(?=(\d{3})+(?!\d))/g,"."):"";
  }

<script id="responsiveAnimationGuardV1">
(function(){
  // Back/close tidak memaksa halaman kembali ke posisi paling atas.
  window.__SA_LAST_SCROLL_Y = 0;
  window.addEventListener("scroll",function(){
    window.__SA_LAST_SCROLL_Y = window.scrollY || window.pageYOffset || 0;
  },{passive:true});

  document.addEventListener("click",function(e){
    const el=e.target && e.target.closest ? e.target.closest("[data-no-scroll-jump],.jsBack,.backBtn,.stepBack,.materialBack") : null;
    if(!el)return;
    const y=window.__SA_LAST_SCROLL_Y||0;
    requestAnimationFrame(function(){
      try{window.scrollTo({top:y,left:0,behavior:"auto"})}catch(_){window.scrollTo(0,y)}
    });
  },true);

  // Pastikan input fokus tidak menyebabkan horizontal overflow.
  document.addEventListener("focusin",function(e){
    if(!e.target || !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
    setTimeout(function(){
      try{e.target.scrollIntoView({block:"nearest",inline:"nearest",behavior:"auto"})}catch(_){}
    },0);
  });
})();
</script>
<script id="authRefreshLogoutFixV108">
(function(){
  const KEY="sa_saved_login_v2";

  function readSaved(){
    try{
      const v=JSON.parse(localStorage.getItem(KEY)||"null");
      return v && v.id ? v : null;
    }catch(e){return null;}
  }

  function restoreSavedLogin(){
    try{
      if(typeof state==="undefined" || state.user) return false; return false;
      const saved=readSaved();
      if(!saved || typeof DB==="undefined" || !DB.users) return false;

      const id=String(saved.id).trim();
      const name=String(saved.name||DB.users[id]||"").trim();
      if(!id || !Object.prototype.hasOwnProperty.call(DB.users,id)) return false;

      state.user={id:id,name:String(DB.users[id]||name)};
      state.screen="home";
      state.module=null;
      state.slide=0;
      state.quizIndex=0;
      state.quizAnswers=[];
      state.quizScore=0;
      state.quizChoices=[];
      state.lastScore=0;
      state.currentAnswers=[];
      state.currentCorrect=0;
      state.currentWrong=0;
      state.currentIsRemedial=false;

      if(typeof syncQuizToAdmin==="function") syncQuizToAdmin();
      if(typeof render==="function") render();
      try{if(window.updateChatVisibility)window.updateChatVisibility();}catch(e){}
      return true;
    }catch(e){return false;}
  }

  // After refresh the login form may be rendered asynchronously.
  // Try several times, but only restore a previously saved account.
  function bootRestore(){
    if(restoreSavedLogin()) return;
    setTimeout(restoreSavedLogin,120);
    setTimeout(restoreSavedLogin,450);
    setTimeout(restoreSavedLogin,900);
  }

  // Do not let the old logout function silently exit.
  window.confirmSALogout=function(){
    const ok=window.confirm("Apakah kamu yakin ingin keluar dari SA Learning Center?");
    if(!ok) return false;
    try{
      if(typeof state!=="undefined"){
        state.user=null;
        state.screen="home";
        state.module=null;
        state.slide=0;
        state.quizIndex=0;
        state.quizAnswers=[];
        state.quizScore=0;
        state.quizChoices=[];
        state.lastScore=0;
        state.currentAnswers=[];
        state.currentCorrect=0;
        state.currentWrong=0;
        state.currentIsRemedial=false;
      }
      if(typeof render==="function") render();
      try{if(window.updateChatVisibility)window.updateChatVisibility();}catch(e){}
    }catch(e){}
    return false;
  };

  // Replace the app logout handler used by the dashboard button.
  window.logout=window.confirmSALogout;

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",bootRestore,{once:true});
  }else{
    bootRestore();
  }
})();
</script>

<script id="adminDashboardProfessionalLogicV1">
(function(){
  "use strict";
  const ADMIN_ID="ADMIN110597", ADMIN_NAME="Admin", ACT_PREFIX="__SA_ACTIVITY_SYNC_V2__";
  const $=id=>document.getElementById(id);
  const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
  const money=n=>"Rp"+Math.round(Number(n)||0).toLocaleString("id-ID");
  const pct=n=>Number(n||0).toLocaleString("id-ID",{maximumFractionDigits:2})+"%";
  function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
  function logsLocal(){try{return JSON.parse(localStorage.getItem("sa_login_activity_v2")||"{}")||{}}catch(e){return {}}}
  function localRunrate(id){try{const x=JSON.parse(localStorage.getItem("dailyGMVTargetData")||"{}")||{};return x[String(id)]||{}}catch(e){return {}}}
  function cloudReq(){return window.SA_SUPABASE?.request}
  let cloudRows=[], cloudActivities={}, selectedFilter="all", lastCloudAt=0, refreshTimer=null, loading=false;

  function localFallbackActivity(){
    const l=logsLocal(), out={};
    Object.keys(l).forEach(id=>{const x=l[id];if(x&&x.id)out[String(id)]=x;});
    return out;
  }
  async function fetchCloudActivities(){
    if(!cloudReq()||!window.SA_SUPABASE.isConfigured?.()) return localFallbackActivity();
    try{
      const rows=await cloudReq()('/rest/v1/chat_messages?select=id,id_sa,nama,pesan,created_at&pesan=like.'+encodeURIComponent(PREFIX+'%')+'&order=created_at.desc&limit=5000',{method:'GET'});
      const out={};
      (Array.isArray(rows)?rows:[]).forEach(r=>{
        const msg=String(r.pesan||""); if(!msg.startsWith(ACT_PREFIX))return;
        try{const x=JSON.parse(msg.slice(ACT_PREFIX.length));const id=String(x.id||r.id_sa||"");if(!id||id===ADMIN_ID||out[id])return;out[id]=x;}catch(e){}
      });
      const local=localFallbackActivity();
      Object.keys(local).forEach(id=>{if(!out[id])out[id]=local[id]});
      return out;
    }catch(e){console.warn("[ADMIN CLOUD ACTIVITY]",e);return localFallbackActivity();}
  }
  async function fetchCloudMaster(){
    if(!cloudReq()||!window.SA_SUPABASE.isConfigured?.()) return (window.SA_MASTER_DATA_V964||[]).filter(x=>String(x.id)!==ADMIN_ID);
    try{
      const rows=await cloudReq()('/rest/v1/sa_users?select=id_sa,nama,area,join_date,vintage&order=id_sa.asc&limit=1000',{method:'GET'});
      return (Array.isArray(rows)?rows:[]).filter(x=>String(x.id_sa||"").trim()&&String(x.id_sa)!==ADMIN_ID).map(x=>({id:String(x.id_sa),name:String(x.nama||x.id_sa),area:String(x.area||""),join_date:String(x.join_date||""),vintage:String(x.vintage||"")}));
    }catch(e){console.warn("[ADMIN CLOUD MASTER]",e);return (window.SA_MASTER_DATA_V964||[]).filter(x=>String(x.id)!==ADMIN_ID)}
  }
  function calcProgress(a){return Math.max(0,Math.min(100,Number(a?.progress)||0))}
  function getQuizCount(a){return Number(a?.quizCount)||Object.keys(a?.quizResults||{}).length||0}
  function getAvg(a){return Number(a?.score)||0}
  function runrateFor(a,id,date){const r=(a?.runrate||{})[date]||localRunrate(id)[date]||null;if(!r)return null;const target=Number(r.target)||0,gmv=Number(r.gmv)||0;const d=new Date(date+"T12:00:00"),day=d.getDate(),days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return {target,gmv,ach:target?gmv/target*100:0,rr:day?gmv/day*days:0,rrp:target?(gmv/day*days)/target*100:0,updatedAt:r.updatedAt||""}}
  function mergeRows(){
    const acts=cloudActivities||{};
    return cloudRows.map(sa=>{const a=acts[String(sa.id)]||{};return Object.assign({},sa,{activity:a,logged:!!a.lastLogin,last:String(a.lastLogin||""),progress:calcProgress(a),quizCount:getQuizCount(a),avg:getAvg(a)});});
  }
  function applyFilter(rows){return rows.filter(x=>{if(selectedFilter==="login")return x.logged;if(selectedFilter==="notlogin")return !x.logged;if(selectedFilter==="quiz")return x.quizCount>0;return true;})}
  function sortRows(rows){const s=$("admSort")?.value||"name";return [...rows].sort((a,b)=>s==="ach"?((b._perf?.ach||-1)-(a._perf?.ach||-1)):s==="progress"?(b.progress-a.progress):s==="login"?((new Date(b.last||0))-(new Date(a.last||0))):a.name.localeCompare(b.name));}
  function buildPerformance(rows,date){return rows.map(x=>Object.assign(x,{_perf:runrateFor(x.activity,x.id,date)}));}
  function renderCards(rows){
    const data=Array.isArray(rows)?rows:mergeRows();
    const total=data.length,logged=data.filter(x=>!!x.logged).length,notLogged=total-logged;
    const quizzes=data.reduce((n,x)=>{const q=Number(x.quizCount);return n+(Number.isFinite(q)?q:0)},0);
    $("admTotal").textContent=String(total);$("admLogin").textContent=String(logged);$("admNotLogin").textContent=String(notLogged);$("admQuiz").textContent=String(quizzes);

  }
  function renderMain(rows){
    const date=$("admDate").value||today(), filtered=sortRows(applyFilter(buildPerformance(rows,date))), q=String($("admSearch")?.value||"").trim().toLowerCase();
    const searched=filtered.filter(x=>(x.name+" "+x.id+" "+x.area+" "+x.vintage).toLowerCase().includes(q));
    $("adminRows").innerHTML=searched.length?searched.map(x=>`<tr><td><div class="admSa">${esc(x.name)}</div><div class="admId">ID ${esc(x.id)}</div></td><td>${esc(x.area||"—")}</td><td>${esc(x.vintage||"—")}</td><td><span class="admStatusPill ${x.logged?"on":"off"}"><i class="admDot"></i>${x.logged?"Sudah login":"Belum login"}</span></td><td>${x.last?esc(new Date(x.last).toLocaleString("id-ID")):"—"}</td><td><div class="admBar"><i style="width:${x.progress}%"></i></div><div style="font-size:8px;margin-top:3px">${pct(x.progress)}</div></td><td>${x.quizCount}</td><td><button class="admAction" type="button" onclick="window.showAdminDetailV2('${esc(x.id)}')">Detail</button> <button class="admAction" type="button" style="background:#fff0f2;color:#b4233c" onclick="window.deleteSAFromAdmin('${esc(x.id)}')">Hapus</button></td></tr>`).join(""):"<tr><td colspan=8 style='text-align:center;padding:25px;color:#8a94a5'>Data tidak ditemukan.</td></tr>";
    $("adminPerformanceRows").innerHTML=searched.length?searched.map(x=>{const p=x._perf;const cls=!p?"":p.ach>=100?"admAchGood":p.ach>=80?"admAchWarn":"admAchBad";return `<tr><td><b>${esc(x.name)}</b><div class="admId">${esc(x.id)}</div></td><td>${p?money(p.target):"—"}</td><td>${p?money(p.gmv):"—"}</td><td class="${cls}">${p?pct(p.ach):"—"}</td><td class="admRR">${p?money(p.rr):"—"}</td><td>${p?pct(p.rrp):"—"}</td><td><div class="admMini"><i style="width:${x.progress}%"></i></div><div style="font-size:8px;margin-top:3px">${pct(x.progress)} • Avg ${pct(x.avg)}</div></td></tr>`}).join(""):"<tr><td colspan=7 style='text-align:center;padding:25px;color:#8a94a5'>Data tidak ditemukan.</td></tr>";
    $("admMonitorMeta").textContent=`${searched.length} SA • ${selectedFilter==='all'?"Semua":selectedFilter==='login'?"Sudah login":selectedFilter==='notlogin'?"Belum login":"Kuis"}`;
    const perf=rows.map(x=>Object.assign({},x,{_perf:runrateFor(x.activity,x.id,date)}));const wd=perf.filter(x=>x._perf);const tt=wd.reduce((n,x)=>n+x._perf.target,0),tg=wd.reduce((n,x)=>n+x._perf.gmv,0),aa=wd.length?wd.reduce((n,x)=>n+x._perf.ach,0)/wd.length:0;
    $("admTotalTarget").textContent=money(tt);$("admTotalACV").textContent=money(tg);$("admAvgAch").textContent=pct(aa);$("admAch100").textContent=wd.filter(x=>x._perf.ach>=100).length;
    const attention=[];rows.forEach(x=>{const p=runrateFor(x.activity,x.id,date);if(!x.logged)attention.push(`${x.name}: belum login.`);else if(!p)attention.push(`${x.name}: belum mengisi pencapaian ${date}.`);else if(p.ach<80)attention.push(`${x.name}: Ach% ${pct(p.ach)}.`);else if(x.progress<80)attention.push(`${x.name}: pemahaman ${pct(x.progress)}.`)});
    $("admAttentionList").innerHTML=attention.length?attention.slice(0,12).map(v=>`<div class="admAttentionItem">⚠️ ${esc(v)}</div>`).join(""):`<div class="admAttentionItem good">✅ Tidak ada SA yang perlu perhatian untuk periode ini.</div>`;
    const top=wd.sort((a,b)=>b._perf.ach-a._perf.ach).slice(0,5);$("admTopList").innerHTML=top.length?top.map((x,i)=>`<div class="admTopRow"><div class="admRank">#${i+1}</div><div><div class="admTopName">${esc(x.name)}</div><div class="admTopMeta">Ach ${pct(x._perf.ach)} • ${money(x._perf.gmv)}</div></div><div class="admTopValue">${pct(x._perf.ach)}</div></div>`).join(""):"<div class='admSyncNote'>Belum ada data pencapaian untuk periode ini.</div>";
  }
  async function refresh(force){if(loading)return;loading=true;$("admCloudStatus")?.classList.remove("off");try{cloudRows=await fetchCloudMaster();cloudActivities=await fetchCloudActivities();lastCloudAt=Date.now();$("admLastSync").textContent="Sinkron terakhir: "+new Date(lastCloudAt).toLocaleString("id-ID");const merged=mergeRows();renderCards(merged);renderMain(merged);}finally{loading=false}}
  function open(){const o=$("adminPanelOverlay");if(!o)return;o.style.display="block";o.setAttribute("aria-hidden","false");refresh(true);}

  window.openAdminDashboard=open;window.closeAdminDashboard=close;window.renderAdminDashboard=()=>refresh(true);
  window.showAdminDetailV2=function(id){const x=mergeRows().find(v=>String(v.id)===String(id));if(!x)return;const a=x.activity||{},p=a.quizResults||{},completed=a.completedModules||[];$("admDetailName").textContent=x.name;$("admDetailMeta").textContent=`ID ${x.id} • ${x.area||"Area belum diisi"} • ${x.vintage||"Vintage—"}`;const perf=runrateFor(a,x.id,$("admDate").value||today());$("admDetailStats").innerHTML=[['Status Login',x.logged?'Sudah login':'Belum login'],['Login Terakhir',x.last?new Date(x.last).toLocaleString('id-ID'):'Belum login'],['Pemahaman',pct(x.progress)],['Kuis',String(x.quizCount)],['Target',perf?money(perf.target):'—'],['ACV / GMV',perf?money(perf.gmv):'—'],['Ach%',perf?pct(perf.ach):'—'],['Run-rate',perf?money(perf.rr):'—']].map(z=>`<div class="admDetailStat"><small>${esc(z[0])}</small><b>${esc(z[1])}</b></div>`).join('');
    const mods=(typeof DB!=='undefined'&&Array.isArray(DB.modules))?DB.modules:[];$("admModuleGrid").innerHTML=mods.map(m=>{const q=p[m.id];const score=typeof q==='number'?q:Number(q?.score??0);const done=completed.includes(m.id);return `<div class="admModuleItem"><span>${esc(m.title||m.id)}</span><b style="color:${done?'#16854d':score?'#b45309':'#8a94a5'}">${done?'Selesai':score?score+'/100':'Belum'}</b></div>`}).join('');$("admDetailOverlay").style.display='flex';$("admDetailOverlay").setAttribute('aria-hidden','false');};

  function bind(){
    $("adminClose")?.addEventListener('click',close);$("adminRefresh")?.addEventListener('click',()=>refresh(true));$("admDate")?.addEventListener('change',()=>renderMain(mergeRows()));$("admSearch")?.addEventListener('input',()=>renderMain(mergeRows()));$("admSort")?.addEventListener('change',()=>renderMain(mergeRows()));$("admDetailClose")?.addEventListener('click',closeDetail);$("admDetailOverlay")?.addEventListener('click',e=>{if(e.target.id==='admDetailOverlay')closeDetail()});

      log({action,detail,module:moduleTitle});
      if(isAdminOpen())load();
    },100);
  },true);

  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",bind,{once:true});else bind();
  window.refreshAdminActivityLive=load;
})();
</script>

<script id="saContentManagerV1Logic">
(function(){
  "use strict";
  const PREFIX="__SA_CONTENT_MANAGER_V1__", ADMIN_ID="ADMIN110597";
  // Mengikuti baseline Admin: modul legacy ini sudah dihapus dan tidak boleh hidup kembali dari cloud.
  const SA_REMOVED_MODULE_IDS=new Set(["m3plus","sa-activities"]);
  const $=id=>document.getElementById(id);
  const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
  const req=()=>window.SA_SUPABASE?.request;
  let tab="modules", editModuleId="", editQuizIndex=-1, quizModuleId="", editPageId="";
  const DEFAULT_PAGES=[
    {id:"belajar-tugas",title:"Belajar & Tugas",icon:"📚"},
    {id:"sa-advanced-center",title:"SA Advanced Center",icon:"🚀"},
    {id:"informasi-update",title:"Informasi Update",icon:"🔔"}
  ];
  const INFO_ITEMS=[
    {id:"sales-rules",title:"Sales Rules & SOP",icon:"📕",desc:"Cari aturan, pelanggaran, dan tindakan disiplin"},
    {id:"referral-program",title:"Referral Program",icon:"📣",desc:"Syarat, ketentuan, dan skema insentif referral SA"},
    {id:"transaction-flow",title:"Cara Penginputan / Proses Transaksi Baru",icon:"📲",desc:"Pelajari alur transaksi baru langkah demi langkah"},
    {id:"vas-vietnam",title:"Program VAS / Trip to Vietnam",icon:"✈️",desc:"Program penjualan VAS & kesempatan Trip to Vietnam"}
  ];
  function getPages(){
    try{
      const raw=localStorage.getItem("__SA_CONTENT_PAGES_V1__");
      const pages=raw?JSON.parse(raw):[];
      if(Array.isArray(pages)&&pages.length)return pages;
    }catch(e){}
    return DEFAULT_PAGES.map(x=>Object.assign({},x));
  }
  function savePagesLocal(pages){try{localStorage.setItem("__SA_CONTENT_PAGES_V1__",JSON.stringify(pages))}catch(e){}}
  function pageById(id){return getPages().find(x=>String(x.id)===String(id))||null}
  function pageTitle(id){return pageById(id)?.title||"Belajar & Tugas"}


  function adminReady(){try{return !!JSON.parse(localStorage.getItem("sa_admin_session_v2")||"null")?.access_token}catch(e){return false}}
  async function cloudRows(){
    if(!req()||!window.SA_SUPABASE.isConfigured?.()) return [];
    try{return await req()('/rest/v1/chat_messages?select=id,id_sa,nama,pesan,created_at&pesan=like.'+encodeURIComponent(PREFIX+'%')+'&order=created_at.desc&limit=5000',{method:'GET'}).then(x=>Array.isArray(x)?x:[])}catch(e){console.warn('[CONTENT MANAGER READ]',e);return []}
  }
  async function saveCloud(payload){
    if(!adminReady()) throw new Error('Silakan Login sebagai Admin terlebih dahulu.');
    if(!req()||!window.SA_SUPABASE.isConfigured?.()) throw new Error('Koneksi Supabase belum siap.');
    await window.SA_SUPABASE.sendChat(ADMIN_ID,'Admin',PREFIX+JSON.stringify(payload),null);
  }
  function parsePayloads(rows){
    const latest={};
    rows.forEach(r=>{const msg=String(r?.pesan||'');if(!msg.startsWith(PREFIX))return;try{const x=JSON.parse(msg.slice(PREFIX.length));if(!x.key)return;const t=Date.parse(x.updatedAt||x.dataUpdatedAt||r.created_at||0)||0;if(!latest[x.key]||t>latest[x.key].t)latest[x.key]={t,x}}catch(e){}});
    return latest;
  }
  async function loadCloudContent(){
    const latest=parsePayloads(await cloudRows());
    let changed=false;
    Object.keys(latest).forEach(k=>{
      const x=latest[k].x;
      if(k.startsWith('module:')){
        const id=k.slice(7);
        if(SA_REMOVED_MODULE_IDS.has(String(id))){
          const before=DB.modules.length;
          DB.modules=DB.modules.filter(m=>!SA_REMOVED_MODULE_IDS.has(String(m.id)));
          if(DB.modules.length!==before) changed=true;
          return;
        }
        const i=DB.modules.findIndex(m=>String(m.id)===id);
        if(x.deleted){if(i>=0){DB.modules.splice(i,1);changed=true}}
        else if(x.module){if(i>=0){DB.modules[i]=Object.assign({},DB.modules[i],x.module);changed=true}else{DB.modules.push(x.module);changed=true}}
      }
      if(k.startsWith('quizzes:')){
        const mid=k.slice(8);
        if(SA_REMOVED_MODULE_IDS.has(String(mid))){
          const before=DB.quizzes.length;
          DB.quizzes=DB.quizzes.filter(q=>String(q[0])!==mid);
          if(DB.quizzes.length!==before) changed=true;
          return;
        }
        DB.quizzes=DB.quizzes.filter(q=>String(q[0])!==mid);
        if(!x.deleted&&Array.isArray(x.quizzes)) x.quizzes.forEach(q=>DB.quizzes.push(q));
        changed=true;
      }
      if(k==='pages'){
        if(!x.deleted&&Array.isArray(x.pages)){savePagesLocal(x.pages);changed=true;}
      }
    });
    // Re-apply the saved material placement after cloud synchronization.
    try{
      const ordered=[];
      DB.modules.forEach(m=>{if(!ordered.some(x=>String(x.id)===String(m.id))) ordered.push(m)});
      const byId=id=>ordered.findIndex(x=>String(x.id)===String(id));
      ordered.slice().forEach(m=>{
        const after=String(m?.placementAfter||'');
        if(!after)return;
        const mi=byId(m.id), ai=byId(after);
        if(mi<0||ai<0||mi===ai+1)return;
        const moved=ordered.splice(mi,1)[0];
        const target=byId(after);
        ordered.splice(target+1,0,moved);
      });
      DB.modules.splice(0,DB.modules.length,...ordered);
    }catch(e){console.warn('[CONTENT MANAGER ORDER]',e)}
    if(changed){try{if(typeof render==='function')render()}catch(e){}}
    return changed;
  }
  window.saLoadContentManagerContent=loadCloudContent;

  function moduleById(id){const found=DB.modules.find(m=>String(m.id)===String(id));if(found)return found;const info=INFO_ITEMS.find(m=>String(m.id)===String(id));if(info){const pg=pageById('informasi-update')||{title:'Informasi Update',icon:'🔔'};return Object.assign({},info,{pageId:'informasi-update',pageTitle:pg.title,pageIcon:pg.icon,slides:[],quizAfter:false});}return null}
  function openOverlay(html,title){
    let o=$('saContentManagerOverlay');if(!o){o=document.createElement('div');o.id='saContentManagerOverlay';o.className='cmOverlay';document.body.appendChild(o)}
    o.innerHTML='<div class="cmModal"><div class="cmModalHead"><div class="cmModalTitle">'+title+'</div><button class="cmClose" type="button" onclick="window.saCMClose()">Tutup</button></div>'+html+'</div>';
    o.style.display='flex';
  }
  window.saCMClose=function(){const o=$('saContentManagerOverlay');if(o)o.style.display='none'};

  function moduleEditor(m){
    const slides=(m?.slides||[]).map((s,i)=>'<div class="cmStep" data-step="'+i+'"><div class="cmStepTop"><b>STEP '+(i+1)+'</b><button type="button" class="cmRemoveStep" onclick="window.saCMRemoveStep(this)">Hapus Step</button></div><div class="cmGrid"><div class="cmField"><label>Judul Step</label><input class="cmStepTitle" value="'+esc(s?.[0]||'')+'"></div><div></div><div class="cmField cmFull"><label>Isi Materi</label><textarea class="cmStepBody">'+esc(s?.[1]||'')+'</textarea></div></div></div>').join('');
    const placementOptions=DB.modules.filter(x=>!m||String(x.id)!==String(m.id)).map(x=>'<option value="'+esc(x.id)+'">Setelah: '+esc(x.title)+'</option>').join('');
    const currentIndex=m?DB.modules.findIndex(x=>String(x.id)===String(m.id)):-1;
    const placementValue=m?.placementAfter||'';
    openOverlay('<div class="cmBody"><div class="cmGrid">'+
      '<div class="cmField"><label>ID Materi</label><input id="cmModId" value="'+esc(m?.id||'')+'" '+(m?'readonly':'')+' placeholder="contoh: produk-baru"></div>'+ 
      '<div class="cmField"><label>Ikon</label><input id="cmModIcon" value="'+esc(m?.icon||'📚')+'" placeholder="📚"></div>'+ 
      '<div class="cmField cmFull"><label>Judul Materi</label><input id="cmModTitle" value="'+esc(m?.title||'')+'"></div>'+ 
      '<div class="cmField cmFull"><label>Deskripsi Singkat</label><textarea id="cmModDesc" style="min-height:70px">'+esc(m?.desc||'')+'</textarea></div>'+ 
      '<div class="cmField cmFull"><label>Halaman Materi</label><select id="cmModPage">'+getPages().map(pg=>'<option value="'+esc(pg.id)+'" '+(String(m?.pageId||"belajar-tugas")===String(pg.id)?'selected':'')+'>'+esc(pg.icon||'📄')+' '+esc(pg.title)+'</option>').join('')+'</select><div class="cmHint">Pilih halaman tempat materi ini akan ditampilkan.</div></div>'+      '<div class="cmField cmFull"><label>Penempatan Materi</label><select id="cmModPlacement"><option value="" '+(!placementValue?'selected':'')+'>Paling awal</option>'+placementOptions+'</select><div class="cmHint">Pilih materi setelah materi ini ditempatkan. Pilihan ini hanya mengatur urutan materi.</div></div>'+
      '</div><label class="cmCheck"><input id="cmModQuizAfter" type="checkbox" '+(m?.quizAfter?'checked':'')+'> Setelah materi selesai, tampilkan kuis</label>'+ 
      '<div id="cmSteps">'+(slides||'')+'</div><div class="cmHint">Materi disimpan ke cloud. Materi baru/edit akan muncul pada perangkat SA setelah aplikasi memuat sinkronisasi cloud.</div></div><div class="cmModalFoot"><button type="button" class="cmClose" onclick="window.saCMClose()">Batal</button><button type="button" class="cmBtn" onclick="window.saCMSaveModule()">Simpan ke Cloud</button></div>','📚 '+(m?'Edit Materi':'Tambah Materi'));
    if(m && currentIndex===0){ const sel=$('cmModPlacement'); if(sel) sel.value=''; }
  }
  window.saCMAddStep=function(){const box=$('cmSteps');if(!box)return;const i=box.children.length;const d=document.createElement('div');d.className='cmStep';d.dataset.step=i;d.innerHTML='<div class="cmStepTop"><b>STEP '+(i+1)+'</b><button type="button" class="cmRemoveStep" onclick="window.saCMRemoveStep(this)">Hapus Step</button></div><div class="cmGrid"><div class="cmField"><label>Judul Step</label><input class="cmStepTitle"></div><div></div><div class="cmField cmFull"><label>Isi Materi</label><textarea class="cmStepBody"></textarea></div></div>';box.appendChild(d)};
  window.saCMRemoveStep=function(btn){btn?.closest('.cmStep')?.remove();document.querySelectorAll('#cmSteps .cmStep').forEach((x,i)=>{const b=x.querySelector('.cmStepTop b');if(b)b.textContent='STEP '+(i+1)})};
  window.saCMEditModule=function(id){editModuleId=id;moduleEditor(moduleById(id))};
  window.saCMSaveModule=async function(){
    try{
      const id=String($('cmModId')?.value||'').trim().toLowerCase().replace(/\s+/g,'-');
      const title=String($('cmModTitle')?.value||'').trim(),desc=String($('cmModDesc')?.value||'').trim(),icon=String($('cmModIcon')?.value||'📚').trim()||'📚';
      if(!id||!title)throw new Error('ID dan Judul materi wajib diisi.');
      if(!/^[a-z0-9][a-z0-9_-]*$/.test(id))throw new Error('ID hanya boleh huruf kecil, angka, - atau _.');
      const old=moduleById(editModuleId||id);
      const slides=[...document.querySelectorAll('#cmSteps .cmStep')].map(x=>[String(x.querySelector('.cmStepTitle')?.value||'').trim(),String(x.querySelector('.cmStepBody')?.value||'')]).filter(x=>x[0]||x[1]);
      if(!slides.length)throw new Error('Minimal 1 step materi.');
      const placementAfter=String($('cmModPlacement')?.value||'');
      const pageId=String($('cmModPage')?.value||'belajar-tugas');
      const selectedPage=pageById(pageId)||{id:pageId,title:'Belajar & Tugas',icon:'📚'};
      const m=Object.assign({},old||{},{id,title,desc,icon,slides,quizAfter:!!$('cmModQuizAfter')?.checked,placementAfter,pageId,pageTitle:selectedPage.title,pageIcon:selectedPage.icon});
      await saveCloud({key:'module:'+id,kind:'module',module:m,deleted:false,updatedAt:new Date().toISOString()});
      const i=DB.modules.findIndex(x=>String(x.id)===id);if(i>=0)DB.modules[i]=m;else DB.modules.push(m);
      // Apply only the requested placement by rebuilding the existing module order.
      const moved=DB.modules.splice(DB.modules.findIndex(x=>String(x.id)===id),1)[0];
      if(placementAfter){const pi=DB.modules.findIndex(x=>String(x.id)===placementAfter);if(pi>=0)DB.modules.splice(pi+1,0,moved);else DB.modules.unshift(moved)}else DB.modules.unshift(moved);
      // Persist the placement metadata for this module; existing content remains unchanged.
      saCMRender();saCMClose();if(typeof render==='function')render();
    }catch(e){alert(e.message||'Gagal menyimpan materi.')}
  };
  window.saCMDeleteModule=async function(id){
    const m=moduleById(id);if(!m)return;
    if(!confirm('Hapus materi "'+m.title+'"?\n\nMateri akan disembunyikan dari seluruh perangkat setelah sinkronisasi.'))return;
    try{await saveCloud({key:'module:'+id,kind:'module',deleted:true,updatedAt:new Date().toISOString()});const i=DB.modules.findIndex(x=>String(x.id)===id);if(i>=0)DB.modules.splice(i,1);saCMRender();if(typeof render==='function')render()}catch(e){alert(e.message||'Gagal menghapus materi.')}
  };

  function quizEditor(mid,index){
    const q=index>=0?DB.quizzes.filter(x=>String(x[0])===String(mid))[index]:null;
    const choices=q?.[2]||['','','',''];
    openOverlay('<div class="cmBody"><div class="cmGrid"><div class="cmField cmFull"><label>Materi</label><select id="cmQuizModule">'+DB.modules.map(m=>'<option value="'+esc(m.id)+'" '+(String(m.id)===String(mid)?'selected':'')+'>'+esc(m.title)+'</option>').join('')+'</select></div><div class="cmField cmFull"><label>Pertanyaan</label><textarea id="cmQuizQ">'+esc(q?.[1]||'')+'</textarea></div><div class="cmField cmFull"><label>Pilihan Jawaban</label><div class="cmQuizChoices">'+[0,1,2,3].map(i=>'<input class="cmQuizChoice" data-i="'+i+'" value="'+esc(choices[i]||'')+'" placeholder="Pilihan '+(i+1)+'">').join('')+'</div></div><div class="cmField"><label>Jawaban Benar</label><select id="cmQuizCorrect">'+[0,1,2,3].map(i=>'<option value="'+i+'" '+(Number(q?.[3])===i?'selected':'')+'>Pilihan '+(i+1)+'</option>').join('')+'</select></div><div></div><div class="cmField cmFull"><label>Pembahasan</label><textarea id="cmQuizExp" style="min-height:80px">'+esc(q?.[4]||'')+'</textarea></div></div></div><div class="cmModalFoot"><button type="button" class="cmClose" onclick="window.saCMClose()">Batal</button><button type="button" class="cmBtn" onclick="window.saCMSaveQuiz('+index+')">Simpan ke Cloud</button></div>','📝 '+(index>=0?'Edit Soal':'Tambah Soal'));
  }
  window.saCMEditQuiz=function(mid,index){quizModuleId=mid;editQuizIndex=index;quizEditor(mid,index)};
  window.saCMSaveQuiz=async function(oldIndex){
    try{
      const mid=String($('cmQuizModule')?.value||''),question=String($('cmQuizQ')?.value||'').trim();if(!mid||!question)throw new Error('Materi dan pertanyaan wajib diisi.');
      const choices=[...document.querySelectorAll('.cmQuizChoice')].map(x=>String(x.value||'').trim());if(choices.some(x=>!x))throw new Error('Semua 4 pilihan jawaban wajib diisi.');
      const correct=Number($('cmQuizCorrect')?.value||0),exp=String($('cmQuizExp')?.value||'').trim();
      const all=DB.quizzes.filter(q=>String(q[0])===mid).map(q=>q.slice());
      const nq=[mid,question,choices,correct,exp];if(oldIndex>=0)all[oldIndex]=nq;else all.push(nq);
      await saveCloud({key:'quizzes:'+mid,kind:'quizzes',quizzes:all,deleted:false,updatedAt:new Date().toISOString()});
      DB.quizzes=DB.quizzes.filter(q=>String(q[0])!==mid);all.forEach(q=>DB.quizzes.push(q));saCMRender();saCMClose();
    }catch(e){alert(e.message||'Gagal menyimpan soal.')}
  };
  window.saCMDeleteQuiz=async function(mid,index){

  window.saCMDeletePage=async function(id){

  };
  function pageRows(){return getPages().map(pg=>{const base=DB.modules.filter(m=>String(m.pageId||'belajar-tugas')===String(pg.id)).length;const count=String(pg.id)==="informasi-update"?base+INFO_ITEMS.filter(x=>!DB.modules.some(m=>String(m.id)===String(x.id))).length:base;return '<div class="cmRow"><div class="cmRowMain"><div class="cmRowTitle">'+esc(pg.icon||'📄')+' '+esc(pg.title)+'</div><div class="cmRowMeta">ID: '+esc(pg.id)+' • '+count+' materi</div></div><div class="cmActions"><button class="cmAction" onclick="window.saCMEditPage(\''+esc(pg.id)+'\')">Edit</button><button class="cmAction danger" onclick="window.saCMDeletePage(\''+esc(pg.id)+'\')">Hapus</button></div></div>'}).join('')||'<div class="cmEmpty">Belum ada halaman.</div>'}

  function moduleRows(){

      out+='<div class="cmPageGroup"><div class="cmPageGroupHead"><div class="cmPageGroupTitle">'+esc(pg.icon||'📄')+' '+esc(pg.title)+'</div><span>'+mods.length+' materi</span></div>';
      if(mods.length){
        out+=mods.map(m=>`<div class="cmRow"><div class="cmRowMain"><div class="cmRowTitle">${esc(m.icon||'📚')} ${esc(m.title)}</div><div class="cmRowMeta">${esc(pg.title)} • ID: ${esc(m.id)} • ${(m.slides?.length||0)} step • ${quizCount(m.id)} soal</div></div><div class="cmActions"><button class="cmAction" onclick="window.saCMEditModule('${esc(m.id)}')">Edit</button><button class="cmAction danger" onclick="window.saCMDeleteModule('${esc(m.id)}')">Hapus</button></div></div>`).join('');
      }else out+='<div class="cmEmpty">Belum ada materi di halaman ini.</div>';

    if(extras.length){
      out+='<div class="cmPageGroup"><div class="cmPageGroupHead"><div class="cmPageGroupTitle">📄 Halaman Lain</div><span>'+extras.length+' materi</span></div>';
      out+=extras.map(m=>`<div class="cmRow"><div class="cmRowMain"><div class="cmRowTitle">${esc(m.icon||'📚')} ${esc(m.title)}</div><div class="cmRowMeta">${esc(m.pageTitle||pageTitle(m.pageId||'belajar-tugas'))} • ID: ${esc(m.id)} • ${(m.slides?.length||0)} step • ${quizCount(m.id)} soal</div></div><div class="cmActions"><button class="cmAction" onclick="window.saCMEditModule('${esc(m.id)}')">Edit</button><button class="cmAction danger" onclick="window.saCMDeleteModule('${esc(m.id)}')">Hapus</button></div></div>`).join('');
      out+='</div>';
    }
    return out||'<div class="cmEmpty">Belum ada materi.</div>';
  }
  function quizCount(mid){return DB.quizzes.filter(q=>String(q[0])===String(mid)).length}
  let selectedQuizModuleId='';
  function quizRows(){
    const mods=DB.modules.filter(m=>quizCount(m.id));

  function saCMRender(){const list=$('saCMList');if(!list)return;list.innerHTML=tab==='modules'?moduleRows():(tab==='quizzes'?quizRows():pageRows());const status=$('saCMStatus');if(status)status.textContent='';}
  window.saCMSetTab=function(t){tab=t;document.querySelectorAll('.cmTab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));const b=$('saCMAddBtn');if(b)b.textContent=t==='modules'?'+ Tambah Materi':(t==='quizzes'?'+ Tambah Soal':'+ Tambah Halaman');saCMRender()};
  window.saCMAdd=function(){if(tab==='modules'){editModuleId='';moduleEditor(null)}else if(tab==='quizzes'){const m=DB.modules[0];if(!m)return alert('Tambahkan materi terlebih dahulu.');quizEditor(m.id,-1)}else{editPageId='';pageEditor(null)}};
  async function inject(){

    const detail=panel.querySelector('#adminDetail');panel.insertBefore(card,detail||null);
    card.querySelectorAll('.cmTab').forEach(x=>x.addEventListener('click',()=>saCMSetTab(x.dataset.tab)));$('saCMAddBtn').addEventListener('click',saCMAdd);saCMRender();
  }
  const observer=new MutationObserver(()=>inject());observer.observe(document.body,{childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded',async()=>{await loadCloudContent();inject()});
  // Keep Admin Content Manager synchronized with newly published cloud materials/pages.
  setInterval(async()=>{if(document.getElementById('saContentManagerCard')){try{if(await loadCloudContent())saCMRender()}catch(e){}}},5000);
  setInterval(()=>{if($('adminPanelOverlay')?.style.display==='block')inject()},1200);
})();
</script>
<!-- SA CONTENT CLOUD SYNC • read-only bridge for Admin Content Manager -->
<script id="saContentCloudSyncV1">
(function(){
  "use strict";
  const PREFIX="__SA_CONTENT_MANAGER_V1__";
  const getReq=()=>window.SA_SUPABASE?.request;
  const configured=()=>!!window.SA_SUPABASE?.isConfigured?.();
  async function load(){
    if(!getReq()||!configured()) return false;
    try{
      const rows=await getReq()('/rest/v1/chat_messages?select=id,pesan,created_at&order=created_at.desc&limit=5000',{method:'GET'});
      const latest={};
      (Array.isArray(rows)?rows:[]).forEach(r=>{
        const msg=String(r?.pesan||"");
        if(!msg.startsWith(PREFIX))return;
        try{
          const x=JSON.parse(msg.slice(PREFIX.length));
          if(!x.key)return;
          const t=Date.parse(x?.updatedAt||x?.dataUpdatedAt||r?.created_at||0)||0;
          if(!latest[x.key]||t>latest[x.key].t)latest[x.key]={t,x};
        }catch(e){}
      });
      let changed=false;
      const sameJSON=(a,b)=>{try{return JSON.stringify(a)===JSON.stringify(b)}catch(e){return false}};
      if(typeof DB!=="undefined"&&Array.isArray(DB.modules)){
        Object.keys(latest).forEach(function(k){
          const x=latest[k].x;
          if(k.startsWith('module:')){
            const id=k.slice(7);
            const i=DB.modules.findIndex(m=>String(m.id)===String(id));
            if(x.deleted){
              if(i>=0){DB.modules.splice(i,1);changed=true;}
            }else if(x.module){
              const incoming=Object.assign({},x.module);
              const pid=String(incoming.pageId||'belajar-tugas');
              try{
                const rawPages=localStorage.getItem('__SA_CONTENT_PAGES_V1__');
                let pages=rawPages?JSON.parse(rawPages):[];
                if(!Array.isArray(pages))pages=[];
                if(!pages.some(pg=>String(pg.id)===pid)){
                  pages.push({id:pid,title:String(incoming.pageTitle||pid),icon:String(incoming.pageIcon||'📄')});
                  localStorage.setItem('__SA_CONTENT_PAGES_V1__',JSON.stringify(pages));
                }
              }catch(e){}
              const next=i>=0?Object.assign({},DB.modules[i],incoming):incoming;
              if(i>=0){
                if(!sameJSON(DB.modules[i],next)){DB.modules[i]=next;changed=true;}
              }else{DB.modules.push(next);changed=true;}
            }
          }else if(k.startsWith('quizzes:')&&Array.isArray(DB.quizzes)){
            const mid=k.slice(8);
            const next=DB.quizzes.filter(q=>String(q[0])!==String(mid));
            if(!x.deleted&&Array.isArray(x.quizzes)) x.quizzes.forEach(q=>next.push(q));
            if(!sameJSON(DB.quizzes,next)){DB.quizzes=next;changed=true;}
          }else if(k==='pages'&&Array.isArray(x.pages)){
            try{
              const raw=localStorage.getItem('__SA_CONTENT_PAGES_V1__');
              const current=raw?JSON.parse(raw):[];
              if(!sameJSON(current,x.pages)){localStorage.setItem('__SA_CONTENT_PAGES_V1__',JSON.stringify(x.pages));changed=true;}
            }catch(e){}
          }
        });
      }
      if(changed){
        try{ if(typeof render==='function') render(); }catch(e){ console.warn('[SA CONTENT RENDER]',e); }
      }
      window.__SA_CONTENT_CLOUD_SYNCED__=true;
      return changed;
    }catch(e){
      console.warn('[SA CONTENT CLOUD SYNC]',e);
      return false;
    }
  }
  window.saSyncContentFromCloud=load;
  let loading=false;
  async function safeLoad(){ if(loading)return false; loading=true; try{return await load()} finally{loading=false} }
  function start(){
    safeLoad();
    setTimeout(safeLoad,1500);
    setTimeout(safeLoad,5000);
    setInterval(safeLoad,5000);
    window.addEventListener('online',safeLoad);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start,{once:true});
  else start();
})();
</script>

.saDynamicPageSection{margin-top:16px}.saDynamicPageSection .phGrid,.saDynamicPageSection .phToolsGrid{margin-top:0}

<script id="saAssignedPageRenderV1Logic">
(function(){
  "use strict";
  const PAGE_KEY="__SA_CONTENT_PAGES_V1__";
  const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","":"&quot;","'":"&#39;"}[m]));
  function pages(){
    const d=[{id:"belajar-tugas",title:"Belajar & Tugas",icon:"📚"},{id:"sa-advanced-center",title:"SA Advanced Center",icon:"🚀"},{id:"informasi-update",title:"Informasi Update",icon:"🔔"}];
    try{const x=JSON.parse(localStorage.getItem(PAGE_KEY)||"null");if(Array.isArray(x)&&x.length)return x;}catch(e){}
    return d;
  }
  function pageId(m){return String(m?.pageId||"belajar-tugas");}
  function toolId(id){return ["m3plus","sa-activities","kalkulator-insentif"].includes(String(id));}
  function card(m){
    const p=progress(), ok=!!p.passed[m.id], r=p.read[m.id], score=Number((p.scores||{})[m.id]||0);
    const st=ok?`<span class="phStatus done">🟢 Selesai</span>`:(r&&r.completed&&score>0&&score<80)?`<span class="phStatus warn">🔴 Perlu diulang</span>`:r?`<span class="phStatus learning">🟡 Sedang belajar</span>`:`<span class="phStatus todo">⚪ Belum mulai</span>`;
    const icon=saMaterialIcon(m.id);
    return `<button class="phModule ${ok?"done":""}" onclick="openModule('${String(m.id).replace(/'/g,"\\'")}',false)"><div class="phIcon">${icon}</div><div class="phModuleText"><strong>${esc(m.title)}</strong><small>${ok?"Materi selesai":r?"Sedang dipelajari":"Belum diselesaikan"}</small></div>${st}</button>`;
  }
  function toolCard(m){
    return `<button class="phToolCard" onclick="openModule('${String(m.id).replace(/'/g,"\\'")}',false)"><div class="phToolIcon">${saMaterialIcon(m.id)}</div><div class="phModuleText"><strong>${esc(m.title)}</strong><small>${esc(m.desc||"Materi pembelajaran SA")}</small></div><span class="phToolArrow">›</span></button>`;
  }
  function renderAssigned(){
    const app=document.getElementById("app")||document.getElementById("root");if(!app||typeof DB==="undefined"||!Array.isArray(DB.modules))return;
    if(!state.user)return;
    // Dynamic page cards belong ONLY to the Dashboard SA (home).
    // Never inject them into an open lesson/material screen.
    if(state.screen!=="home")return;
    const all=DB.modules.filter(m=>m&&!toolId(m.id));
    // Keep existing default section intact except for modules explicitly assigned elsewhere.
    const learning=document.querySelector("#phMaterialsSection .phGrid");
    if(learning){
      learning.querySelectorAll(".phModule[data-cm-module]").forEach(x=>x.remove());
      all.filter(m=>pageId(m)==="belajar-tugas").forEach(m=>{
        if([...learning.querySelectorAll(".phModule")].some(x=>x.getAttribute("onclick")?.includes("'"+m.id+"'")))return;
        const wrap=document.createElement("div");wrap.innerHTML=card(m);const el=wrap.firstElementChild;if(el){el.setAttribute("data-cm-module","1");learning.appendChild(el)}
      });
      all.filter(m=>pageId(m)!=="belajar-tugas").forEach(m=>{learning.querySelectorAll(".phModule").forEach(x=>{if(x.getAttribute("onclick")?.includes("'"+m.id+"'"))x.remove()})});
    }
    const advanced=document.querySelector("#phAdvancedCenterSection .phGrid");
    if(advanced){advanced.querySelectorAll("[data-cm-module]").forEach(x=>x.remove());all.filter(m=>pageId(m)==="sa-advanced-center").forEach(m=>{const w=document.createElement("div");w.innerHTML=toolCard(m);const el=w.firstElementChild;if(el){el.setAttribute("data-cm-module","1");advanced.appendChild(el)}})}
    const info=document.querySelector("#phToolsSection .phToolsGrid");
    if(info){info.querySelectorAll("[data-cm-module]").forEach(x=>x.remove());all.filter(m=>pageId(m)==="informasi-update").forEach(m=>{const w=document.createElement("div");w.innerHTML=toolCard(m);const el=w.firstElementChild;if(el){el.setAttribute("data-cm-module","1");info.appendChild(el)}})}
    // Custom pages are appended only when they contain assigned material.
    document.querySelectorAll(".saDynamicPageSection").forEach(x=>x.remove());
    const known=new Set(["belajar-tugas","sa-advanced-center","informasi-update"]);
    pages().filter(pg=>!known.has(String(pg.id))).forEach(pg=>{
      const pid=String(pg.id||"");
      const ptitle=String(pg.title||"");
      const isPromo=/promo/i.test(pid)||/promo/i.test(ptitle);
      // Match the exact page assignment first. For Promo pages, also accept legacy
      // content carrying the same page title or a promo-prefixed module id.
      let mods=all.filter(m=>pageId(m)===pid);
      if(isPromo){
        const extra=all.filter(m=>{
          if(mods.some(x=>String(x.id)===String(m.id)))return false;
          const mt=String(m.pageTitle||"");
          const mi=String(m.id||"");
          return (ptitle&&mt&&mt.toLowerCase()===ptitle.toLowerCase()) || /^promo(?:-|_|\s)/i.test(mi);
        });
        mods=mods.concat(extra);
      }
      // A custom page such as Promo must remain visible even while its assigned
      // cards are being loaded from the cloud.
      if(!mods.length && !isPromo)return;
      const sec=document.createElement("section");sec.className="phSection saDynamicPageSection";sec.id="saDynamicPage-"+pid.replace(/[^a-zA-Z0-9_-]/g,"-");
      sec.innerHTML=`<div class="phSectionTitle"><h3>${esc(ptitle||pid)}</h3></div>${mods.length?`<div class="phGrid">${mods.map(card).join("")}</div>`:`<div class="phContinue"><div class="phContinueLabel">PROMO</div><div class="phContinueTitle">Memuat promo terbaru...</div><div class="small">Konten promo sedang disinkronkan dari Admin.</div></div>`}`;
      const infoSec=document.getElementById("phToolsSection");if(infoSec?.parentNode)infoSec.parentNode.insertBefore(sec,infoSec.nextSibling);else app.appendChild(sec);
    });
  }
  async function run(){
    try{if(typeof window.saSyncContentFromCloud==='function')await window.saSyncContentFromCloud();}catch(e){}
    setTimeout(renderAssigned,0);setTimeout(renderAssigned,80);setTimeout(renderAssigned,400);
  }
  const oldRender=window.render;
  if(typeof oldRender==="function"&&!oldRender.__assignedPageV1){
    const wrapped=function(){const r=oldRender.apply(this,arguments);run();return r};wrapped.__assignedPageV1=true;window.render=wrapped;
  }
  document.addEventListener("DOMContentLoaded",run,{once:true});
  // Keep custom pages (including Promo) synchronized with Admin cloud changes.
  if(!window.__saPromoSyncIntervalV1){
    window.__saPromoSyncIntervalV1=setInterval(async()=>{
      try{if(typeof window.saSyncContentFromCloud==='function')await window.saSyncContentFromCloud();renderAssigned();}catch(e){}
    },5000);
  }
})();
</script>

<script id="final-home-render-dedupe-only">
(function(){
  "use strict";
  /* ONLY fix the repeated Dashboard SA render that causes calendar, runrate,
     and quote to blink. No content or layout is changed. */
  function homeSignature(){
    try{
      if(typeof state==='undefined' || !state.user || state.screen!=='home') return null;
      var p={};
      try{ p=typeof loadProgress==='function'?loadProgress():{}; }catch(e){}
      var mods=[];
      try{ mods=(typeof DB!=='undefined'&&Array.isArray(DB.modules))?DB.modules.map(function(m){
        return [m.id,m.title,m.pageId,m.icon,m.desc,m.slides?.length];
      }):[]; }catch(e){}
      var pages='';
      try{ pages=localStorage.getItem('__SA_CONTENT_PAGES_V1__')||''; }catch(e){}
      return JSON.stringify({
        screen:state.screen,
        user:String(state.user.id||'')+'|'+String(state.user.name||''),
        passed:p.passed||{}, read:p.read||{}, scores:p.scores||{},
        mods:mods, pages:pages

function closeProfile(e){if(e&&e.target!==e.currentTarget)return;const p=document.getElementById('profilePanel');if(p)p.style.display='none'}
function changeProfilePhoto(e){
  const input=e&&e.target;
  const f=input&&input.files&&input.files[0];
  if(!f)return;
  const type=String(f.type||'').toLowerCase();
  const name=String(f.name||'').toLowerCase();
  const isImage=/^image\//.test(type)||/\.(jpg|jpeg|png|webp|gif|bmp|heic|heif)$/i.test(name);
  if(!isImage){alert('⚠️ Silakan pilih file foto dari galeri.');input.value='';return;}
  if(f.size>12*1024*1024){alert('⚠️ Ukuran foto terlalu besar. Pilih foto maksimal 12 MB.');input.value='';return;}
  const id=String(state.user?.id||'SA');
  const key='saProfilePhoto_'+id;
  let objectUrl='';
  const finish=(data)=>{
    try{
      localStorage.setItem(key,data);
      localStorage.setItem('saProfilePhoto',data);
      [document.getElementById('profilePhotoBox'),document.getElementById('sidebarProfilePhoto')].forEach(x=>{
        if(x){x.innerHTML='';x.style.backgroundImage='url("'+data+'")';x.style.backgroundSize='cover';x.style.backgroundPosition='center';x.classList.remove('profile-placeholder');}
      });
      if(window.SA_SUPABASE?.updateProfilePhoto&&state.user?.id){
        window.SA_SUPABASE.updateProfilePhoto(String(state.user.id),data).catch(()=>{});
      }
      input.value='';
      alert('✅ Foto profil berhasil digunakan.');
    }catch(err){
      input.value='';
      alert('❌ Foto gagal disimpan. Silakan pilih foto lain.');
    }
  };
  const reader=new FileReader();
  reader.onload=()=>{
    const raw=String(reader.result||'');
    const img=new Image();
    img.onload=()=>{
      try{
        const max=1000;
        const ow=Number(img.naturalWidth||img.width||1),oh=Number(img.naturalHeight||img.height||1);
        const scale=Math.min(1,max/Math.max(ow,oh));
        const w=Math.max(1,Math.round(ow*scale)),h=Math.max(1,Math.round(oh*scale));
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const ctx=c.getContext('2d',{alpha:false});
        if(!ctx)throw new Error('canvas');
        ctx.drawImage(img,0,0,w,h);
        finish(c.toDataURL('image/jpeg',0.82));
      }catch(err){
        input.value='';
        alert('❌ Foto tidak dapat diproses. Silakan pilih foto JPG/PNG dari galeri.');
      }finally{if(objectUrl)URL.revokeObjectURL(objectUrl);}
    };
    img.onerror=()=>{
      input.value='';
      if(objectUrl)URL.revokeObjectURL(objectUrl);
      alert('❌ Foto tidak dapat dibaca. Silakan pilih foto JPG/PNG dari galeri.');
    };
    try{
      objectUrl=URL.createObjectURL(f);
      img.src=objectUrl;
    }catch(_){img.src=raw;}
  };
  reader.onerror=()=>{input.value='';alert('❌ Galeri tidak dapat dibaca. Silakan coba pilih foto lagi.');};
  reader.readAsDataURL(f);
}

(function(){
