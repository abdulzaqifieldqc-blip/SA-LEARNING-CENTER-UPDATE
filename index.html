  function escHtml(v){return typeof esc==='function'?esc(v):String(v??'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function flatStrings(value,out,path,seen){
    if(value==null)return;
    if(typeof value==='string' || typeof value==='number' || typeof value==='boolean'){
      var t=String(value).trim(); if(t.length>=2) out.push({text:t,path:path||''}); return;
    }
    if(typeof value!=='object')return;
    if(seen.indexOf(value)>=0)return; seen.push(value);
    if(Array.isArray(value)){for(var i=0;i<value.length;i++)flatStrings(value[i],out,path+'['+i+']',seen);return;}
    Object.keys(value).forEach(function(k){
      if(k==='id' || k==='icon' || k==='image' || k==='photo' || k==='password' || k==='token')return;
      flatStrings(value[k],out,path?path+'.'+k:k,seen);
    });
  }
  function makeIndex(){
    var items=[], seenText={};
    function add(title,snippet,type,action,key){
      title=String(title||'').trim();snippet=String(snippet||'').replace(/\\s+/g,' ').trim();
      var text=(title+' '+snippet).trim(); if(!text)return;
      var k=(key||text).toLowerCase(); if(seenText[k])return; seenText[k]=1;
      items.push({title:title||'Hasil pencarian',snippet:snippet,type:type||'Konten aplikasi',action:action||null,key:k});
    }
    if(window.DB && Array.isArray(DB.modules)){
      DB.modules.forEach(function(m){
        var vals=[];flatStrings(m,vals,'',[]);
        var body=vals.map(function(x){return x.text}).filter(function(x){return x.length>1}).join(' ');
        add(m.title||m.name||'Materi',body.slice(0,500),'Materi Pembelajaran',function(){openModule(String(m.id),false)},'module:'+m.id);
      });
    }
    // Explicitly index the Welcome header so it is always searchable, even when rendered dynamically.
    var welcomeHeader=document.querySelector('.welcomeCopy h1');
    var welcomeSub=document.querySelector('.welcomeCopy p');
    if(welcomeHeader){add(welcomeHeader.textContent||'',welcomeSub?welcomeSub.textContent:'','Welcome / Dashboard',null,'welcome:header');}

    // Search current application UI text as well, excluding the search dialog itself.
    document.querySelectorAll('body *').forEach(function(el){
      if(el.closest('#globalSearchOverlay'))return;
      if(el.children.length>0)return;
      var t=(el.textContent||'').replace(/\\s+/g,' ').trim();
      if(t.length>=3 && t.length<=300) add(t,'','Teks di aplikasi',null,'ui:'+t.toLowerCase());
    });
    return items;
  }
  function render(q){
    var all=makeIndex(),needle=String(q||'').toLowerCase().trim();
    if(!needle){meta.textContent='Cari teks, materi, informasi, kuis, dan konten lainnya.';results.innerHTML='<div class="globalSearchEmpty"><b>Mulai mencari</b>Ketik kata atau kalimat yang ingin ditemukan.</div>';return;}
    var words=needle.split(/\\s+/).filter(Boolean);
    var ranked=all.map(function(x){
      var hay=(x.title+' '+x.snippet).toLowerCase(),score=0;
      if(hay.indexOf(needle)>=0)score+=30;
      words.forEach(function(w){if(hay.indexOf(w)>=0)score+=5});
      if(x.title.toLowerCase().indexOf(needle)>=0)score+=20;
      return {x:x,score:score};
    }).filter(function(x){return x.score>0}).sort(function(a,b){return b.score-a.score}).slice(0,40).map(function(x){return x.x});
    meta.textContent=ranked.length+' hasil ditemukan';
    if(!ranked.length){results.innerHTML='<div class="globalSearchEmpty"><b>Tidak ditemukan</b>Coba kata kunci lain yang ada di aplikasi.</div>';return;}
    results.innerHTML=ranked.map(function(x){
      var icon='<svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 0-3 3V4z"></path><path d="M8 8h7M8 12h7"></path></svg>';
      return '<button type="button" class="globalSearchResult" '+(x.action?'data-action="1"':'')+'><span class="globalSearchResultIcon">'+icon+'</span><span class="globalSearchResultBody"><strong class="globalSearchResultTitle">'+escHtml(x.title)+'</strong><small class="globalSearchResultType">'+escHtml(x.type)+'</small>'+(x.snippet?'<span class="globalSearchSnippet">'+escHtml(x.snippet.slice(0,240))+'</span>':'')+'</span></button>';
    }).join('');
    Array.from(results.querySelectorAll('.globalSearchResult')).forEach(function(btn,i){if(ranked[i].action)btn.onclick=function(){closeGlobalSearch();setTimeout(ranked[i].action,80)}});
  }
  window.openGlobalSearch=function(){
    overlay=document.getElementById('globalSearchOverlay');input=document.getElementById('globalSearchInput');results=document.getElementById('globalSearchResults');meta=document.getElementById('globalSearchMeta');
    if(!overlay)return;overlay.classList.add('show');document.body.style.overflow='hidden';setTimeout(function(){input&&input.focus()},50);render(input?input.value:'');
  };
  window.closeGlobalSearch=function(){if(!overlay)overlay=document.getElementById('globalSearchOverlay');if(overlay)overlay.classList.remove('show');document.body.style.overflow='';};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeGlobalSearch();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openGlobalSearch();}});
  document.addEventListener('input',function(e){if(e.target&&e.target.id==='globalSearchInput')render(e.target.value);});
})();
</script>










<script id="android-back-v18-real-history">
(function(){
  if(window.__saAndroidBackV18) return;
  window.__saAndroidBackV18 = true;

  var suppressPush = false;
  var lastSig = "";

  function clone(v){
    try { return JSON.parse(JSON.stringify(v)); }
    catch(e){ return v; }
  }

  function snapshot(){
    var st = window.state || {};
    return {
      __saAppView: true,
      screen: st.screen || "home",
      moduleId: st.module && st.module.id ? String(st.module.id) : null,
      slide: Number.isFinite(Number(st.slide)) ? Number(st.slide) : 0,
      quizIndex: Number.isFinite(Number(st.quizIndex)) ? Number(st.quizIndex) : 0,
      quizScore: Number.isFinite(Number(st.quizScore)) ? Number(st.quizScore) : 0,
      quizAnswers: clone(Array.isArray(st.quizAnswers) ? st.quizAnswers : []),
      quizChoices: clone(Array.isArray(st.quizChoices) ? st.quizChoices : []),
      isRemedial: !!st.isRemedial,
      quizSessions: clone((typeof loadProgress === "function" ? (loadProgress().quizSessions||{}) : {}))
    };
  }

  function signature(s){
    return [
      s.screen,s.moduleId,s.slide,s.quizIndex,s.quizScore,
      JSON.stringify(s.quizAnswers||[]),
      JSON.stringify(s.quizChoices||[]),
      s.isRemedial
    ].join("|");
  }

  function restore(s){
    if(!s || !s.__saAppView || !window.state) return false;

    suppressPush = true;
    try{
      state.screen = s.screen || "home";
      state.slide = Number(s.slide)||0;
      state.quizIndex = Number(s.quizIndex)||0;
      state.quizScore = Number(s.quizScore)||0;
      state.quizAnswers = clone(s.quizAnswers||[]);
      state.quizChoices = clone(s.quizChoices||[]);
      state.isRemedial = !!s.isRemedial;

      if(s.moduleId && window.DB && Array.isArray(DB.modules)){
        state.module = DB.modules.find(function(m){
          return String(m.id) === String(s.moduleId);
        }) || null;
      }else{
        state.module = null;
      }

      if(typeof renderAndScrollTop === "function"){
        renderAndScrollTop();
      }else if(typeof render === "function"){
        render();
      }
      lastSig = signature(snapshot());
      return true;
    }catch(e){
      console.error("SA Back restore error:", e);
      return false;
    }finally{
      suppressPush = false;
    }
  }

  /*
   * Build a real browser/WebView history stack:
   *   [sentinel] -> [Home] -> [current view] -> ...
   *
   * Every state-changing render becomes one entry. Therefore Android Back
   * naturally moves exactly one app view backwards.
   *
   * At Home there are two entries. First Back lands on sentinel and stays
   * inside the app; second Back reaches the WebView/browser boundary and can
   * exit the APK.
   */
  try{
    history.replaceState({__saRootSentinel:true}, "", location.href);
    history.pushState(snapshot(), "", location.href);
  }catch(e){}

  lastSig = signature(snapshot());

  var originalRender = window.render;
  if(typeof originalRender === "function"){
    window.render = function(){
      var before = signature(snapshot());
      var result = originalRender.apply(this, arguments);
      var after = signature(snapshot());

      if(!suppressPush && before !== after){
        try{
          history.pushState(snapshot(), "", location.href);
        }catch(e){}
      }
      lastSig = after;
      return result;
    };
  }

  window.addEventListener("popstate", function(ev){
    /*
     * If we reached the root sentinel, remain on Home. The NEXT Android Back
     * is allowed to leave the WebView/APK.
     */
    if(ev.state && ev.state.__saRootSentinel){
      try{
        if(window.state && state.screen !== "home"){
          suppressPush = true;
          state.screen = "home";
          state.module = null;
          state.slide = 0;
          if(typeof render === "function") render();
          suppressPush = false;
        }
      }catch(e){}
      return;
    }

    if(ev.state && ev.state.__saAppView){
      restore(ev.state);
    }
  }, false);
})();
</script>

<script id="permanentDataArchiveV1">
(function(){
  "use strict";
  if(window.__permanentDataArchiveV1)return;
  window.__permanentDataArchiveV1=true;
  const ARCHIVE_PREFIX="__SA_DATA_ARCHIVE_V1__";
  const START_DATE="2026-08-30";
  const QUEUE_KEY="sa_permanent_archive_queue_v1";
  const HASH_KEY="sa_permanent_archive_hash_v1";
  const LOGIN_KEY="sa_permanent_login_history_v1";
  const ADMIN_ID="ADMIN110597";
  const req=()=>window.SA_SUPABASE?.request;
  const configured=()=>!!(window.SA_SUPABASE?.isConfigured?.()&&req());
  const user=()=>{try{return (typeof state!=="undefined"&&state.user)?state.user:null}catch(e){return null}};
  const uid=()=>String(user()?.id||"").trim();
  const safeJSON=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))||d}catch(e){return d}};
  const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
  const now=()=>new Date().toISOString();
  function loginHistory(id,name,append){
    const all=safeJSON(LOGIN_KEY,{}); const arr=Array.isArray(all[id])?all[id]:[];
    if(append){const at=now();const last=arr[arr.length-1];if(!last||Math.abs(new Date(at)-new Date(last.at))>1500)arr.push({at,name:String(name||id),appStart:START_DATE});}
    all[id]=arr; write(LOGIN_KEY,all); return arr;
  }
  function mergeHistory(a,b){
    const out=Object.assign({},a||{});Object.keys(b||{}).forEach(k=>{const aa=Array.isArray(out[k])?out[k]:[],bb=Array.isArray(b[k])?b[k]:[],seen=new Set(aa.map(v=>JSON.stringify(v)));out[k]=aa.concat(bb.filter(v=>{const z=JSON.stringify(v);if(seen.has(z))return false;seen.add(z);return true;}));});return out;
  }
  function mergeObj(a,b){return Object.assign({},a||{},b||{});}
  function mergeRead(a,b){const out=Object.assign({},a||{});Object.keys(b||{}).forEach(k=>{const x=out[k],y=b[k];if(!x)out[k]=y;else if(y){out[k]=Object.assign({},x,y,{slide:Math.max(Number(x.slide||0),Number(y.slide||0)),completed:!!x.completed||!!y.completed});}});return out;}
  function snapshot(reason){
    const u=user();if(!u?.id||String(u.id)===ADMIN_ID)return null;
    const p=typeof loadProgress==='function'?loadProgress():{};let rr={};try{const db=safeJSON('dailyGMVTargetData',{});rr=db[String(u.id)]||{}}catch(e){}
    const old=safeJSON('sa_login_activity_v2',{})[String(u.id)]||{};
    const lh=loginHistory(String(u.id),u.name,false);
    const scores=p.scores||{},passed=p.passed||{},hist=p.history||{};
    const vals=Object.values(scores).map(Number).filter(Number.isFinite);const avg=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0;
    return {archiveVersion:1,appStartDate:START_DATE,archiveReason:String(reason||'data'),archivedAt:now(),id:String(u.id),name:String(u.name||old.name||u.id),loginHistory:lh,lastLogin:String(old.lastLogin||''),progress:typeof completedCount==='function'&&typeof DB!=='undefined'?Math.round(completedCount()/Math.max(1,DB.modules.length)*100):Number(old.progress)||0,score:avg,quizCount:Object.keys(scores).length,quizResults:Object.fromEntries(Object.keys(scores).map(k=>[k,{score:Number(scores[k])||0,passed:!!passed[k]}])),completedModules:Object.keys(passed).filter(k=>passed[k]),scores:Object.fromEntries(Object.keys(scores).map(k=>[k,Number(scores[k])||0])),passedMap:Object.fromEntries(Object.keys(passed).map(k=>[k,!!passed[k]])),quizHistory:hist,readMap:p.read||{},runrate:rr,updatedAt:new Date(Math.max(Number(p.__updatedAt)||0,Date.now())).toISOString(),dataUpdatedAt:new Date(Math.max(Number(p.__updatedAt)||0,Date.now())).toISOString()};
  }
  function fingerprint(x){try{const y=Object.assign({},x,{archiveReason:"",archivedAt:0,updatedAt:0,dataUpdatedAt:0});return btoa(unescape(encodeURIComponent(JSON.stringify(y)))).slice(0,220)}catch(e){return JSON.stringify(x).slice(0,220)}}
  async function sendArchive(x){if(!x||!configured())return false;try{await window.SA_SUPABASE.sendChat(x.id,x.name,ARCHIVE_PREFIX+JSON.stringify(x),null);return true}catch(e){console.warn('[PERMANENT ARCHIVE]',e);return false}}
  function enqueue(x){try{const q=safeJSON(QUEUE_KEY,[]);const a=Array.isArray(q)?q:[];a.push(x);while(a.length>200)a.shift();write(QUEUE_KEY,a);}catch(e){}}
  async function flush(){if(!configured())return;let q=safeJSON(QUEUE_KEY,[]);if(!Array.isArray(q)||!q.length)return;const left=[];for(const x of q){if(!(await sendArchive(x)))left.push(x)}write(QUEUE_KEY,left)}
  async function archive(reason,force){const x=snapshot(reason);if(!x)return false;const h=fingerprint(x);if(!force&&localStorage.getItem(HASH_KEY)===h){await flush();return true;}localStorage.setItem(HASH_KEY,h);if(!(await sendArchive(x)))enqueue(x);await flush();return true;}
  async function loadArchive(id){
    if(!id||!configured())return [];
    try{const q='/rest/v1/chat_messages?select=id,id_sa,pesan,created_at&id_sa=eq.'+encodeURIComponent(String(id))+'&pesan=like.'+encodeURIComponent(ARCHIVE_PREFIX+'%')+'&order=created_at.asc&limit=1000';const rows=await req()(q,{method:'GET'});return (Array.isArray(rows)?rows:[]).map(r=>{try{return JSON.parse(String(r.pesan).slice(ARCHIVE_PREFIX.length))}catch(e){return null}}).filter(Boolean)}catch(e){console.warn('[PERMANENT ARCHIVE READ]',e);return []}
  }
  async function restore(id){
    const items=await loadArchive(id);if(!items.length)return false;
    const p=typeof loadProgress==='function'?loadProgress():{read:{},passed:{},scores:{},history:{}};let allRun={};try{allRun=safeJSON('dailyGMVTargetData',{});}catch(e){}
    const uid=String(id);let loginAll=safeJSON(LOGIN_KEY,{});let loginArr=Array.isArray(loginAll[uid])?loginAll[uid]:[];
    for(const x of items){
      p.read=mergeRead(p.read,x.readMap);p.passed=mergeObj(p.passed,x.passedMap);p.scores=mergeObj(p.scores,x.scores);p.history=mergeHistory(p.history,x.quizHistory);p.quizSessions=mergeObj(p.quizSessions,x.quizSessions);loginArr=mergeHistory({x:loginArr},{x:x.loginHistory}).x;
      if(x.runrate&&typeof x.runrate==='object'){const cur=allRun[uid]||{};const dates=new Set([...Object.keys(cur),...Object.keys(x.runrate)]);const m={};dates.forEach(d=>{const a=cur[d],b=x.runrate[d];if(!a)m[d]=b;else if(!b)m[d]=a;else{const at=Number(a.updatedAt?new Date(a.updatedAt).getTime():0),bt=Number(b.updatedAt?new Date(b.updatedAt).getTime():0);m[d]=bt>=at?b:a;}});allRun[uid]=m;}
    }
    p.__cloudUpdatedAt=Math.max(Number(p.__cloudUpdatedAt)||0,...items.map(x=>Number(x.updatedAt?new Date(x.updatedAt).getTime():0)).filter(Number.isFinite));p.__updatedAt=Math.max(Number(p.__updatedAt)||0,Number(p.__cloudUpdatedAt)||0);write(LOGIN_KEY,Object.assign(loginAll,{[uid]:loginArr}));localStorage.setItem('dailyGMVTargetData',JSON.stringify(allRun));localStorage.setItem('salearning_'+uid,JSON.stringify(p));return true;
  }
  window.loadSAPermanentHistory=loadArchive;
  window.restoreSAPermanentHistory=restore;
  // Wrap cloud restore: current snapshot + append-only archive are merged, never destructively replaced.
  const oldHydrate=window.hydrateCloudSnapshot;
  if(typeof oldHydrate==='function'&&!oldHydrate.__permanentArchive){const w=async function(id){const r=await oldHydrate.apply(this,arguments);await restore(id);return r||true};w.__permanentArchive=true;window.hydrateCloudSnapshot=w;}
  // Successful login creates an immutable archive record. Current daily achievement can change, history does not disappear.
  const oldLogin=window.login;
  if(typeof oldLogin==='function'&&!oldLogin.__permanentArchive){const w=function(){const r=oldLogin.apply(this,arguments);setTimeout(async()=>{const u=user();if(u?.id){loginHistory(String(u.id),u.name,true);await archive('login',true);}},900);return r};w.__permanentArchive=true;window.login=w;}
  // Archive meaningful data changes, but do not create a new permanent row for an unchanged snapshot every timer tick.
  const oldSync=window.syncSAActivityToCloud;
  if(typeof oldSync==='function'&&!oldSync.__permanentArchive){const w=async function(){const r=await oldSync.apply(this,arguments);setTimeout(()=>archive('data',false),80);return r};w.__permanentArchive=true;window.syncSAActivityToCloud=w;}
  window.addEventListener('online',()=>{flush();archive('reconnect',false)});
  setInterval(()=>{flush();},60000);
  document.addEventListener('DOMContentLoaded',()=>setTimeout(()=>{const u=user();if(u?.id)archive('startup',false)},1800));
})();
</script>
