/* =========================

   ========================= */
@keyframes saTap{
  0%{transform:scale(1)}
  45%{transform:scale(.96)}
  100%{transform:scale(1)}
}
@keyframes saPageIn{
  0%{opacity:0;transform:translateY(10px) scale(.99)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes saSlideIn{
  0%{opacity:0;transform:translateX(18px)}
  100%{opacity:1;transform:translateX(0)}
}
@keyframes saPulse{
  0%{box-shadow:0 0 0 0 rgba(255,49,88,.28)}
  100%{box-shadow:0 0 0 10px rgba(255,49,88,0)}
}
@keyframes saCheck{
  0%{transform:scale(.75);opacity:.4}
  60%{transform:scale(1.12);opacity:1}
  100%{transform:scale(1)}
}

.sa-tap-motion{animation:saTap .22s ease}
.sa-page-motion{animation:saPageIn .32s cubic-bezier(.2,.8,.2,1)}
.sa-panel-motion{animation:saSlideIn .32s cubic-bezier(.2,.8,.2,1)}
.sa-clickable{
  transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
}
.sa-clickable:active{transform:scale(.97)}
nav button{
  transition:transform .2s ease,background .2s ease,color .2s ease,box-shadow .2s ease;
}
nav button:active{transform:translateX(4px) scale(.985)}
button,.panel-item,.sa-profile-mini,.profile-photo-label{

}
.panel-item{
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.panel-item:active{transform:scale(.98)}

function openSalesRules(){
  setReturnContext("tools");

function getFilteredSalesRules(){
  const q=salesRulesQuery.trim().toLowerCase();
  return SALES_RULES_DATA.filter(x=>{
    const groupOk=salesRulesGroup==="Semua"||x.group===salesRulesGroup;
    const hay=[x.no,x.group,x.rule,...(x.sanctions||[]),...(x.refs||[]),...(x.teams||[])].join(" ").toLowerCase();
    return groupOk && (!q||hay.includes(q));
  });
}
function renderSalesRulesCards(filtered){
  const cards=filtered.map(x=>{
    const sanctions=(x.sanctions||[]).map(s=>`<span class="srChip srSanction">${escRuleText(s)}</span>`).join("");
    const refs=(x.refs||[]).map(s=>`<span class="srChip srRef">${escRuleText(s)}</span>`).join("");
    const teams=(x.teams||[]).map(s=>`<span class="srChip srTeam">${escRuleText(s)}</span>`).join("");
    return `<article class="srCard">
      <div class="srCardTop"><span class="srNo">RULE ${escRuleText(x.no)}</span><span class="srGroup">${escRuleText(x.group||"Umum")}</span></div>
      <div class="srRule">${escRuleText(x.rule).replace(/\\n/g,"<br>")}</div>
      <div class="srMeta">${teams}${sanctions}${refs}</div>
    </article>`;
  }).join("");
  return cards||`<div class="srEmpty">Tidak ada aturan yang cocok dengan pencarianmu.</div>`;
}
function updateSalesRulesResults(){
  const filtered=getFilteredSalesRules();
  const bar=document.querySelector(".srResultBar");
  const list=document.querySelector(".srList");
  if(bar) bar.innerHTML=`<strong>${filtered.length}</strong> aturan ditemukan <span>• Sumber: ID (Ver 3) 2026</span>`;
  if(list) list.innerHTML=renderSalesRulesCards(filtered);
}
function salesRulesSearch(v){
  salesRulesQuery=String(v||"");
  updateSalesRulesResults();
}

window.salesRulesSearch=salesRulesSearch;

function salesRulesFilter(group){
  salesRulesGroup=group||"Semua";
  renderSalesRules();
}
window.salesRulesFilter=salesRulesFilter;

function renderSalesRules(){
  const groups=["Semua",...Array.from(new Set(SALES_RULES_DATA.map(x=>x.group).filter(Boolean)))];
  const q=salesRulesQuery.trim().toLowerCase();
  const filtered=SALES_RULES_DATA.filter(x=>{
    const groupOk=salesRulesGroup==="Semua"||x.group===salesRulesGroup;
    const hay=[x.no,x.group,x.rule,...(x.sanctions||[]),...(x.refs||[])].join(" ").toLowerCase();
    return groupOk && (!q||hay.includes(q));
  });
  const cards=filtered.map(x=>{
    const sanctions=(x.sanctions||[]).map(s=>`<span class="srChip srSanction">${escRuleText(s)}</span>`).join("");
    const refs=(x.refs||[]).map(s=>`<span class="srChip srRef">${escRuleText(s)}</span>`).join("");
    const teams=(x.teams||[]).map(s=>`<span class="srChip srTeam">${escRuleText(s)}</span>`).join("");
    return `<article class="srCard">
      <div class="srCardTop"><span class="srNo">RULE ${escRuleText(x.no)}</span><span class="srGroup">${escRuleText(x.group||"Umum")}</span></div>
      <div class="srRule">${escRuleText(x.rule).replace(/\\n/g,"<br>")}</div>
      <div class="srMeta">${teams}${sanctions}${refs}</div>
    </article>`;
  }).join("");
  const notesHtml=SALES_RULES_NOTES.map((n,i)=>`<div class="srNote"><span>${i+1}</span><div>${escRuleText(n)}</div></div>`).join("");
  root.innerHTML=`<div class="salesRulesPage">
    <div class="srHeader toolPageHeaderCompat">
      <div class="srHeaderMain"><div class="srEyebrow">TOOLS • SOP</div><h1>Sales Rules & SOP</h1><p>Sales Rules — Updated Feb 2026</p></div>
      <button type="button" class="srHome" onclick="goHome()">Home</button>
    </div>
    <div class="srWrap">
      <div class="srNotice">🔎 <b>Cari aturan dengan cepat.</b> Ketik kata seperti <b>terminate</b>, <b>absensi</b>, <b>manipulasi</b>, <b>misselling</b>, atau nama grup.</div>
      <div class="srSearch"><span>⌕</span><input id="salesRulesSearch" value="${escRuleText(salesRulesQuery)}" placeholder="Cari Sales Rules & SOP..." oninput="salesRulesSearch(this.value)"></div>
      <div class="srFilters">${groups.map(g=>`<button class="srFilter ${salesRulesGroup===g?"active":""}" onclick="salesRulesFilter('${escRuleText(g).replace(/'/g,"\\'")}')">${escRuleText(g)}</button>`).join("")}</div>
      <div class="srResultBar"><strong>${filtered.length}</strong> aturan ditemukan <span>• Sumber: ID (Ver 3) 2026</span></div>
      <div class="srList">${cards||`<div class="srEmpty">Tidak ada aturan yang cocok dengan pencarianmu.</div>`}</div>
      <section class="srNotes"><div class="srNotesTitle">Catatan SOP dari file</div>${notesHtml}</section>
      ${toolCompletionFooter("sales-rules")}
    </div>
  </div>${nav()}`;
}

        ["BAB 21 — DOKUMEN KLAIM RAWAT INAP",`• Asli Formulir Pengajuan Klaim Asuransi dari Penanggung.

• Hasil pemeriksaan diagnostik, perincian obat-obatan beserta perincian biayanya.
• Dokumen lainnya yang diperlukan Penanggung.`],
        ["BAB 22 — SYARAT & KETENTUAN KLAIM",`• Perlindungan berakhir jika pelanggan/ahli waris telah disetujui klaim risiko meninggal dunia atau didiagnosis Cacat Tetap Total, mana yang terjadi lebih dahulu.
• Perlindungan tidak menanggung risiko perawatan Rumah Sakit berulang akibat kecelakaan atau penyakit yang sama (penyakit yang sebelumnya sudah ada pada tertanggung).
• Perlindungan cicilan hanya berlaku 1x untuk setiap lama perawatan inap.`],
        ["BAB 23 — TAHAPAN PENGAJUAN KLAIM",`1. Pelanggan login menggunakan nomor ID perlindungan dan nama.
2. Pelanggan memilih polis yang telah terdaftar di sistem.
3. Pelanggan memasukkan nomor telepon dan menerima kode OTP untuk verifikasi.
4. Pilih tipe klaim yang sesuai.
5. Pelanggan mengisi informasi data pribadi dan nomor rekening untuk pembayaran klaim.
6. Pelanggan mengisi informasi kronologis kejadian.
7. Pelanggan upload dokumen klaim yang dibutuhkan.
8. Jika pengajuan berhasil, terdapat Claim ID.
9. Pelanggan dapat mengecek detail status pengajuan dan SLA pada setiap tahapan klaim.
10. Jika pengajuan tidak disetujui atau terdapat kekurangan dokumen, pelanggan diberitahukan melalui email.`],
        ["BAB 24 — HAL YANG DIPERHATIKAN SEBELUM MENAWARKAN",`1. SA paham terkait produk perlindungan yang dijual: memahami manfaat, premi, pengecualian, skenario pembayaran klaim, serta siapa saja yang membutuhkan perlindungan cicilan.
2. Fokus ke manfaat perlindungan: jelaskan manfaat dengan bahasa mudah dimengerti dan kaitkan dengan situasi pelanggan.
3. Harga premi dibagi per hari dan disebutkan di akhir. Materi menekankan bahwa pelanggan perlu memahami risiko kerugian dan manfaat programnya.`],
        ["BAB 25 — CARA MENAWARKAN: KUATT",`K — Kenali Profil Pelanggan.
U — Ungkapkan Potensi Masalah.
A — Ajukan Solusi.
T — Tangani Keberatan.
T — Tutup Penjualan.`],
        ["BAB 26 — KENALI PROFIL PELANGGAN",`Tujuannya agar penawaran sesuai dengan kebutuhan pelanggan.

Cara mengetahui profil pelanggan:
1. Memerhatikan pelanggan — penampilan, cerita, pertanyaan, cara bicara, cara menyimpan smartphone, barang yang dipilih, DP yang dibayar, dan sebagainya.
2. Bertanya untuk mendapat informasi — tempat tinggal, aktivitas, hobi, kebiasaan, risiko, serta penggunaan laptop/smartphone.`],
        ["BAB 27 — UNGKAPKAN POTENSI MASALAH",`Sampaikan risiko yang bisa terjadi dan kaitkan dengan profil pelanggan, lalu ingatkan kerugian/biaya yang dapat muncul akibat risiko tersebut.

Contoh materi: mengaitkan risiko sakit atau kecelakaan dengan kemampuan membayar cicilan dan menjelaskan bahwa AkuJaga dapat menjadi solusi perlindungan cicilan. Materi juga mencontohkan pengalaman pelanggan yang relevan dan biaya tambahan yang dapat muncul ketika masuk rumah sakit.`],
        ["BAB 28 — AJUKAN SOLUSI",`Contoh penawaran dari materi:

“...Nah Ka, karena Kakak naik kendaraan umum berisiko untuk terjadinya risiko kecelakaan ketika berangkat kerja.. Di Akulaku ada loh perlindungan cicilan yang akan membayarkan cicilan Kakak, cicilan yang bisa dibayarkan bahkan bisa sampai 3x lho Ka.. Jadi, kalau sampai terjadi risiko Kakak masuk rumah sakit atau dirawat karena kecelakaan, Kakak bisa klaim dan nanti cicilannya dibayarkan…”`],
        ["BAB 29 — TUTUP PENJUALAN",`Contoh closing dari materi:

“Saya bantu proses pengajuannya dengan menambahkan perlindungan yang tadi saya jelaskan ya Ka…?”

Contoh naskah lengkap juga menekankan bahwa perlindungan bersifat pilihan, manfaatnya dijelaskan, biaya tambahan disebutkan, dan keputusan dikembalikan kepada pelanggan.`],
        ["BAB 30 — MISSELLING",`Mis-selling adalah tindakan yang salah oleh SA ketika menawarkan perlindungan tambahan. Mis-selling meliputi:
• SA tidak menjelaskan apapun kepada pelanggan tentang perlindungan tambahan dan memasukkan perlindungan tambahan ke kontrak tanpa sepengetahuan pelanggan.
• SA menambahkan perlindungan tambahan padahal pelanggan sudah menolak.
• SA menjelaskan kepada pelanggan jika perlindungan tambahan bersifat wajib.
• SA tidak menginformasikan keuntungan dari perlindungan tambahan.

Jika SA melakukan mis-selling, pelanggan kecewa dan melaporkan Akulaku/OJK, maka SA tidak mendapatkan bonus dan mendapatkan WL1.`],
        ["BAB 31 — MENANGANI KEBERATAN",`Keberatan pelanggan itu wajar dan merupakan proses menuju kesepakatan/closing.

Mindset keberatan pelanggan dapat muncul karena pelanggan belum percaya, belum mengetahui, belum yakin, atau membutuhkan informasi tambahan.

Metode DUIT:
D — Dengar.
U — Ulangi.
I — Ikat.
T — Tanggapi.

Keberatan tidak sama dengan penolakan.`],
        ["BAB 32 — CONTOH MENANGANI KEBERATAN",`Jika pelanggan tidak mau dijelaskan:
“Saya minta waktu hanya sebentar saja Bu. Ini sifatnya pilihan atau tidak wajib. Keputusan dikembalikan ke bapak/ibu. Perlindungan ini sangat bermanfaat buat Ibu, harganya juga sangat terjangkau hanya RpXX/hari. Jadi saya jelaskan dulu sebentar ya Bu.”

Jika pelanggan mengatakan tidak pernah mengalami kerusakan/risiko, materi mencontohkan respons yang tetap menghargai pengalaman pelanggan, menjelaskan bahwa perlindungan tidak wajib, lalu menerangkan manfaat dan biaya tambahannya.`],
        ["BAB 33 — KETENTUAN REFUND",`Pelanggan dapat melakukan refund jika:
1. Pelanggan komplain ke Akulaku karena SA tidak menjelaskan terkait tambahan perlindungan.
2. Terdapat pembatalan kontrak dari pihak merchant.
3. Hanya dapat dilakukan sebelum 30 hari dari tanggal pengajuan.
4. Proses refund hanya dapat dilakukan melalui CS Akulaku.
5. Refund hanya bisa dilakukan jika pelanggan belum mengajukan klaim ke pihak Cermati.`],
        ["BAB 34 — KEBIJAKAN REFUND",`• Periode refund dengan alasan apapun sebelum 30 hari dapat segera dilakukan.
• Pengajuan refund setelah 30 hari hanya dapat diproses jika Merchant menyetujui pengembalian dana/refund untuk produk utama yang dibeli. Di luar kondisi tersebut, pengajuan tidak dapat diproses.
• Cermati bertanggung jawab meninjau permintaan dan membatalkan polis.
• Customer Service Akulaku bertanggung jawab mengembalikan uang kepada pelanggan.

Pelanggan yang ingin mengajukan refund dapat diarahkan langsung menghubungi CS Akulaku:
• Call Center: 1500920
• Live Chat: di Aplikasi Akulaku
• WhatsApp: 0811-1912-0548 (Chatbot).

Pembatalan layanan Asuransi Movable All Risk hanya dapat dilakukan oleh Akulaku Finance Indonesia melalui konfirmasi tertulis kepada Cermati Protect sesuai materi.`]
      ]
    },
{
      id:"akusiaga",
      title:"AkuSiaga",
      quizAfter:true,
      desc:"Home Content Protection — informasi produk, cakupan perlindungan, klaim, proses aplikasi, script penawaran, dan insentif VAS.",
      icon:"🏠",
      slides:[
        ["BAB 1 — INFORMASI PRODUK AKUSIAGA",`AKUSIAGA (Home Content Protection) adalah produk perlindungan tambahan yang memberikan santunan atas risiko kehilangan atau kerusakan dari barang-barang isi rumah dan risiko kecelakaan diri tertanggung dari kejadian yang tidak diinginkan.`],
        ["BAB 2 — CAKUPAN PERLINDUNGAN",`Perlindungan isi rumah:
• Huru-hara dan kerusuhan.
• Pencurian/Kebongkaran.
• Kebakaran & Sambaran Petir.
• Bencana Alam.

Perluasan perlindungan untuk tertanggung:
• Kecelakaan Diri.
• Santunan Tempat Tinggal.`],
        ["BAB 3 — BIAYA & MANFAAT AKUSIAGA",`Harga Premi: Rp299.000.

Lama Perlindungan: 12 Bulan.

Biaya proteksi otomatis masuk dalam cicilan pelanggan.

Berlaku untuk semua komoditi.

Coverage Limit:
• Perlindungan isi rumah: berdasarkan tipe barang, hingga Rp35 juta.
• Kecelakaan Diri: berdasarkan limit pelanggan, hingga Rp35 juta.
• Santunan Tempat Tinggal: sesuai tagihan atau maksimal Rp2,5 juta.`],
        ["BAB 4 — DETAIL PENGGANTIAN BARANG",`Perlindungan isi rumah dibagi berdasarkan tipe barang:

Tipe A
Biaya pergantian: Rp1 juta per barang.

Tipe B
Biaya pergantian: Rp500 ribu per barang.

Tipe C
Biaya pergantian: Rp300 ribu per barang.`],
        ["BAB 5 — PERLINDUNGAN KECELAKAAN DIRI",`Cacat Tetap Total dapat diklaim jika tertanggung kehilangan fungsi bagian tubuh dan tidak dapat melakukan setidaknya 2 aktivitas yang dipersyaratkan dalam ketentuan.

Kondisi yang tercantum dalam materi meliputi:
• Kerusakan otak yang tidak dapat disembuhkan.
• Kelumpuhan yang tidak dapat disembuhkan dan bersifat tetap pada seluruh anggota gerak tubuh.
• Kehilangan penglihatan pada kedua mata.
• Kehilangan pendengaran pada kedua telinga.
• Kehilangan atau tidak berfungsinya tangan, lengan, tungkai kaki, atau gabungan salah satunya secara tetap.

Cacat tetap total tersebut harus terjadi paling lambat 6 bulan setelah tanggal diagnosa ditegakkan.`],
        ["BAB 6 — CACAT TOTAL SEBAGIAN",`Uraian manfaat yang tercantum dalam materi:
• Kehilangan satu ibu jari tangan kanan/kiri — 20%.
• Kehilangan satu telunjuk tangan kanan/kiri — 15%.
• Kehilangan satu jari tangan lainnya — 10%.
• Kehilangan satu lengan atas kanan/kiri — 50%.
• Kehilangan satu lengan bawah kanan/kiri — 40%.
• Kehilangan satu kaki atas kanan/kiri — 50%.
• Kehilangan satu kaki bawah kanan/kiri — 40%.
• Kehilangan penglihatan satu mata — 50%.
• Kehilangan pendengaran satu telinga — 20%.
• Kehilangan pendengaran kedua telinga — 50%.
• Kehilangan satu ibu jari kaki kanan/kiri — 10%.
• Kehilangan satu jari kaki lainnya — 5%.`],
        ["BAB 7 — INFORMASI KLAIM",`Informasi wajib untuk klaim:
• KTP.
• Nomor Polis.

Data pelanggan:
• Nama lengkap.
• Email.
• Nomor handphone.

Informasi kejadian:
• Tanggal kejadian.
• Kronologi.

Tipe klaim yang dapat diajukan:
• Perlindungan isi rumah.
• Kecelakaan pribadi.
• Kompensasi tempat tinggal sementara.

Pelanggan bisa mengajukan klaim secara berulang dan bisa mengajukan 2 tipe klaim sekaligus selama limit tersedia.`],
        ["BAB 8 — DOKUMEN KLAIM: PERLINDUNGAN ISI RUMAH",`• Foto tampak depan dan kondisi terakhir rumah tertanggung sesuai alamat yang didaftarkan untuk klaim bencana alam dan kebakaran.
• Foto setiap barang yang mengalami rusak dan area sekitarnya.
• Surat keterangan dari RT/RW yang menyatakan kerugian yang dijamin untuk risiko selain kerusuhan, pemogokan, huru-hara, penjarahan saat kerusuhan, dan pencurian/perampokan.
• Surat keterangan dari Kepolisian khusus untuk kerusuhan, pemogokan, huru-hara, penjarahan saat kerusuhan, dan pencurian/perampokan.
• Bukti pengrusakan atau kekerasan fisik khusus untuk pencurian/perampokan.`],
        ["BAB 9 — DOKUMEN KLAIM: KECELAKAAN DIRI",`• Surat Keterangan Kematian dari Aparat Setempat (RT/RW/Kelurahan/Kepolisian).
• Surat keterangan kecelakaan dari Aparat.
• Akta Kematian jika tertanggung meninggal dunia atau Surat Pemeriksaan (Visum) dari Dokter jika tertanggung cacat tetap.
• Bukti Ahli Waris dari Penerima Manfaat (KTP dan KK) atau Surat dari Pengadilan.`],
        ["BAB 10 — DOKUMEN KLAIM: TEMPAT TINGGAL SEMENTARA",`• Surat keterangan tempat tinggal tidak dapat ditempati oleh RT/RW setempat.
• Foto kondisi rumah terkait yang masih dalam perbaikan atau tidak dapat ditempati sementara.
• Invoice tempat menginap atau tempat tinggal sementara.
• Foto tertanggung pada tempat menginap atau tempat tinggal sementara.`],
        ["BAB 11 — PROSES KLAIM",`Alur proses klaim:

1. Pelaporan
Melalui email atau klaim portal Cermati. Maksimal 14 hari kalender dari terjadinya risiko.

2. Pengajuan Dokumen Klaim
Upload dokumen softcopy yang diperlukan. Maksimal 30 hari kalender dari hari pelaporan.

3. Proses Review & Hasil Klaim
Penilaian dari partner asuransi, termasuk pengecekan dokumen dari team Cermati. Maksimal 7 hari kerja dari dokumen lengkap diterima.

4. Pembayaran
Proses dilanjutkan setelah hasil pengajuan klaim disetujui. Maksimal 3 hari kerja dari tanggal klaim disetujui atau biaya yang disepakati.`],
        ["BAB 12 — SCRIPT MENAWARKAN AKUSIAGA",`“Hi kak, saya informasikan kembali terkait pembiayaan barang x dengan harga Rp.xxx tenor 12 bulan, dan promo gratis cicilan 1x. Cicilan ini sudah termasuk dengan perlindungan isi rumah, apabila terjadi risiko bencana alam, kebongkaran dan kejadian tidak diinginkan lainnya, kakak bisa mendapatkan manfaat hingga 30 Juta rupiah, santunan kecelakaan diri dan santunan tempat tinggal sementara jika rumahnya tidak bisa ditempati, cara klaimnya gampang kak tinggal hubungi ke Cermati ya.”

Pastikan kamu menginformasikan:
• Informasi perlindungan.
• Biaya tambahan.
• Manfaat perlindungan.
• Lama perlindungan.`],
        ["BAB 13 — PROSES PENGISIAN APLIKASI AKUSIAGA",`Urutan proses:
1. SA membuat QR Code.
2. Penilaian risiko pelanggan.
3. Pilih toko.
4. Masukkan informasi barang.
5. Masukkan nominal harga barang.
6. Pilih proteksi AkuSiaga.
7. Pelanggan scan QR Code SA.
8. Pelanggan mendapatkan limit.
9. Pelanggan memilih tenor cicilan.
10. Pelanggan memasukkan alamat domisili.
11. Pelanggan konfirmasi bayar.

Pada proses aplikasi:
• Harga premi AkuSiaga otomatis muncul.
• Pastikan pelanggan memasukkan alamat domisili yang benar untuk alamat rumah yang dilindungi.
• Tidak ada perubahan proses aplikasi lainnya.`],
        ["BAB 14 — ALAMAT YANG DILINDUNGI",`Setelah SA mengisi informasi barang, pilih perlindungan AkuSiaga.

Pilih T&C untuk menjelaskan informasi produk kepada pelanggan.

Pada aplikasi pelanggan, setelah pelanggan mengisi data, pada bagian konfirmasi pembayaran terdapat informasi AkuSiaga. Pelanggan akan diminta memasukkan alamat yang akan dilindungi oleh AkuSiaga.

Pastikan pelanggan menginput alamat dengan benar.

Alamat yang dilindungi adalah alamat domisili yang ditempati oleh pelanggan / rumah milik pelanggan.`],
        ["BAB 15 — INSENTIF VAS",`Insentif Sales Agent: 4% dari total premi yang berhasil SA jual.

BOM BONUS: Rp400rb.

SA harus mencapai minimal penetrasi dan minimal transaksi VAS untuk mendapatkan BOM Bonus.

Minimal transaksi:
• AkuJaga: 15.
• Gadget Protection: 15.
• AkuSiaga: 10.

Minimal penetrasi: 230%.`],
        ["BAB 16 — CONTOH PERHITUNGAN INSENTIF",`Contoh 1:
• Gadget: kontrak eligible 15, total Gadget Protection 15 → penetrasi 100%.
• AkuJaga: kontrak eligible 20, total AkuJaga 20 → penetrasi 100%.
• AkuSiaga: kontrak eligible 20, total AkuSiaga 10 → penetrasi 50%.
• Total penetrasi 250%.
• Total premi SA Rp10.000.000.
• Insentif SA Rp400.000.
• BOM Bonus Rp400.000.

Contoh 2:
• Gadget: kontrak eligible 10, total Gadget Protection 8 → penetrasi 80%.
• AkuJaga: kontrak eligible 20, total AkuJaga 15 → penetrasi 75%.
• AkuSiaga: kontrak eligible 20, total AkuSiaga 17 → penetrasi 85%.
• Total penetrasi 240%.
• Total premi SA Rp9.000.000.
• Insentif SA Rp360.000.
• BOM Bonus tidak didapat karena tidak mencapai minimal transaksi total Gadget Protection, walaupun mencapai minimal penetrasi.`]
      ]
    },
{
      id:"home-service",
      title:"Home Service",
      quizAfter:true,
      desc:"Ketentuan, flow transaksi, standar foto, G-Form, dan deviasi Home Service.",
      icon:"🏠",
      slides:[
        ["Apa Itu Home Service?",`Home Service adalah proses transaksi di luar toko >500m dari toko (selain toko pameran).\n\nKetentuan utama:\n\n• Hanya berlaku untuk toko yang difasilitasi oleh SA.\n• Wajib lapor kepada ASL jika ada transaksi COD dan share live location.\n• Wajib bertemu dengan pelanggan saat transaksi untuk scan barcode.\n• Setelah transaksi berhasil dan barang diterima user, SA wajib mendokumentasikan foto dengan ketentuan SA + user + produk dalam 1 frame.\n• Wajib mengisi G-Form.`],
        ["Ketentuan & Larangan",`Hal yang diperbolehkan:\n• Transaksi pada toko yang difasilitasi SA.\n• Lapor kepada ASL dan share live location untuk transaksi COD.\n• Bertemu pelanggan saat transaksi.\n• Dokumentasi foto sesuai standar.\n• Membuat laporan pada G-Form.\n\nHal yang tidak diperbolehkan:\n• Pihak mitra/toko yang tidak difasilitasi SA.\n• Manipulasi data/foto.\n• Tidak ada konfirmasi ke atasan/ASL.\n• Transaksi dengan cara sharing barcode.\n• Membawa barang toko tanpa didampingi orang toko.\n• SA menerima uang DP (jika ada).\n• Tidak mendokumentasikan transaksi di luar toko sesuai standar.\n• Tidak membuat laporan di G-Form.`],
        ["Flow Home Service",`1. Adanya permintaan COD menggunakan Akulaku.\n2. SA Akulaku bersama pihak toko datang menemui pelanggan dengan membawa barang yang akan dibeli.\n3. Melakukan transaksi yang dibantu oleh SA Akulaku.\n\nJika ditolak:\n• Pihak toko membawa kembali barangnya.\n\nJika disetujui:\n• Pihak toko menyerahkan barang kepada user.\n• SA melakukan swafoto bersama user beserta barang yang sudah diserahkan.\n• SA membuat laporan pada G-Form.`],
        ["Standar Foto yang Wajib",`Foto harus jelas dan tidak blur.\n\n• Gunakan GPS Camera supaya terlihat titik koordinat lokasi.\n• SA melakukan swafoto bersama user dan barang yang diserahkan dalam 1 frame yang sama.\n• Wajah user dan SA harus terlihat jelas pada kamera.\n• Tidak menggunakan masker.\n\nTidak diperbolehkan:\n• Foto tanpa GPS Camera.\n• Wajah tidak jelas, terpotong, ditutup emoji, atau tertutup produk.\n• User pada foto tidak sesuai dengan user saat pengajuan aplikasi.\n• Tidak ada foto user maupun SA.\n• Hanya foto produk.\n• User tidak memegang barang dan box.\n• Foto direkayasa atau diedit.`],
        ["G-Form & Deviasi",`Data penting yang perlu disiapkan untuk G-Form:\n• Email dan nama SA.\n• Nama Merchant, nama toko, dan ID toko.\n• Nama ASL.\n• Nama lengkap pelanggan sesuai KTP, NIK, dan nomor WA yang wajib aktif.\n• Tanggal transaksi COD dan alamat lengkap COD.\n• Order ID / No Pembayaran Diterima (19 digit).\n• Spesifikasi produk.\n• Upload foto sesuai ketentuan.\n\nProduk untuk keluarga:\n• Barang harus diperuntukkan bagi keluarga yang masih dalam 1 Kartu Keluarga (KK) yang sama dengan user.\n• Gunakan G-Form KK sesuai ketentuan.\n\nJika tipe HP tidak ada di list aplikasi SA/Mitra Akulaku:\n• Laporkan pada group Akulaku.\n• Ikuti prosedur penambahan tipe sesuai arahan pada materi.`]
      ]
    },
{
      id:"repayment-reminder",
      title:"Repayment Reminder & Due Date",
      quizAfter:true,
      desc:"Pengingat pembayaran, konsekuensi keterlambatan, regulasi follow-up, tahapan komunikasi, dan bukti follow-up.",
      icon:"🔔",
      slides:[
        ["Mengapa SA Wajib Mengingatkan Pembayaran?",`• Agar SA tidak terkena potongan.\n• Supaya pelanggan masih bisa mengajukan kembali.\n• Supaya hasil scoring BI checking bagus.\n• Supaya pelanggan tidak kesulitan jika mengambil pembiayaan lain.`],
        ["Akibat Jika Tidak Bayar Tepat Waktu",`SA perlu menjelaskan kepada pelanggan:\n• Denda keterlambatan (denda mulai dari hari pertama, 6% setiap bulannya).\n• Penagihan oleh tim Collection Akulaku.\n• Catatan kredit pelanggan di BI/OJK menjadi buruk dan sulit mendapat pembiayaan dari Akulaku.\n• Konsekuensi legal yang dapat berlanjut ke ranah hukum.\n• Jelaskan informasi pembayaran cicilan: waktu pembayaran, saluran, dan cara pembayaran.`],
        ["Regulasi Follow-up Pembayaran",`• Follow-up hanya melalui telepon/WA/SMS — tidak boleh kunjungan langsung ke rumah.\n• Menghubungi pelanggan pukul 08.00–20.00 waktu setempat, Senin–Sabtu.\n• Tidak diperbolehkan menghubungi pada hari Minggu.\n• Pelanggan yang sama maksimal 3x dalam sehari.\n• Gunakan kalimat yang sopan dan tutur bahasa yang baik.\n• Tanyakan PTP (Promise to Pay) / Tanggal Janji Bayar.\n• WAJIB upload bukti percakapan / WhatsApp setelah menghubungi atau chat pelanggan.`],
        ["Tahapan Menghubungi Pelanggan",`1. Beri salam & perkenalan diri.\n2. Konfirmasi pelanggan.\n3. Minta waktu.\n4. Ingatkan pembayaran, denda, dan cara bayar.\n5. Tanyakan janji bayar.\n6. Penutup.`],
        ["Update Bukti Follow-up Pelanggan",`Setelah SA menghubungi atau melakukan chat dengan pelanggan:\n\n• WAJIB upload bukti percakapan / WhatsApp sebagai bukti follow-up.\n• Bukti harus menunjukkan bahwa SA sudah menghubungi pelanggan terkait pembayaran.\n• Upload bukti setelah follow-up dilakukan.`]
      ]
    },
{
      id:"skema-benefit",
      title:"Skema Benefit & Insentif",
      quizAfter:true,
      desc:"Daily Fee, Target Vintage, Allowance, Insentif Coefisien, Sales Coefisien, Extra Bonus & Potongan Risk",
      icon:"💼",
      slides:[
        ["Daily Fee",`Jawa: Rp130.000 per hari.\n\nOuter Jawa: Rp120.000 per hari.\n\nMulai 1 Agustus: Daily fee dibayarkan penuh, tanpa harus capai 100Juta.\n\nKetentuan Daily Fee\n\n- Tambahan Rp250.000 jika total kehadiran =>26 hari, min Ach 85% dan task ticket 100%.\n- Potongan 25 ribu jika terlambat: 25,000 x 3 = 75,000.\n- Terlambat >3x tambahan potongan 300ribu.\n- Contoh : terlambat 4x : 25,000 x 4 + 300,000 = 400,000.\n\nPembayaran Insentif\n\nInsentif dibayarkan bersama daily fee di bulan berjalan.`],

/* V9.32 — Step-by-Step Curriculum
   Semua materi utama (kecuali SA Activities, Khusus M3+, dan Kalkulator) disusun
   menjadi 3 tahap yang benar-benar mewakili:
   1) Pelajari  2) Pahami  3) Contoh & Penerapan.
   Konten asli tidak dihapus; setiap slide lama dimasukkan sebagai subbagian.
*/
(function applyStepByStepCurriculum(){
  const excluded=new Set(["sa-activities","m3plus","kalkulator-insentif","sales-rules"]);
  const groups={
    "gadget":[[0,1],[2,3],[4,5]],
    "akujaga":[[0,1],[2,3],[4,5]],
    "akusiaga":[[0,1],[2,3],[4,5]],
    "home-service":[[0,1],[2,3],[4]],
    "repayment-reminder":[[0,1],[2,3],[4]],
    "skema-benefit":[[0,1],[2,3,4],[5,6]],
    "akutipper":[[0,1],[2,3],[4]],
    "asuransi-kecelakaan":[[0],[1],[2]],
    "cara-menjual-cicilan":[[0,1],[2,3],[4,5]]
  };
  const phaseTitles=[
    "1. Pelajari — Dasar & Manfaat",
    "2. Pahami — Ketentuan & Proses",
    "3. Contoh & Penerapan — Yang Perlu Dilakukan SA"
  ];
  function buildPhase(m, indexes, phase){
    const parts=[];
    indexes.forEach(i=>{
      const s=m.slides[i];
      if(!s)return;
      parts.push(`## ${s[0]}\n${String(s[1]||"").trim()}`);
    });
    return [phaseTitles[phase],parts.join("\n\n")];
  }
  DB.modules.forEach(m=>{
    if(excluded.has(m.id) || m.__stepByStep)return;
    const g=groups[m.id];
    if(!g)return;
    const original=m.slides.slice();
    m.slides=g.map((idxs,phase)=>{
      const valid=idxs.filter(i=>i<original.length);
      const temp={slides:original};
      return buildPhase(temp,valid,phase);
    });
    m.__stepByStep=true;
  });
})();

async function hydrateCloudSnapshot(id){
  try{const rows=await window.SA_SUPABASE.request('/rest/v1/sa_sync_progress?select=id_sa,payload,updated_at&id_sa=eq.'+encodeURIComponent(String(id))+'&limit=1',{method:'GET'});const row=Array.isArray(rows)?rows[0]:null;if(!row?.payload)return false;const cloud=row.payload,local=loadProgress();const ct=Number(cloud.updatedAt?new Date(cloud.updatedAt).getTime():new Date(row.updated_at||0).getTime()),lt=Number(local.__cloudUpdatedAt||local.__updatedAt||0);if(lt>ct){setTimeout(()=>window.syncSAActivityToCloud?.(true),0);return false;}localStorage.setItem(key(),JSON.stringify({read:Object.assign({},local.read||{},cloud.readMap||{}),passed:Object.assign({},local.passed||{},cloud.passedMap||{}),scores:Object.assign({},local.scores||{},cloud.scores||{}),history:Object.assign({},local.history||{},cloud.quizHistory||{}),quizSessions:Object.assign({},local.quizSessions||{},cloud.quizSessions||{}),__cloudUpdatedAt:ct||Date.now(),__updatedAt:ct||Date.now()}));if(cloud.runrate){let rr={};try{rr=JSON.parse(localStorage.getItem('dailyGMVTargetData')||'{}')}catch(e){};rr[String(id)]=Object.assign({},rr[String(id)]||{},cloud.runrate);localStorage.setItem('dailyGMVTargetData',JSON.stringify(rr));}return true;}catch(e){console.warn('[SA CLOUD HYDRATE]',e);return false}
}

function syncQuizToAdmin(){
  try{
    if(!state.user||!state.user.id) return;
    const p=loadProgress();
    const scores=p.scores||{}, passed=p.passed||{}, history=p.history||{};
    const results={};
    Object.keys(scores).forEach(k=>{results[k]={score:Number(scores[k])||0,passed:!!passed[k]};});
    const quizCount=Object.keys(results).length;
    const vals=Object.values(scores).map(Number).filter(v=>v>0);
    const avg=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0;
    let activity={};
    try{activity=JSON.parse(localStorage.getItem("sa_login_activity_v2")||"{}")||{};}catch(e){}
    const existing=activity[state.user.id]||{};

      name:state.user.name||existing.name||String(state.user.id),
      lastLogin:existing.lastLogin||new Date().toISOString(),
      progress:completedCount?Math.round((completedCount()/DB.modules.length)*100):0,
      score:avg,
      quizCount:quizCount,
      quizResults:results,
      completedModules:Object.keys(passed).filter(k=>passed[k]),
      quizHistory:history,
      scores:Object.fromEntries(Object.keys(scores).map(k=>[k,Number(scores[k])||0])),
      passedMap:Object.fromEntries(Object.keys(passed).map(k=>[k,!!passed[k]])),
      runrate:(()=>{try{const rr=JSON.parse(localStorage.getItem("dailyGMVTargetData")||"{}")||{};return rr[String(state.user.id)]||{}}catch(e){return {}}})(),

function saveProgress(p){
  try{
    const existing=loadProgress();
    p=p&&typeof p==='object'?p:{};
    p.read=Object.assign({},existing.read||{},p.read||{});
    p.passed=Object.assign({},existing.passed||{},p.passed||{});
    p.scores=Object.assign({},existing.scores||{},p.scores||{});
    const eh=existing.history||{}, nh=p.history||{}, mergedH=Object.assign({},eh);
    Object.keys(nh).forEach(k=>{
      const a=Array.isArray(eh[k])?eh[k]:[], b=Array.isArray(nh[k])?nh[k]:[];
      const seen=new Set(a.map(v=>JSON.stringify(v))); mergedH[k]=a.concat(b.filter(v=>{const z=JSON.stringify(v);if(seen.has(z))return false;seen.add(z);return true;}));
    });
    p.history=mergedH;
    p.__updatedAt=Math.max(Number(existing.__updatedAt)||0,Date.now());
    p.__cloudUpdatedAt=p.__updatedAt;
  }catch(e){}
  localStorage.setItem(key(),JSON.stringify(p));
  syncQuizToAdmin();
  setTimeout(()=>window.syncSAActivityToCloud?.(true),0);
}

function showSavedQuizResult(id){
  const m=DB.modules.find(x=>x.id===id);
  const p=progress();
  if(!m)return;
  const history=(p.history&&p.history[id])||[];
  const last=history.length?history[history.length-1]:null;
  if(!last){alert("Kuis materi ini belum dikerjakan.");return;}
  state.module=m;
  state.lastScore=Number(last.score||0);
  state.currentAnswers=Array.isArray(last.answers)?last.answers:[];
  state.currentCorrect=Number(last.correct||0);
  state.currentWrong=Number(last.wrong||0);
  state.currentIsRemedial=!!last.isRemedial;
  state.screen="results";
  render();
}
function showQuizDetail(){
  if(typeof window.requireRunrateBeforeStudy==="function" && window.requireRunrateBeforeStudy()) return;
  const p=progress();
  const mods=DB.modules.filter(m=>quizFor(m.id).length);
  const rows=mods.map(m=>{
    const score=Number((p.scores||{})[m.id]||0);
    const wrong=(p.wrong||{})[m.id]||[];
    const done=!!((p.passed||{})[m.id]);
    const h=(p.history&&p.history[m.id])||[];
    const attempted=h.length>0 || done || score>0;
    let status=done?`<span class="phStatus done">🟢 Lulus</span>`:attempted?`<span class="phStatus warn">🔴 Perlu ditingkatkan</span>`:`<span class="phStatus todo">⚪ Belum dikerjakan</span>`;
    const scoreText=attempted?`Nilai ${score}/100 • ${wrong.length} soal kurang tepat`:"Belum mengerjakan kuis";
    return `<div class="quizDetailCard">
      <div class="quizDetailHead"><div class="quizDetailTitle">${esc(m.title)}</div>${status}</div>
      <div class="quizDetailMeta">${scoreText}</div>
      ${attempted?`<button type="button" class="quizAction" onclick="showSavedQuizResult('${m.id}')">Lihat Kuis</button>`:""}
      <button type="button" class="quizAction alt" onclick="openModule('${m.id}',false)">Pelajari Lagi</button>
    </div>`;
  }).join("");
  const scored=mods.map(m=>Number((p.scores||{})[m.id]||0)).filter(v=>v>0);
  const avg=scored.length?Math.round(scored.reduce((a,b)=>a+b,0)/scored.length):0;
  const weak=mods.filter(m=>Number((p.scores||{})[m.id]||0)>0 && Number((p.scores||{})[m.id]||0)<80);
  root.innerHTML=`<div style="min-height:100vh;background:#f5f7fb;padding:24px;box-sizing:border-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:8px">
      <button type="button" onclick="goHome()" style="border:0;border-radius:12px;padding:10px 14px;background:#fff">← Kembali</button>
      <b style="font-size:20px">Nilai Pemahaman</b>
      <button type="button" onclick="goHome()" style="border:0;border-radius:12px;padding:10px 14px;background:#fff">Home</button>
    </div>
    <div class="phContinue" style="margin-top:0">
      <div class="phContinueLabel">RINGKASAN PEMAHAMAN</div>
      <div class="phContinueTitle">${avg}% Rata-rata nilai kuis</div>
      <div class="small">${weak.length?`⚠️ ${weak.length} materi perlu dipelajari ulang.`:"✅ Belum ada materi yang perlu ditingkatkan."}</div>
    </div>
    ${rows || '<div style="background:#fff;padding:18px;border-radius:14px">Belum ada kuis.</div>'}
  </div>`;
}

function getWelcomeGreeting(){
  const h=Number(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Jakarta',hour:'numeric',hour12:false}).format(new Date()));
  if(h>=5&&h<11)return 'Good Morning,';
  if(h>=11&&h<15)return 'Good Afternoon,';
  if(h>=15&&h<19)return 'Good Evening,';
  return 'Good Night,';
}

function currentScrollY(){
  try{return Math.max(0,Number(window.scrollY||window.pageYOffset||document.documentElement.scrollTop||document.body.scrollTop||0));}catch(e){return 0;}
}
function scrollPageTop(){
  const topNow=()=>{
    try{
      window.scrollTo(0,0);
      document.documentElement.scrollTop=0;
      document.body.scrollTop=0;
    }catch(e){}
    // Reset every possible internal scroll container too.
    try{
      document.querySelectorAll("*").forEach(el=>{
        if(el.scrollTop>0) el.scrollTop=0;
        if(el.scrollLeft>0) el.scrollLeft=0;
      });
    }catch(e){}
    try{
      const app=document.getElementById("app")||document.getElementById("root");
      if(app){app.scrollTop=0;app.scrollLeft=0;app.scrollTo(0,0);}
    }catch(e){}
  };
  topNow();
  requestAnimationFrame(topNow);
  setTimeout(topNow,0);
  setTimeout(topNow,50);
  setTimeout(topNow,150);
  setTimeout(topNow,300);
}
function scrollPageTo(y){
  const target=Math.max(0,Number(y)||0);
  const go=()=>{
    try{window.scrollTo({top:target,left:0,behavior:"auto"});}catch(e){}
    try{document.documentElement.scrollTop=target;}catch(e){}
    try{document.body.scrollTop=target;}catch(e){}
    try{const app=document.getElementById("app")||document.getElementById("root");if(app&&app.scrollHeight>app.clientHeight)app.scrollTop=target;}catch(e){}
  };
  go();requestAnimationFrame(go);setTimeout(go,30);setTimeout(go,120);
}
function goHome(){state.screen="home";state.module=null;render();setTimeout(scrollPageTop,0);}
// Tombol HOME di dalam halaman: tetap di halaman yang sedang dibuka,
// hanya mengembalikan scroll ke paling atas. Tidak pindah ke menu utama.
function homeHere(){scrollPageTop();return false;}
function setReturnContext(section){

function returnToMenu(){
  const y=Number(state.returnScrollY||0);
  state.screen="home";state.module=null;
  render();
  setTimeout(()=>{
    if(y>0){scrollPageTo(y);return;}
    const id=state.returnSection==="tools"?"phToolsSection":"phMaterialsSection";
    const el=document.getElementById(id);
    if(el){try{scrollPageTo(el.getBoundingClientRect().top+currentScrollY()-12);}catch(e){scrollPageTop();}}
    else scrollPageTop();
  },0);
}
function renderAndScrollTop(){
  try{if("scrollRestoration" in history)history.scrollRestoration="manual";}catch(e){}
  scrollPageTop();
  render();
  // Halaman baru selalu dibuka dari posisi paling atas.
  scrollPageTop();
  requestAnimationFrame(()=>scrollPageTop());
  setTimeout(()=>scrollPageTop(),80);
}

  if(!quizOnly){

}

function renderCalculator(){
  const money=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Math.max(0,n||0));
  const calc=()=>{
    const vas=Number(String(document.getElementById("calcVas")?.value||"").replace(/\./g,"").replace(/[^0-9]/g,""));
    const non=Number(String(document.getElementById("calcNon")?.value||"").replace(/\./g,"").replace(/[^0-9]/g,""));
    const target=Number(String(document.getElementById("calcTarget")?.value||"").replace(/\./g,"").replace(/[^0-9]/g,""));
    const total=vas+non;

    let icV=.010,icN=.003,tier="<60 Juta";
    if(total>=200000000){icV=.021;icN=.0105;tier="≥ 200 Juta";}
    else if(total>=120000000){icV=.017;icN=.006;tier="120–<200 Juta";}
    else if(total>=60000000){icV=.012;icN=.0036;tier="60–<120 Juta";}

    // Sales Coefficient otomatis berdasarkan pencapaian terhadap Target GMV.
    const achievement=target>0?(total/target)*100:null;
    let sc=null;
    if(achievement!==null){
      if(achievement<60) sc=0;
      else if(achievement<85) sc=.6;
      else if(achievement<100) sc=.8;
      else if(achievement<130) sc=1;
      else sc=1.1;
    }

    const gross=sc===null?null:(vas*icV+non*icN)*sc;

    document.getElementById("calcTotal").textContent=money(total);

function renderLesson(){
  const m=state.module,p=progress();

  const cover='';
  const escText=v=>String(v??'');
  function renderText(text){
    let lines=escText(text).replace(/\r/g,'').split('\n'),out=[],table=[];
    const flushTable=()=>{
      if(!table.length)return;
      const rows=table.map(r=>r.split('|').map(x=>x.trim()));
      const head=rows.shift()||[];
      out.push(`<div class="materialTableWrap"><table class="materialTable"><thead><tr>${head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
      table=[];
    };
    lines.forEach(line=>{
      const t=line.trim();
      if(!t){ flushTable(); return; }
      if(t.includes('|') && !/^https?:\/\//i.test(t)){ table.push(t); return; }
      flushTable();
      const imageMatch=t.match(/^\[\[SA_IMAGE\|([^\]]+)\]\]$/);
      if(imageMatch && /^data:image\//i.test(imageMatch[1])){
        out.push(`<div class="materialImage"><img src="${esc(imageMatch[1])}" alt="Gambar materi"></div>`); return;
      }
      if(/^#{2,3}\s+/.test(t)) out.push(`<div class="materialSubhead">${esc(t.replace(/^#{2,3}\s+/,''))}</div>`);
      else if(/^[-•]\s*/.test(t)) out.push(`<div class="materialBullet"><span>•</span><div>${esc(t.replace(/^[-•]\s*/,''))}</div></div>`);
      else if(/^\d+[.)]\s+/.test(t)) out.push(`<div class="materialNumber"><b>${esc((t.match(/^\d+[.)]/)||[''])[0])}</b><span>${esc(t.replace(/^\d+[.)]\s*/,''))}</span></div>`);
      else if(/^[A-Z][A-Z\s&/()-]+$/.test(t) && t.length>3) out.push(`<div class="materialSubhead">${esc(t)}</div>`);
      else out.push(`<div class="materialParagraph">${esc(t)}</div>`);
    });
    flushTable();
    return out.join('');

function shuffle(arr){
  let a=[...arr];
  for(let i=a.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

(function(){

  const STORE="sa_login_activity_v2";
  function saveLogin(id,name){
    id=String(id||"").trim(); name=String(name||"").trim();
    if(!id || id==="ADMIN110597") return;
    try{
      const x=JSON.parse(localStorage.getItem(STORE)||"{}");
      x[id]={id:id,name:name||id,lastLogin:new Date().toISOString(),active:true};
      localStorage.setItem(STORE,JSON.stringify(x));
    }catch(e){}
  }
  function getText(el){
    return el ? String(el.value||el.textContent||"").trim() : "";
  }
  function tryRecord(){
    // Common login input selectors in this app.
    const inputs=[...document.querySelectorAll("input")];
    const vals=inputs.map(x=>getText(x)).filter(Boolean);
    const idEl=inputs.find(x=>/id|employee|nik|user/i.test((x.placeholder||"")+" "+(x.name||"")+" "+(x.id||"")));
    const id=getText(idEl) || vals.find(v=>/^\d{3,}$/.test(v));
    const nameEl=inputs.find(x=>/nama|name/i.test((x.placeholder||"")+" "+(x.name||"")+" "+(x.id||"")));
    const name=getText(nameEl);
    if(id && /^\d{3,}$/.test(id)) saveLogin(id,name);
  }
  // Record immediately when login button is clicked; then retry after app state changes.
  document.addEventListener("click",function(e){
    const b=e.target.closest("button,[role=button]");
    if(!b) return;
    const txt=(b.textContent||"").trim().toLowerCase();
    if(/login|masuk/.test(txt)){
      setTimeout(tryRecord,80);
      setTimeout(tryRecord,500);
      setTimeout(tryRecord,1200);
    }
  },true);

  // If the app stores current user in common globals, record it whenever available.
  setInterval(function(){
    try{
      const candidates=[
        window.currentUser,window.loggedInUser,window.currentUserId,
        window.loggedInUserId,window.userId
      ];
      for(const c of candidates){
        if(typeof c==="object" && c){
          const id=c.id||c.userId||c.employeeId||c.nik;
          const name=c.name||c.userName||c.nama;
          if(id) { saveLogin(id,name); break; }
        } else if(typeof c==="string" && /^\d{3,}$/.test(c)){
          saveLogin(c,window.currentUserName||window.userName||"");
          break;
        }
      }
    }catch(e){}
  },1000);

  window.recordSALogin=saveLogin;
})();
</script>

<script id="runratePencapaianLogic">
(function(){
  function today(){
    const d=new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function money(n){
    return n==null ? "—" : "Rp"+Number(n).toLocaleString("id-ID");
  }
  function getData(){
    try{
      const u=(typeof state!=="undefined"&&state.user)?state.user:null;
      if(!u)return null;
      const db=JSON.parse(localStorage.getItem("dailyGMVTargetData")||"{}")||{};
      const bySA=db[String(u.id)]||{};
      const dkey=today();
      return bySA[dkey]||null;
    }catch(e){return null}
  }
  function calc(){
    const d=getData();
    if(!d)return {target:null,acv:null,ach:null,rr:null,rrp:null,date:""};
    const target=Number(d.target)||0, acv=Number(d.gmv)||0;
    const dt=new Date((d.date||today())+"T12:00:00");
    const day=dt.getDate(), days=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();
    const ach=target?acv/target*100:0;
    const rr=day?acv/day*days:0;
    const rrp=target?rr/target*100:0;
    return {target,acv,ach,rr,rrp,date:d.date||today()};
  }
  function render(){
 const d=calc(),el=document.getElementById("runratePencapaianCard");if(!el)return;
 const f=n=>n==null?"—":Number(n).toLocaleString("id-ID",{minimumFractionDigits:2,maximumFractionDigits:2})+"%";

  if(el.innerHTML!==html) el.innerHTML=html;

 const html=`<div class="runrateHead"><div class="runrateTitle">🎯 PENCAPAIAN</div><button type="button" onclick="event.stopPropagation();openRunrateManual()" style="border:0;background:#f3f4f7;color:#596273;border-radius:8px;padding:5px 8px;font-size:8px;font-weight:800">Update</button></div><div class="runrateDate">Tanggal: ${dateLabel}</div><div class="runrateGrid"><div class="runrateItem"><div class="runrateLabel">TARGET</div><div class="runrateValue">${money(d.target)}</div></div><div class="runrateItem"><div class="runrateLabel">ACHIEVEMENT</div><div class="runrateValue">${money(d.acv)}</div></div><div class="runrateItem"><div class="runrateLabel">ACHIEVEMENT %</div><div class="runrateValue ${statusClass(d.ach)}">${f(d.ach)}</div></div><div class="runrateItem"><div class="runrateLabel">RUNRATE</div><div class="runrateValue">${money(d.rr)}</div></div><div class="runrateItem highlight"><div class="runrateLabel">RUNRATE %</div><div class="runrateValue ${statusClass(d.rrp)}">${f(d.rrp)}</div></div></div>`;
 if(el.innerHTML!==html) el.innerHTML=html;
}
  window.renderRunratePencapaian=render;
  const old=window.showGMVTargetPopup;

    };

  // dashboard is first shown or when the user updates the run-rate data.
})();

<script id="dashboard-notification-v2-auto-admin">
(function(){
  const escN=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const STORE='sa_notification_admin_session_v1';
  let adminToken='', refreshToken='';

  function readSession(){
    try{
      const x=JSON.parse(localStorage.getItem(STORE)||'null');
      if(x&&x.access_token){adminToken=x.access_token;refreshToken=x.refresh_token||'';return true;}
    }catch(e){}
    return false;
  }
  function saveSession(d){
    adminToken=d?.access_token||'';
    refreshToken=d?.refresh_token||'';
    if(adminToken){
      try{localStorage.setItem(STORE,JSON.stringify({
        access_token:adminToken,
        refresh_token:refreshToken,
        saved_at:Date.now()
      }));}catch(e){}
    }
  }
  function clearSession(){
    adminToken='';refreshToken='';
    try{localStorage.removeItem(STORE);}catch(e){}
    updateButton();
  }
  async function refreshSession(){
    if(!refreshToken)return false;
    try{
      const c=window.SA_SUPABASE?.readConfig?window.SA_SUPABASE.readConfig():null;
      if(!c)return false;
      const r=await fetch(c.url+'/auth/v1/token?grant_type=refresh_token',{
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':c.anonKey},
        body:JSON.stringify({refresh_token:refreshToken})
      });
      const d=await r.json();
      if(!r.ok||!d.access_token)throw new Error('Session Admin kedaluwarsa.');
      saveSession(d); return true;
    }catch(e){clearSession();return false;}
  }
  async function ensureAdmin(){
    if(adminToken)return true;
    readSession();
    if(adminToken)return true;
    const ok=await refreshSession();
    if(ok)return true;
    return await this.connectAdmin();
  }
  function updateButton(){
    const b=document.getElementById('adminNotifConnectBtn');
    if(!b)return;
    readSession();
    if(adminToken){
      b.textContent='✅ Admin Terhubung';
      b.disabled=true;
      b.style.opacity='.75';
      b.title='Sesi Admin tersimpan di perangkat ini';
    }else{
      b.textContent='Hubungkan Admin';
      b.disabled=false;
      b.style.opacity='1';
      b.title='Hubungkan satu kali untuk menyimpan sesi Admin';
    }
  }

  window.SA_NOTIFICATION={
    async load(){
      try{
        const rows=await window.SA_SUPABASE.getNotifications();
        const active=rows.filter(x=>x.is_active&&String(x.message||'').trim());
        const el=document.getElementById('phNotificationTrack');
        if(el)el.innerHTML=active.length?active.map(x=>'🔔 '+escN(x.message)).join('   •   '):'Belum ada informasi terbaru.';
        return rows;
      }catch(e){console.warn('Notification load:',e);return [];}
    },
    async connectAdmin(){
      if(readSession()){updateButton();return true;}
      const email=prompt('Email Admin Supabase:'); if(!email)return false;
      const password=prompt('Password Admin Supabase:'); if(!password)return false;
      try{
        const d=await window.SA_SUPABASE.adminAuth(email,password);
        if(!d?.access_token)throw new Error('Token Admin tidak diterima.');
        saveSession(d);
        updateButton();
        return true;
      }catch(e){alert(e.message||'Login Admin gagal.');return false;}
    },
    async save(id){
      const ta=document.getElementById('adminNotifMessage'), active=document.getElementById('adminNotifActive');
      const msg=(ta?.value||'').trim(); if(!msg){alert('Teks notifikasi wajib diisi.');return;}
      if(!await ensureAdmin.call(this))return;
      try{
        if(id)await window.SA_SUPABASE.updateNotification(id,msg,!!active?.checked,adminToken);
        else await window.SA_SUPABASE.createNotification(msg,!!active?.checked,adminToken);
        if(ta)ta.value='';if(active)active.checked=true;
        document.getElementById('adminNotifEditId').value='';
        document.getElementById('adminNotifStatus').textContent='✅ Notifikasi berhasil disimpan.';
        await this.renderAdmin();await this.load();
      }catch(e){
        if(await refreshSession()){
          try{
            if(id)await window.SA_SUPABASE.updateNotification(id,msg,!!active?.checked,adminToken);
            else await window.SA_SUPABASE.createNotification(msg,!!active?.checked,adminToken);
            if(ta)ta.value='';if(active)active.checked=true;document.getElementById('adminNotifEditId').value='';
            document.getElementById('adminNotifStatus').textContent='✅ Notifikasi berhasil disimpan.';
            await this.renderAdmin();await this.load();return;
          }catch(_){}
        }
        clearSession();alert(e.message||'Gagal menyimpan notifikasi.');
      }
    },
    async remove(id){
      if(!confirm('Hapus notifikasi ini?'))return;
      if(!await ensureAdmin.call(this))return;
      try{
        await window.SA_SUPABASE.deleteNotification(id,adminToken);
        await this.renderAdmin();await this.load();
      }catch(e){clearSession();alert(e.message||'Gagal menghapus notifikasi.');}
    },
    edit(id){
      const row=(window.__saNotifRows||[]).find(x=>String(x.id)===String(id));if(!row)return;
      document.getElementById('adminNotifEditId').value=row.id;
      document.getElementById('adminNotifMessage').value=row.message||'';
      document.getElementById('adminNotifActive').checked=!!row.is_active;
      document.getElementById('adminNotifMessage').focus();
    },
    async renderAdmin(){
      const list=document.getElementById('adminNotifList');if(!list)return;
      const rows=await window.SA_SUPABASE.getNotifications().catch(()=>[]);
      window.__saNotifRows=rows;
      list.innerHTML=rows.length?rows.map(r=>`<div class="adminNotifRow"><div><div class="adminNotifText">${escN(r.message||'')}</div><div class="adminNotifMeta">${r.is_active?'🟢 Aktif':'⚪ Nonaktif'} • ${r.updated_at?new Date(r.updated_at).toLocaleString('id-ID'):'-'}</div></div><button class="adminNotifAction" type="button" onclick="SA_NOTIFICATION.edit('${r.id}')">Edit</button><button class="adminNotifAction danger" type="button" onclick="SA_NOTIFICATION.remove('${r.id}')">Hapus</button></div>`).join(''):'<div class="small">Belum ada notifikasi.</div>';
      updateButton();
    }
  };

  function injectAdmin(){
    const panel=document.getElementById('adminPanel');if(!panel||panel.querySelector('.adminNotifCard'))return;
    const card=document.createElement('section');card.className='adminNotifCard';
    card.innerHTML=`<div class="adminNotifHead"><div><h3>🔔 Kelola Notifikasi Dashboard</h3><div class="adminNotifSub">Tulis informasi manual yang akan berjalan di bawah dashboard SA.</div></div><button id="adminNotifConnectBtn" type="button" class="adminNotifAction" onclick="SA_NOTIFICATION.connectAdmin()">Hubungkan Admin</button></div><div class="adminNotifForm"><div><textarea id="adminNotifMessage" placeholder="Tulis informasi notifikasi di sini..."></textarea><input id="adminNotifEditId" type="hidden"></div><label class="adminNotifToggle"><input id="adminNotifActive" type="checkbox" checked> Aktif</label><button type="button" class="adminNotifBtn" onclick="SA_NOTIFICATION.save(document.getElementById('adminNotifEditId').value)">Simpan</button></div><div id="adminNotifStatus" class="adminNotifStatus"></div><div id="adminNotifList" class="adminNotifList"></div>`;
    const detail=panel.querySelector('#adminDetail');panel.insertBefore(card,detail||null);
    readSession();updateButton();setTimeout(()=>SA_NOTIFICATION.renderAdmin(),0);
  }
  function injectHome(){
    if(document.getElementById('phNotification'))return;
    /* Support both the legacy dashboard structure and the current SA dashboard. */
    /* Notification must sit below the complete Welcome header,
       not inside the Welcome row beside the greeting. */
    const anchor=document.querySelector('.main > .top')
      || document.querySelector('.top')
      || document.getElementById('journeyPremium')
      || document.getElementById('runratePencapaianCard');
    if(!anchor)return;
    const n=document.createElement('section');
    n.id='phNotification';
    n.className='phNotification';
    n.setAttribute('aria-label','Informasi terbaru dari Admin');
    n.innerHTML='<div class="phNotificationIcon" aria-hidden="true">🔔</div><div class="phNotificationViewport"><div id="phNotificationTrack" class="phNotificationTrack">Memuat informasi terbaru...</div></div>';
    anchor.insertAdjacentElement('afterend',n);
    setTimeout(()=>SA_NOTIFICATION.load(),0);
  }
  const oldHome=window.renderHome;if(typeof oldHome==='function')window.renderHome=function(){const r=oldHome.apply(this,arguments);setTimeout(injectHome,20);return r;};
  const obs=new MutationObserver(()=>{injectAdmin();injectHome();});obs.observe(document.body,{childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded',()=>{injectAdmin();injectHome();});
})();
</script>
<script id="runratePencapaianFinalFix">
(function(){
  function rrUser(){
    try{return (typeof state!=="undefined"&&state.user)?state.user:null}catch(e){return null}
  }
  function rrToday(){
    const d=new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function rrRaw(v){return String(v||"").replace(/\./g,"").replace(/[^0-9]/g,"")}
  function rrFmt(v){
    const n=rrRaw(v);
    return n?n.replace(/\B(?=(\d{3})+(?!\d))/g,"."):"";
  }
  window.openRunrateManual=function(){
    const u=rrUser();
    if(!u){alert("Sesi SA belum tersedia. Silakan login kembali.");return}
    const uid=String(u.id||u.ID||u.username||u.name||"");
    if(!uid){alert("ID SA tidak ditemukan.");return}

    const old=document.getElementById("runrateEditOverlay");
    if(old)old.remove();

    let db={};
    try{db=JSON.parse(localStorage.getItem("dailyGMVTargetData")||"{}")||{}}catch(e){}
    const today=rrToday(), last=db[uid]?.[today]||null;

    const ov=document.createElement("div");
    ov.id="runrateEditOverlay";
    ov.style.cssText="position:fixed;inset:0;z-index:2147483647;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:18px;box-sizing:border-box";
    ov.innerHTML=`<div style="width:min(420px,100%);background:#fff;border-radius:22px;padding:20px;box-sizing:border-box;box-shadow:0 25px 70px rgba(0,0,0,.25)">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">
        <div><div style="font-size:17px;font-weight:900;color:#182033">🎯 Runrate Pencapaian</div>
        <div style="font-size:10px;color:#7a8392;margin-top:3px">Update GMV/ACV dan target hari ini.</div></div>
        <button type="button" id="rrFinalClose" style="width:34px;height:34px;border:0;border-radius:50%;background:#f1f3f6;color:#596273;font-size:22px;cursor:pointer">×</button>
      </div>
      <label style="display:block;font-size:10px;font-weight:800;color:#4b5565;margin:14px 0 5px">TOTAL GMV / ACV</label>
      <input id="rrFinalGMV" inputmode="numeric" autocomplete="off" placeholder="Contoh: 62.000.000" value="${last?.gmv?rrFmt(last.gmv):""}" style="width:100%;box-sizing:border-box;border:1px solid #dfe3e9;border-radius:11px;padding:12px;font-size:14px;outline:none">
      <label style="display:block;font-size:10px;font-weight:800;color:#4b5565;margin:12px 0 5px">TARGET</label>
      <input id="rrFinalTarget" inputmode="numeric" autocomplete="off" placeholder="Contoh: 90.000.000" value="${last?.target?rrFmt(last.target):""}" style="width:100%;box-sizing:border-box;border:1px solid #dfe3e9;border-radius:11px;padding:12px;font-size:14px;outline:none">
      <div style="font-size:9px;color:#7a8392;margin-top:8px">Ach% = ACV ÷ Target. RR = ACV ÷ hari berjalan × jumlah hari bulan.</div>
      <button type="button" id="rrFinalSave" style="width:100%;margin-top:16px;border:0;border-radius:12px;padding:13px;background:#c8102e;color:#fff;font-size:12px;font-weight:900;cursor:pointer">Simpan & Hitung</button>
    </div>`;
    document.body.appendChild(ov);

    ["rrFinalGMV","rrFinalTarget"].forEach(id=>{
      const el=document.getElementById(id);
      el.addEventListener("input",function(){this.value=rrFmt(this.value)});
    });
    document.getElementById("rrFinalClose").onclick=()=>ov.remove();
    ov.addEventListener("click",e=>{if(e.target===ov)ov.remove()});
    document.getElementById("rrFinalSave").onclick=function(){
      const gmv=Number(rrRaw(document.getElementById("rrFinalGMV").value));
      const target=Number(rrRaw(document.getElementById("rrFinalTarget").value));
      if(!gmv||!target){alert("TOTAL GMV / ACV dan TARGET wajib diisi.");return}

<script id="authRefreshLogoutFixV108">
(function(){
  const KEY="sa_saved_login_v2";

  function readSaved(){
    try{
      const v=JSON.parse(localStorage.getItem(KEY)||"null");
      return v && v.id ? v : null;
    }catch(e){return null;}
  }

  function restoreSavedLogin(){
    try{
      if(typeof state==="undefined" || state.user) return false; return false;
      const saved=readSaved();
      if(!saved || typeof DB==="undefined" || !DB.users) return false;

      const id=String(saved.id).trim();
      const name=String(saved.name||DB.users[id]||"").trim();
      if(!id || !Object.prototype.hasOwnProperty.call(DB.users,id)) return false;

      state.user={id:id,name:String(DB.users[id]||name)};
      state.screen="home";
      state.module=null;
      state.slide=0;
      state.quizIndex=0;
      state.quizAnswers=[];
      state.quizScore=0;
      state.quizChoices=[];
      state.lastScore=0;
      state.currentAnswers=[];
      state.currentCorrect=0;
      state.currentWrong=0;
      state.currentIsRemedial=false;

      if(typeof syncQuizToAdmin==="function") syncQuizToAdmin();
      if(typeof render==="function") render();
      try{if(window.updateChatVisibility)window.updateChatVisibility();}catch(e){}
      return true;
    }catch(e){return false;}
  }

  // After refresh the login form may be rendered asynchronously.
  // Try several times, but only restore a previously saved account.
  function bootRestore(){
    if(restoreSavedLogin()) return;
    setTimeout(restoreSavedLogin,120);
    setTimeout(restoreSavedLogin,450);
    setTimeout(restoreSavedLogin,900);
  }

  // Do not let the old logout function silently exit.
  window.confirmSALogout=function(){
    const ok=window.confirm("Apakah kamu yakin ingin keluar dari SA Learning Center?");
    if(!ok) return false;
    try{
      if(typeof state!=="undefined"){
        state.user=null;
        state.screen="home";
        state.module=null;
        state.slide=0;
        state.quizIndex=0;
        state.quizAnswers=[];
        state.quizScore=0;
        state.quizChoices=[];
        state.lastScore=0;
        state.currentAnswers=[];
        state.currentCorrect=0;
        state.currentWrong=0;
        state.currentIsRemedial=false;
      }
      if(typeof render==="function") render();
      try{if(window.updateChatVisibility)window.updateChatVisibility();}catch(e){}
    }catch(e){}
    return false;
  };

  // Replace the app logout handler used by the dashboard button.
  window.logout=window.confirmSALogout;

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",bootRestore,{once:true});
  }else{
    bootRestore();
  }
})();
</script>

        if(!x||typeof x!=="object")return;
        const updated=String(r?.updated_at||r?.created_at||"");
        const prev=out[id];
        if(!prev || new Date(updated||0).getTime() >= new Date(prev.updated_at||0).getTime()){
          out[id]={x,updated_at:updated};
        }
      }catch(e){
        console.warn("[CONTENT CLOUD PARSE]",id,e);
      }
    });
    return out;
  }

  async function loadCloudContent(){
    const latest=parsePayloads(await cloudRows());
    let changed=false;
    const sameJSON=(a,b)=>{try{return JSON.stringify(a)===JSON.stringify(b)}catch(e){return false}};
    Object.keys(latest).forEach(k=>{
      const x=latest[k].x;
      if(k.startsWith('module:')){
        const id=k.slice(7);
        // Keep the bundled 28 Sep product update when an older cloud snapshot
        // is still present. A newer Admin Content Manager edit can still override it.
        const bundledContentUpdatedAt={akujaga:'2026-09-28T09:00:00+07:00',akusiaga:'2026-09-28T09:00:00+07:00'};
        const cloudUpdatedAt=String(latest[k]?.updated_at||'');
        if(bundledContentUpdatedAt[id] && cloudUpdatedAt && new Date(cloudUpdatedAt).getTime() < new Date(bundledContentUpdatedAt[id]).getTime()) return;
        if(SA_REMOVED_MODULE_IDS.has(String(id))){
          const before=DB.modules.length;
          DB.modules=DB.modules.filter(m=>!SA_REMOVED_MODULE_IDS.has(String(m.id)));
          if(DB.modules.length!==before) changed=true;
          return;
        }
        const i=DB.modules.findIndex(m=>String(m.id)===id);
        if(x.deleted){if(i>=0){DB.modules.splice(i,1);changed=true}}
        else if(x.module){
          const incoming=Object.assign({},x.module);
          const next=i>=0?Object.assign({},DB.modules[i],incoming):incoming;
          if(i>=0){
            if(!sameJSON(DB.modules[i],next)){DB.modules[i]=next;changed=true}
          }else{DB.modules.push(next);changed=true}
        }
      }
      if(k.startsWith('quizzes:')){
        const mid=k.slice(8);
        if(SA_REMOVED_MODULE_IDS.has(String(mid))){
          const before=DB.quizzes.length;
          DB.quizzes=DB.quizzes.filter(q=>String(q[0])!==mid);
          if(DB.quizzes.length!==before) changed=true;
          return;
        }
        const before=DB.quizzes.filter(q=>String(q[0])===mid);
        const incoming=(!x.deleted&&Array.isArray(x.quizzes))?x.quizzes:[];
        if(!sameJSON(before,incoming)){
          DB.quizzes=DB.quizzes.filter(q=>String(q[0])!==mid);
          incoming.forEach(q=>DB.quizzes.push(q));
          changed=true;
        }
      }
      if(k==='pages'){
        if(!x.deleted&&Array.isArray(x.pages)){
          let oldPages=[];
          try{oldPages=JSON.parse(localStorage.getItem("__SA_CONTENT_PAGES_V1__")||"[]")}catch(e){}
          if(!sameJSON(oldPages,x.pages)){
            savePagesLocal(x.pages);
            changed=true;
          }
        }
      }
    });
    // Re-apply the saved material placement after cloud synchronization.
    try{
      const ordered=[];
      DB.modules.forEach(m=>{if(!ordered.some(x=>String(x.id)===String(m.id))) ordered.push(m)});
      const byId=id=>ordered.findIndex(x=>String(x.id)===String(id));
      ordered.slice().forEach(m=>{
        const after=String(m?.placementAfter||'');
        if(!after)return;
        const mi=byId(m.id), ai=byId(after);
        if(mi<0||ai<0||mi===ai+1)return;
        const moved=ordered.splice(mi,1)[0];
        const target=byId(after);
        ordered.splice(target+1,0,moved);
      });
      DB.modules.splice(0,DB.modules.length,...ordered);
    }catch(e){console.warn('[CONTENT MANAGER ORDER]',e)}
    return changed;
  }

<script id="saAssignedPageRenderV1Logic">
(function(){
  "use strict";
  const PAGE_KEY="__SA_CONTENT_PAGES_V1__";
  const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","":"&quot;","'":"&#39;"}[m]));
  function pages(){
    const d=[{id:"belajar-tugas",title:"Belajar & Tugas",icon:"📚"},{id:"sa-advanced-center",title:"Tool Center",icon:"🚀"},{id:"informasi-update",title:"Informasi Update",icon:"🔔"}];
    try{const x=JSON.parse(localStorage.getItem(PAGE_KEY)||"null");if(Array.isArray(x)&&x.length)return x;}catch(e){}
    return d;
  }
  function pageId(m){return String(m?.pageId||"belajar-tugas");}
  function toolId(id){return ["m3plus","sa-activities","kalkulator-insentif"].includes(String(id));}
  function card(m){
    const p=progress(), ok=!!p.passed[m.id], r=p.read[m.id], score=Number((p.scores||{})[m.id]||0);
    const st=ok?`<span class="phStatus done">🟢 Selesai</span>`:(r&&r.completed&&score>0&&score<80)?`<span class="phStatus warn">🔴 Perlu diulang</span>`:r?`<span class="phStatus learning">🟡 Sedang belajar</span>`:`<span class="phStatus todo">⚪ Belum mulai</span>`;
    const icon=saMaterialIcon(m.id);
    return `<button class="phModule ${ok?"done":""}" onclick="openModule('${String(m.id).replace(/'/g,"\\'")}',false)"><div class="phIcon">${icon}</div><div class="phModuleText"><strong>${esc(m.title)}</strong><small>${ok?"Materi selesai":r?"Sedang dipelajari":"Belum diselesaikan"}</small></div>${st}</button>`;
  }
  function toolCard(m){
    return `<button class="phToolCard" onclick="openModule('${String(m.id).replace(/'/g,"\\'")}',false)"><div class="phToolIcon">${saMaterialIcon(m.id)}</div><div class="phModuleText"><strong>${esc(m.title)}</strong><small>${esc(m.desc||"Materi pembelajaran SA")}</small></div><span class="phToolArrow">›</span></button>`;
  }
  function renderAssigned(){
    const app=document.getElementById("app")||document.getElementById("root");if(!app||typeof DB==="undefined"||!Array.isArray(DB.modules))return;
    if(!state.user)return;
    // Dynamic page cards belong ONLY to the Dashboard SA (home).
    // Never inject them into an open lesson/material screen.
    if(state.screen!=="home")return;
    const all=DB.modules.filter(m=>m&&!toolId(m.id));
    // Keep existing default section intact except for modules explicitly assigned elsewhere.
    const learning=document.querySelector("#phMaterialsSection .phGrid");
    if(learning){
      learning.querySelectorAll(".phModule[data-cm-module]").forEach(x=>x.remove());
      all.filter(m=>pageId(m)==="belajar-tugas").forEach(m=>{
        if([...learning.querySelectorAll(".phModule")].some(x=>x.getAttribute("onclick")?.includes("'"+m.id+"'")))return;
        const wrap=document.createElement("div");wrap.innerHTML=card(m);const el=wrap.firstElementChild;if(el){el.setAttribute("data-cm-module","1");learning.appendChild(el)}
      });
      all.filter(m=>pageId(m)!=="belajar-tugas").forEach(m=>{learning.querySelectorAll(".phModule").forEach(x=>{if(x.getAttribute("onclick")?.includes("'"+m.id+"'"))x.remove()})});
    }
    const advanced=document.querySelector("#phAdvancedCenterSection .phGrid");
    if(advanced){advanced.querySelectorAll("[data-cm-module]").forEach(x=>x.remove());all.filter(m=>pageId(m)==="sa-advanced-center").forEach(m=>{const w=document.createElement("div");w.innerHTML=toolCard(m);const el=w.firstElementChild;if(el){el.setAttribute("data-cm-module","1");advanced.appendChild(el)}})}
    const info=document.querySelector("#phToolsSection .phToolsGrid");
    if(info){info.querySelectorAll("[data-cm-module]").forEach(x=>x.remove());all.filter(m=>pageId(m)==="informasi-update").forEach(m=>{const w=document.createElement("div");w.innerHTML=toolCard(m);const el=w.firstElementChild;if(el){el.setAttribute("data-cm-module","1");info.appendChild(el)}})}
    // Custom pages are appended only when they contain assigned material.
    document.querySelectorAll(".saDynamicPageSection").forEach(x=>x.remove());
    const known=new Set(["belajar-tugas","sa-advanced-center","informasi-update"]);
    pages().filter(pg=>!known.has(String(pg.id))).forEach(pg=>{
      const pid=String(pg.id||"");
      const ptitle=String(pg.title||"");
      const isPromo=/promo/i.test(pid)||/promo/i.test(ptitle);
      if(isPromo)return; // Promo September dinonaktifkan permanen dari tampilan SA. Backend/Admin tetap utuh.
      // Match the exact page assignment first. For Promo pages, also accept legacy
      // content carrying the same page title or a promo-prefixed module id.
      let mods=all.filter(m=>pageId(m)===pid);
      if(isPromo){
        const extra=all.filter(m=>{
          if(mods.some(x=>String(x.id)===String(m.id)))return false;
          const mt=String(m.pageTitle||"");
          const mi=String(m.id||"");
          return (ptitle&&mt&&mt.toLowerCase()===ptitle.toLowerCase()) || /^promo(?:-|_|\s)/i.test(mi);
        });
        mods=mods.concat(extra);
      }
      // A custom page such as Promo must remain visible even while its assigned
      // cards are being loaded from the cloud.
      if(!mods.length && !isPromo)return;
      const sec=document.createElement("section");sec.className="phSection saDynamicPageSection";sec.id="saDynamicPage-"+pid.replace(/[^a-zA-Z0-9_-]/g,"-");
      sec.innerHTML=`<div class="phSectionTitle"><h3>${esc(ptitle||pid)}</h3></div>${mods.length?`<div class="phGrid">${mods.map(card).join("")}</div>`:`<div class="phContinue"><div class="phContinueLabel">PROMO</div><div class="phContinueTitle">Memuat promo terbaru...</div><div class="small">Konten promo sedang disinkronkan dari Admin.</div></div>`}`;
      const infoSec=document.getElementById("phToolsSection");if(infoSec?.parentNode)infoSec.parentNode.insertBefore(sec,infoSec.nextSibling);else app.appendChild(sec);
    });
  }
  function run(){
    renderAssigned();
  }
  const oldRender=window.render;
  if(typeof oldRender==="function"&&!oldRender.__assignedPageV1){
    const wrapped=function(){const r=oldRender.apply(this,arguments);run();return r};wrapped.__assignedPageV1=true;window.render=wrapped;
  }
  document.addEventListener("DOMContentLoaded",async()=>{try{if(typeof window.saLoadContentManagerContent==='function')await window.saLoadContentManagerContent()}catch(e){};run()},{once:true});
  // Keep custom pages (including Promo) synchronized with Admin cloud changes.
  if(!window.__saPromoSyncIntervalV1){
    window.__saPromoSyncIntervalV1=setInterval(async()=>{
      try{
        if(state?.screen!=="home")return;
        if(typeof window.saLoadContentManagerContent==='function'){
          const changed=await window.saLoadContentManagerContent();
          if(changed) render();
        }
      }catch(e){}
    },30000);
  }
})();
</script>

function changeProfilePhoto(e){
  const input=e&&e.target;
  const f=input&&input.files&&input.files[0];
  if(!f)return;
  const type=String(f.type||'').toLowerCase();
  const name=String(f.name||'').toLowerCase();
  const isImage=/^image\//.test(type)||/\.(jpg|jpeg|png|webp|gif|bmp|heic|heif)$/i.test(name);
  if(!isImage){alert('⚠️ Silakan pilih file foto dari galeri.');input.value='';return;}
  if(f.size>12*1024*1024){alert('⚠️ Ukuran foto terlalu besar. Pilih foto maksimal 12 MB.');input.value='';return;}
  const id=String(state.user?.id||'SA');
  const key='saProfilePhoto_'+id;
  let objectUrl='';
  const finish=(data)=>{
    try{
      localStorage.setItem(key,data);
      localStorage.setItem('saProfilePhoto',data);
      [document.getElementById('profilePhotoBox'),document.getElementById('sidebarProfilePhoto')].forEach(x=>{
        if(x){x.innerHTML='';x.style.backgroundImage='url("'+data+'")';x.style.backgroundSize='cover';x.style.backgroundPosition='center';x.classList.remove('profile-placeholder');}
      });
      if(window.SA_SUPABASE?.updateProfilePhoto&&state.user?.id){
        window.SA_SUPABASE.updateProfilePhoto(String(state.user.id),data).catch(()=>{});
      }
      input.value='';
      alert('✅ Foto profil berhasil digunakan.');
    }catch(err){
      input.value='';
      alert('❌ Foto gagal disimpan. Silakan pilih foto lain.');
    }
  };
  const reader=new FileReader();
  reader.onload=()=>{
    const raw=String(reader.result||'');
    const img=new Image();
    img.onload=()=>{
      try{
        const max=1000;
        const ow=Number(img.naturalWidth||img.width||1),oh=Number(img.naturalHeight||img.height||1);
        const scale=Math.min(1,max/Math.max(ow,oh));
        const w=Math.max(1,Math.round(ow*scale)),h=Math.max(1,Math.round(oh*scale));
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const ctx=c.getContext('2d',{alpha:false});
        if(!ctx)throw new Error('canvas');
        ctx.drawImage(img,0,0,w,h);
        finish(c.toDataURL('image/jpeg',0.82));
      }catch(err){
        input.value='';
        alert('❌ Foto tidak dapat diproses. Silakan pilih foto JPG/PNG dari galeri.');
      }finally{if(objectUrl)URL.revokeObjectURL(objectUrl);}
    };
    img.onerror=()=>{
      input.value='';
      if(objectUrl)URL.revokeObjectURL(objectUrl);
      alert('❌ Foto tidak dapat dibaca. Silakan pilih foto JPG/PNG dari galeri.');
    };
    try{
      objectUrl=URL.createObjectURL(f);
      img.src=objectUrl;
    }catch(_){img.src=raw;}
  };
  reader.onerror=()=>{input.value='';alert('❌ Galeri tidak dapat dibaca. Silakan coba pilih foto lagi.');};
  reader.readAsDataURL(f);
}
