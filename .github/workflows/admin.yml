name: Build SA Learning Center Admin APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-admin-apk:
    name: Build Admin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Find Admin ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./admin-project/*" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "File ZIP Admin Android tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Admin Android Project
        run: |
          rm -rf admin-project
          mkdir -p admin-project

          unzip -q "${{ steps.zip.outputs.zip }}" -d admin-project

          echo "Isi hasil extract:"
          find admin-project -maxdepth 4 -type f | head -100

      - name: Find Admin Project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=""

          # Prioritas 1: settings.gradle / settings.gradle.kts
          SETTINGS_FILE=$(find admin-project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          # Prioritas 2: gradlew
          if [ -z "$PROJECT_DIR" ]; then
            GRADLEW_FILE=$(find admin-project \
              -type f \
              -name "gradlew" \
              -print -quit)

            if [ -n "$GRADLEW_FILE" ]; then
              PROJECT_DIR=$(dirname "$GRADLEW_FILE")
            fi
          fi

          # Prioritas 3: build.gradle / build.gradle.kts
          if [ -z "$PROJECT_DIR" ]; then
            BUILD_FILE=$(find admin-project \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print -quit)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "Admin Android project tidak ditemukan."
            echo ""
            echo "Struktur file yang ditemukan:"
            find admin-project -maxdepth 5 -type f
            exit 1
          fi

          echo "Admin project ditemukan:"
          echo "$PROJECT_DIR"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Check Android Project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          find . -maxdepth 3 -type f | sort | head -100

      - name: Build Admin APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Prepare APK
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.dir }}" \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan setelah proses build."
            echo ""
            echo "File APK yang tersedia:"
            find "${{ steps.project.outputs.dir }}" \
              -type f \
              -name "*.apk" \
              -print
            exit 1
          fi

          echo "APK ditemukan: $APK"

          rm -rf apk-output
          mkdir -p apk-output

          cp "$APK" apk-output/SA-Learning-Center-Admin.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: SA-Learning-Center-Admin-APK
          path: apk-output/SA-Learning-Center-Admin.apk
          if-no-files-found: error
          retention-days: 7
