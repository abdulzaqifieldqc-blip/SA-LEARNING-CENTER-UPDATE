name: Build SA Learning Center Admin APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-admin-apk:
    name: Build Admin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract Admin Android Project
        run: |
            mkdir -p admin-project
            ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
            if [ -z "$ZIP_FILE" ]; then
              echo "File ZIP Admin Android tidak ditemukan."
              exit 1
            fi
            echo "ZIP ditemukan: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d admin-project
            
      - name: Find Admin Project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=$(find admin-project -type f -name "settings.gradle*" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Admin Android project tidak ditemukan."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Admin project: $PROJECT_DIR"

      - name: Build Admin APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.dir }}/app/build/outputs/apk" -type f -name "*.apk" | head -n 1)

          test -n "$APK"

          mkdir -p apk-output

          cp "$APK" apk-output/SA-Learning-Center-Admin.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: SA-Learning-Center-Admin-APK
          path: apk-output/SA-Learning-Center-Admin.apk
          if-no-files-found: error
          retention-days: 7
