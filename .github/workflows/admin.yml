name: Build SA Learning Center Admin APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-admin-apk:
    name: Build Admin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find HTML File
        id: html
        shell: bash
        run: |
          HTML_FILE=$(find . \
            -type f \
            -iname "*.html" \
            -not -path "./admin-project/*" \
            -print -quit)

          if [ -z "$HTML_FILE" ]; then
            echo "File HTML Admin tidak ditemukan."
            exit 1
          fi

          echo "HTML ditemukan:"
          echo "$HTML_FILE"

          echo "file=$HTML_FILE" >> "$GITHUB_OUTPUT"

      - name: Create Android Project
        shell: bash
        run: |
          rm -rf admin-project

          mkdir -p admin-project/app/src/main/java/com/salearning/admin
          mkdir -p admin-project/app/src/main/assets
          mkdir -p admin-project/app/src/main/res/mipmap-hdpi
          mkdir -p admin-project/app/src/main/res/mipmap-mdpi
          mkdir -p admin-project/app/src/main/res/mipmap-xhdpi
          mkdir -p admin-project/app/src/main/res/mipmap-xxhdpi
          mkdir -p admin-project/app/src/main/res/mipmap-xxxhdpi

          cp "${{ steps.html.outputs.file }}" \
            admin-project/app/src/main/assets/index.html

          cat > admin-project/settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "SA-Learning-Center-Admin"
include(":app")
EOF

          cat > admin-project/build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.6.1' apply false
}
EOF

          cat > admin-project/gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
EOF

          cat > admin-project/app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.salearning.admin'
    compileSdk 35

    defaultConfig {
        applicationId 'com.salearning.admin'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }

        debug {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
}
EOF

          cat > admin-project/app/src/main/AndroidManifest.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <uses-permission android:name="android.permission.INTERNET" />

    <application
        android:allowBackup="false"
        android:usesCleartextTraffic="true"
        android:label="SA Learning Center Admin"
        android:theme="@style/AppTheme">

        <activity
            android:name=".MainActivity"
            android:screenOrientation="portrait"
            android:exported="true">

            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>

        </activity>

    </application>

</manifest>
EOF

          mkdir -p admin-project/app/src/main/res/values

          cat > admin-project/app/src/main/res/values/styles.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>

    <style name="AppTheme"
        parent="Theme.AppCompat.Light.NoActionBar">

        <item name="android:fontFamily">sans</item>
        <item name="android:windowActionModeOverlay">true</item>
        <item name="android:windowNoTitle">true</item>
        <item name="android:colorAccent">#D71945</item>

    </style>

</resources>
EOF

          cat > admin-project/app/src/main/java/com/salearning/admin/MainActivity.java <<'EOF'
package com.salearning.admin;

import android.annotation.SuppressLint;
import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebChromeClient;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;

public class MainActivity extends Activity {

    private WebView webView;

    @SuppressLint("SetJavaScriptEnabled")
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        webView = new WebView(this);

        WebSettings settings = webView.getSettings();

        settings.setJavaScriptEnabled(true);
        settings.setDomStorageEnabled(true);
        settings.setDatabaseEnabled(true);
        settings.setAllowFileAccess(true);
        settings.setAllowContentAccess(true);
        settings.setBuiltInZoomControls(false);
        settings.setDisplayZoomControls(false);
        settings.setLoadWithOverviewMode(false);
        settings.setUseWideViewPort(false);

        webView.setWebViewClient(new WebViewClient());
        webView.setWebChromeClient(new WebChromeClient());

        setContentView(webView);

        webView.loadUrl("file:///android_asset/index.html");
    }

    @Override
    public void onBackPressed() {

        if (webView != null && webView.canGoBack()) {
            webView.goBack();
        } else {
            super.onBackPressed();
        }
    }

    @Override
    protected void onDestroy() {

        if (webView != null) {
            webView.destroy();
        }

        super.onDestroy();
    }
}
EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Admin APK
        working-directory: admin-project
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          APK=$(find admin-project/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan."
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          mkdir -p apk-output

          cp "$APK" \
            apk-output/SA-Learning-Center-Admin.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: SA-Learning-Center-Admin-APK
          path: apk-output/SA-Learning-Center-Admin.apk
          if-no-files-found: error
          retention-days: 7
