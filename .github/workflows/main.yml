name: Build SA Learning Center APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android Project ZIP
        shell: bash
        run: |
          mkdir -p android-project

          ZIP_FILE="$(find . -maxdepth 3 -type f \
            \( -iname "*ANDROID_PROJECT*.zip" \
            -o -iname "*GITHUB_READY*.zip" \
            -o -iname "*.zip" \) \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP Android Project tidak ditemukan."
            echo "File ZIP yang tersedia:"
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d android-project

          echo "Isi hasil extract:"
          find android-project -maxdepth 5 -type f -print | sort

      - name: Find Android project
        id: find-project
        shell: bash
        run: |
          PROJECT_DIR="$(find android-project -type f -name "gradlew" -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew tidak ditemukan."

            echo "Struktur folder:"
            find android-project -maxdepth 6 -type f -print | sort

            exit 1
          fi

          echo "Android project ditemukan:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Show project structure
        shell: bash
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        run: |
          echo "=== PROJECT STRUCTURE ==="
          find . -maxdepth 4 -type f -print | sort

          echo
          echo "=== GRADLE FILES ==="
          ls -la

      - name: Make Gradle executable
        shell: bash
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        run: |
          chmod +x ./gradlew

      - name: Build APK
        shell: bash
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Find APK
        id: find-apk
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.find-project.outputs.project_dir }}"

          APK_PATH="$(find "$PROJECT_DIR" \
            -type f \
            -name "app-debug.apk" \
            -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: app-debug.apk tidak ditemukan."

            echo
            echo "=== SEMUA APK ==="
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print || true

            echo
            echo "=== BUILD OUTPUT ==="
            find "$PROJECT_DIR/app/build" \
              -maxdepth 6 \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK_PATH"

          echo
          echo "Ukuran APK:"
          ls -lh "$APK_PATH"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK_PATH" \
            "$GITHUB_WORKSPACE/apk-output/SA-Learning-Center.apk"

          echo
          echo "APK siap di-upload:"
          ls -lh "$GITHUB_WORKSPACE/apk-output/SA-Learning-Center.apk"

          echo "apk_path=$GITHUB_WORKSPACE/apk-output/SA-Learning-Center.apk" >> "$GITHUB_OUTPUT"

      - name: Verify APK
        shell: bash
        run: |
          APK="$GITHUB_WORKSPACE/apk-output/SA-Learning-Center.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: File APK tidak ada."
            exit 1
          fi

          echo "APK FINAL:"
          ls -lh "$APK"

          echo
          echo "APK berhasil dibuat dan siap di-upload."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SA-Learning-Center-APK
          path: ${{ steps.find-apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 7
