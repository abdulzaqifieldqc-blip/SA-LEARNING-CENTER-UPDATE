name: Build SA Learning Center APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android Project ZIP
        id: find-android-zip
        shell: bash
        run: |
          ZIP_FILE="./SA_Learning_Center_ANDROID_PROJECT_BACK_FIXED_ORIGINAL_BASELINE.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP tidak ditemukan"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP ditemukan:"
          ls -lh "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Android Project
        shell: bash
        run: |
          rm -rf android-project
          mkdir -p android-project

          unzip -q \
            "${{ steps.find-android-zip.outputs.zip_file }}" \
            -d android-project

          echo "Struktur project:"
          find android-project -maxdepth 5 -type f \
            -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" \
            -print

      - name: Find Gradle Project
        id: find-project
        shell: bash
        run: |
          GRADLEW=$(find android-project \
            -type f \
            -name "gradlew" \
            -print \
            -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew tidak ditemukan!"
            echo "Isi ZIP:"
            find android-project -maxdepth 6 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradle wrapper:"
          echo "$GRADLEW"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Enable AndroidX
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.find-project.outputs.project_dir }}"

          touch "$PROJECT_DIR/gradle.properties"

          if ! grep -q "^android.useAndroidX=" "$PROJECT_DIR/gradle.properties"; then
            echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"
          fi

          if ! grep -q "^android.enableJetifier=" "$PROJECT_DIR/gradle.properties"; then
            echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"
          fi

          echo "gradle.properties:"
          cat "$PROJECT_DIR/gradle.properties"

      - name: Check Gradle Wrapper
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.find-project.outputs.project_dir }}"

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          echo "Gradle wrapper ditemukan:"
          ls -lh ./gradlew

          ./gradlew --version

      - name: Build APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.find-project.outputs.project_dir }}"

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          echo "======================================"
          echo "BUILD APK"
          echo "======================================"

          ./gradlew clean assembleDebug --stacktrace

      - name: Find APK
        id: find-apk
        shell: bash
        run: |
          APK=$(find "${{ steps.find-project.outputs.project_dir }}" \
            -type f \
            -name "app-debug.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
           
