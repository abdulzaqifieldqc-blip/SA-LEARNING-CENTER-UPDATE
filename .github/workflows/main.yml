-- Jalankan di Supabase > SQL Editor sebelum memakai versi HTML yang baru.
-- Aman dijalankan berulang kali karena memakai IF NOT EXISTS.

ALTER TABLE public.sa_users
  ADD COLUMN IF NOT EXISTS area text,
  ADD COLUMN IF NOT EXISTS join_date date,
  ADD COLUMN IF NOT EXISTS vintage text;

-- Opsional: index untuk pencarian ID SA yang lebih cepat.
CREATE INDEX IF NOT EXISTS idx_sa_users_id_sa ON public.sa_users (id_sa);
