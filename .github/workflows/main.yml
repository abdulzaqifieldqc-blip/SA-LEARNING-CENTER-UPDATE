name: Build SA Learning Center APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Find Android project
        id: find-project
        shell: bash
        run: |
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.gradle/*" \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            echo ""
            echo "Struktur repository:"
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Android project ditemukan:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Show project structure
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        run: |
          echo "=== PROJECT ROOT ==="
          pwd
          echo ""
          echo "=== FILES ==="
          find . -maxdepth 3 -type f | sort

      - name: Build APK
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Find APK
        id: find-apk
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        shell: bash
        run: |
          APK_PATH="$(find . -type f -name "*.apk" -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK tidak ditemukan."
            echo ""
            echo "Isi folder build:"
            find . -type f | grep -E 'build|apk' || true
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK_PATH"

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SA-Learning-Center-APK
          path: ${{ steps.find-project.outputs.project_dir }}/${{ steps.find-apk.outputs.apk_path }}
          if-no-files-found: error
