name: Build SA Learning Center APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android Project ZIP
        id: find-android-zip
        shell: bash
        run: |
          SA_Learning_Center_ANDROID_PROJECT_BACK_FIXED_ORIGINAL_BASELINE.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP Android Project tidak ditemukan:"
            echo "$ZIP_FILE"
            echo
            echo "ZIP yang tersedia:"
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo "ANDROID PROJECT ZIP DITEMUKAN"
          echo "$ZIP_FILE"

          echo "android_zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Android Project ZIP
        shell: bash
        run: |
          rm -rf android-project
          mkdir -p android-project

          unzip -q \
            "${{ steps.find-android-zip.outputs.android_zip }}" \
            -d android-project

          echo "HASIL EXTRACT:"
          find android-project -maxdepth 6 -type f -print | sort

      - name: Find Android Project
        id: find-project
        shell: bash
        run: |
          PROJECT_DIR=""

          while IFS= read -r -d '' SETTINGS_FILE; do
            CANDIDATE_DIR="$(dirname "$SETTINGS_FILE")"

            if [ -f "$CANDIDATE_DIR/app/build.gradle" ] || \
               [ -f "$CANDIDATE_DIR/app/build.gradle.kts" ]; then
              PROJECT_DIR="$CANDIDATE_DIR"
              break
            fi

          done < <(
            find android-project \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project tidak ditemukan."
            find android-project -maxdepth 8 -print | sort
            exit 1
          fi

          echo "ANDROID PROJECT DITEMUKAN:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Enable AndroidX
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.find-project.outputs.project_dir }}"

          touch "$PROJECT_DIR/gradle.properties"

          if grep -q '^android.useAndroidX=' "$PROJECT_DIR/gradle.properties"; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' \
              "$PROJECT_DIR/gradle.properties"
          else
            echo 'android.useAndroidX=true' >> \
              "$PROJECT_DIR/gradle.properties"
          fi

          if grep -q '^android.enableJetifier=' "$PROJECT_DIR/gradle.properties"; then
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' \
              "$PROJECT_DIR/gradle.properties"
          else
            echo 'android.enableJetifier=true' >> \
              "$PROJECT_DIR/gradle.properties"
          fi

          echo "======================================"
          echo "ANDROIDX CONFIGURATION"
          echo "======================================"

          cat "$PROJECT_DIR/gradle.properties"

      - name: Show Project Structure
        shell: bash
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        run: |
          echo "PROJECT STRUCTURE:"
          find . -maxdepth 6 -type f -print | sort

          echo
          echo "ROOT PROJECT:"
          ls -la

      - name: Build APK
        shell: bash
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        run: |
          echo "======================================"
          echo "BUILD APK"
          echo "======================================"

          gradle assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Find APK
        id: find-apk
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.find-project.outputs.project_dir }}"

          APK_PATH="$(find "$PROJECT_DIR" \
            -type f \
            -name "app-debug.apk" \
            -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK tidak ditemukan."

            echo
            echo "Semua file APK:"
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "APK DITEMUKAN:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK_PATH" \
            "$GITHUB_WORKSPACE/apk-output/SA-Learning-Center.apk"

          echo "apk_path=$GITHUB_WORKSPACE/apk-output/SA-Learning-Center.apk" \
            >> "$GITHUB_OUTPUT"

      - name: Verify APK
        shell: bash
        run: |
          APK="$GITHUB_WORKSPACE/apk-output/SA-Learning-Center.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK final tidak ditemukan."
            exit 1
          fi

          echo "======================================"
          echo "APK BERHASIL DIBUAT"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SA-Learning-Center-APK
          path: ${{ steps.find-apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 7
