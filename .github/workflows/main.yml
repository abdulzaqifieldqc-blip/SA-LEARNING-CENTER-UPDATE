name: Build SA Learning Center APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Find Android project ZIP
        id: find-zip
        shell: bash
        run: |
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -iname '*ANDROID_PROJECT*.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP Android project tidak ditemukan."
            echo ""
            echo "ZIP yang tersedia:"
            find "$GITHUB_WORKSPACE" -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP Android project ditemukan:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Android Project
        run: |
          rm -rf "$GITHUB_WORKSPACE/android-project"
          mkdir -p "$GITHUB_WORKSPACE/android-project"

          unzip -o "${{ steps.find-zip.outputs.zip_file }}" \
            -d "$GITHUB_WORKSPACE/android-project"

          echo "=== HASIL EXTRACT ==="
          find "$GITHUB_WORKSPACE/android-project" -maxdepth 5 -type f | sort

      - name: Find Android project
        id: find-project
        shell: bash
        run: |
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/android-project" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.gradle/*" \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle tidak ditemukan setelah ZIP diekstrak."
            echo ""
            echo "Struktur hasil extract:"
            find "$GITHUB_WORKSPACE/android-project" -maxdepth 6 -print | sort
            exit 1
          fi

          echo "Android project ditemukan:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Show project structure
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        run: |
          echo "=== PROJECT ROOT ==="
          pwd
          echo ""
          echo "=== PROJECT FILES ==="
          find . -maxdepth 4 -type f | sort

      - name: Make Gradle executable
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build APK
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Find APK
  id: find-apk
  working-directory: ${{ steps.find-project.outputs.project_dir }}
  shell: bash
  run: |
    APK_PATH="$(find . \
      -type f \
      -name "*.apk" \
      -print -quit)"

    if [ -z "$APK_PATH" ]; then
      echo "ERROR: APK tidak ditemukan."
      exit 1
    fi

    # Hapus ./ di awal path
    APK_PATH="${APK_PATH#./}"

    echo "APK ditemukan:"
    echo "$APK_PATH"

    echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SA-Learning-Center-APK
          path: ${{ steps.find-project.outputs.project_dir }}/${{ steps.find-apk.outputs.apk_path }}
          if-no-files-found: error
