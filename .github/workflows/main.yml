name: Build SA Learning Center APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android Project ZIP
        id: find-android-zip
        shell: bash
        run: |
          ZIP_FILE="./SA_Learning_Center_ANDROID_PROJECT_BACK_FIXED_ORIGINAL_BASELINE.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP tidak ditemukan!"
            echo ""
            echo "ZIP yang tersedia:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP ditemukan:"
          ls -lh "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Android Project
        shell: bash
        run: |
          rm -rf android-project
          mkdir -p android-project

          unzip -q \
            "${{ steps.find-android-zip.outputs.zip_file }}" \
            -d android-project

          echo "======================================"
          echo "PROJECT CONTENT"
          echo "======================================"

          find android-project -maxdepth 6 -type f -print

      - name: Find Android Project
        id: find-project
        shell: bash
        run: |
          SETTINGS=$(find android-project \
            -type f \
            -name "settings.gradle" \
            -print \
            -quit)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find android-project \
              -type f \
              -name "settings.gradle.kts" \
              -print \
              -quit)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "======================================"
          echo "ANDROID PROJECT"
          echo "======================================"

          echo "Settings:"
          echo "$SETTINGS"

          echo "Project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Enable AndroidX
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.find-project.outputs.project_dir }}"

          touch "$PROJECT_DIR/gradle.properties"

          if ! grep -q "^android.useAndroidX=" "$PROJECT_DIR/gradle.properties"; then
            echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"
          fi

          if ! grep -q "^android.enableJetifier=" "$PROJECT_DIR/gradle.properties"; then
            echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"
          fi

          echo "======================================"
          echo "GRADLE PROPERTIES"
          echo "======================================"

          cat "$PROJECT_DIR/gradle.properties"

      - name: Check Gradle
        shell: bash
        run: |
          echo "======================================"
          echo "GRADLE VERSION"
          echo "======================================"

          gradle --version

      - name: Build APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.find-project.outputs.project_dir }}"

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILD SA LEARNING CENTER APK"
          echo "======================================"

          gradle clean assembleDebug --stacktrace

      - name: Find APK
        id: find-apk
        shell: bash
        run: |
          APK=$(find "${{ steps.find-project.outputs.project_dir }}" \
            -type f \
            -name "app-debug.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: app-debug.apk tidak ditemukan!"

            echo ""
            echo "APK yang tersedia:"
            find "${{ steps.find-project.outputs.project_dir }}" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "======================================"
          echo "APK DITEMUKAN"
          echo "======================================"

          ls -lh "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK
        shell: bash
        run: |
          APK="${{ steps.find-apk.outputs.apk_path }}"

          echo "======================================"
          echo "APK BERHASIL DIBUAT"
          echo "======================================"

          ls -lh "$APK"
          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SA-Learning-Center-APK-BACK-FIXED
          path: ${{ steps.find-apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
